<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ইনভেস্ট লেজার প্রো</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ===== ROOT ===== */
        :root {
            --green: #1ea672;
            --green-2: #0f8a5f;
            --green-glow: rgba(30, 166, 114, 0.35);
            --red: #e5484d;
            --red-2: #c62f34;
            --red-glow: rgba(229, 72, 77, 0.30);
            --orange: #f2994a;
            --orange-2: #d9772e;
            --orange-glow: rgba(242, 153, 74, 0.30);
            --bg-1: #f1f6f2;
            --bg-2: #e9f2ec;
            --bg-3: #eef8f1;
            --glass: rgba(255, 255, 255, 0.65);
            --glass-brd: rgba(20, 60, 45, 0.10);
            --glass-hi: rgba(255, 255, 255, 0.80);
            --text-1: #0e2019;
            --text-2: #3c5a4e;
            --text-3: #6b8578;
            --shadow-soft: 0 20px 50px -24px rgba(20, 60, 45, 0.25);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.08);
            --radius-cap: 999px;
            --radius-card: 26px;
            --radius-sm: 16px;
            --sidebar-width: 220px;
            --blur-glass: 18px;
        }
        html[data-theme="dark"] {
            --bg-1: #0c1a17;
            --bg-2: #0a1512;
            --bg-3: #0e2019;
            --glass: rgba(255, 255, 255, 0.055);
            --glass-brd: rgba(255, 255, 255, 0.10);
            --glass-hi: rgba(255, 255, 255, 0.09);
            --text-1: #eef7f2;
            --text-2: #a9c2b8;
            --text-3: #7d968c;
            --shadow-soft: 0 20px 50px -20px rgba(0, 0, 0, 0.55);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Hind Siliguri', 'Manrope', sans-serif;
            background:
                radial-gradient(1100px 700px at 8% -10%, rgba(30, 166, 114, 0.12), transparent 60%),
                radial-gradient(900px 600px at 100% 0%, rgba(242, 153, 74, 0.08), transparent 55%),
                radial-gradient(800px 700px at 50% 120%, rgba(229, 72, 77, 0.06), transparent 55%),
                linear-gradient(180deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3));
            min-height: 100vh;
            color: var(--text-1);
            transition: background .4s ease, color .3s ease;
        }
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--glass-brd);
            border-radius: 99px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        .font-en {
            font-family: 'Manrope', sans-serif;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .app {
            display: flex;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            padding: 16px 10px;
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 50;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            background: var(--bg-2);
            border-right: 1px solid var(--glass-brd);
        }
        .sidebar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 8px 10px;
            flex-shrink: 0;
        }
        .sidebar .brand-mark {
            width: 36px;
            height: 36px;
            border-radius: 14px;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--green), var(--orange));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #08130f;
            box-shadow: 0 8px 20px -6px var(--green-glow);
            font-size: 14px;
        }
        .sidebar .brand-title {
            font-weight: 800;
            font-size: 14px;
            letter-spacing: .2px;
            white-space: nowrap;
        }
        .sidebar .brand-sub {
            font-size: 10px;
            color: var(--text-3);
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .nav {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow-y: auto;
            flex: 1;
            padding-right: 2px;
        }
        .navgroup-label {
            font-size: 9.5px;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 8px 10px 3px;
            opacity: 0.7;
            white-space: nowrap;
        }
        .navitem {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: var(--radius-cap);
            color: var(--text-2);
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            border: 1px solid transparent;
            transition: all .18s ease;
            white-space: nowrap;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .navitem:hover {
            background: var(--glass);
            color: var(--text-1);
            border-color: var(--glass-brd);
        }
        .navitem.active {
            background: linear-gradient(135deg, var(--green-glow), transparent 70%);
            border-color: rgba(30, 166, 114, 0.4);
            color: var(--text-1);
            box-shadow: inset 0 0 0 1px rgba(30, 166, 114, 0.15);
        }
        .navitem .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-3);
            flex-shrink: 0;
        }
        .navitem.active .dot {
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
        }

        .side-foot {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--glass-brd);
            align-items: center;
            flex-shrink: 0;
        }
        .toggle-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .roundtoggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--glass-brd);
            background: var(--glass);
            color: var(--text-1);
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .25s ease;
            box-shadow: 0 8px 20px -10px rgba(0, 0, 0, 0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .roundtoggle:hover {
            transform: translateY(-2px);
            border-color: rgba(30, 166, 114, 0.4);
        }
        .roundtoggle:active {
            transform: scale(.92);
        }
        .roundtoggle .icon {
            font-size: 16px;
            line-height: 1;
        }
        .roundtoggle.lang-btn {
            background: linear-gradient(135deg, var(--green-glow), transparent 70%);
        }
        .roundtoggle.theme-btn {
            background: linear-gradient(135deg, var(--orange-glow), transparent 70%);
        }
        .roundtoggle-label {
            font-size: 9px;
            color: var(--text-3);
            text-align: center;
            margin-top: -2px;
        }
        .toggle-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .sidebar-toggle {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 60;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--glass-brd);
            background: var(--glass);
            backdrop-filter: blur(20px);
            color: var(--text-1);
            font-size: 22px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all .3s ease;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .sidebar-toggle:hover {
            transform: scale(1.05);
            border-color: var(--green);
        }
        .sidebar-toggle:active {
            transform: scale(.92);
        }
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 45;
            display: none;
            opacity: 0;
            transition: opacity .35s ease;
        }
        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        /* ===== MAIN ===== */
        .main {
            flex: 1;
            min-width: 0;
            padding: 20px 26px 50px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .page-title {
            font-size: 24px;
            font-weight: 800;
        }
        .page-sub {
            color: var(--text-3);
            font-size: 12.5px;
            margin-top: 2px;
        }
        .biz-switch {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass);
            border: 1px solid var(--glass-brd);
            padding: 5px 5px 5px 14px;
            border-radius: var(--radius-cap);
            backdrop-filter: blur(20px);
        }
        .biz-switch select {
            background: transparent;
            border: none;
            color: var(--text-1);
            font-weight: 700;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .biz-switch select option {
            background: #0e2019;
            color: #eef7f2;
        }
        html[data-theme="light"] .biz-switch select option {
            background: #fff;
            color: #0e2019;
        }

        /* ===== NOTIFICATION BELL + DROPDOWN ===== */
        .notif-wrapper {
            position: relative;
        }
        .notification-bell {
            position: relative;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            padding: 8px;
            border-radius: 50%;
            transition: all .25s ease;
            border: 1px solid var(--glass-brd);
            background: var(--glass);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .notification-bell:hover {
            transform: scale(1.05);
            border-color: var(--green);
        }
        .notification-bell .badge-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--red);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-1);
        }

        .notification-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 380px;
            max-height: 420px;
            overflow-y: auto;
            background: var(--bg-2);
            border: 1px solid var(--glass-brd);
            border-radius: var(--radius-card);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            padding: 12px;
            display: none;
            z-index: 999;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .notification-dropdown.open {
            display: block;
        }
        .notification-dropdown .notif-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--glass-brd);
            font-size: 12.5px;
            cursor: pointer;
            transition: all .2s ease;
            border-radius: 8px;
        }
        .notification-dropdown .notif-item:hover {
            background: var(--glass);
        }
        .notification-dropdown .notif-item:last-child {
            border-bottom: none;
        }
        .notification-dropdown .notif-item .time {
            font-size: 10px;
            color: var(--text-3);
            font-family: 'JetBrains Mono', monospace;
        }
        .notification-dropdown .notif-item .badge-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            margin-right: 6px;
        }
        .notification-dropdown .notif-item.unread {
            background: rgba(30, 166, 114, 0.06);
        }
        .notification-dropdown .notif-empty {
            text-align: center;
            padding: 30px;
            color: var(--text-3);
        }
        .notification-dropdown .notif-close-btn {
            position: sticky;
            bottom: 0;
            background: var(--bg-2);
            padding: 8px;
            text-align: center;
            border-top: 1px solid var(--glass-brd);
            cursor: pointer;
            color: var(--text-2);
            font-size: 12px;
            border-radius: 0 0 var(--radius-card) var(--radius-card);
            margin: 0 -12px -12px;
            transition: background .2s;
        }
        .notification-dropdown .notif-close-btn:hover {
            color: var(--text-1);
            background: var(--glass);
        }

        /* ===== TOAST - Center Pill ===== */
        .toast-container {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            width: auto;
            max-width: 90%;
        }
        .toast-item {
            padding: 14px 36px;
            border-radius: var(--radius-cap);
            background: var(--bg-2);
            border: 1px solid rgba(30, 166, 114, 0.3);
            color: var(--text-1);
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25), 0 0 30px rgba(30, 166, 114, 0.10);
            animation: toastSlideDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            min-width: 180px;
            justify-content: center;
        }
        .toast-item.success {
            border-color: rgba(30, 166, 114, 0.5);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25), 0 0 40px rgba(30, 166, 114, 0.20);
        }
        .toast-item.error {
            border-color: rgba(229, 72, 77, 0.5);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25), 0 0 40px rgba(229, 72, 77, 0.20);
        }
        .toast-item .toast-icon {
            font-size: 20px;
        }
        @keyframes toastSlideDown {
            0% {
                opacity: 0;
                transform: translateY(-40px) scale(0.85);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes toastFadeOut {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-30px) scale(0.85);
            }
        }
        .toast-item.removing {
            animation: toastFadeOut 0.4s ease forwards;
        }

        /* ===== BUTTONS ===== */
        .btn {
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 12.5px;
            padding: 9px 20px;
            border-radius: var(--radius-cap);
            transition: transform .15s ease, box-shadow .2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(.96);
        }
        .btn-green {
            background: linear-gradient(135deg, var(--green), var(--green-2));
            color: #052018;
            box-shadow: 0 10px 24px -10px var(--green-glow);
        }
        .btn-red {
            background: linear-gradient(135deg, var(--red), var(--red-2));
            color: #2b0507;
            box-shadow: 0 10px 24px -10px var(--red-glow);
        }
        .btn-orange {
            background: linear-gradient(135deg, var(--orange), var(--orange-2));
            color: #2b1500;
            box-shadow: 0 10px 24px -10px var(--orange-glow);
        }
        .btn-ghost {
            background: var(--glass);
            color: var(--text-1);
            border: 1px solid var(--glass-brd);
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 11.5px;
        }
        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #b02a37);
            color: #fff;
            box-shadow: 0 10px 24px -10px rgba(220, 53, 69, 0.35);
        }
        .btn[disabled] {
            opacity: .4;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== CARDS ===== */
        .card {
            background: var(--glass);
            border: 1px solid var(--glass-brd);
            border-radius: var(--radius-card);
            backdrop-filter: blur(var(--blur-glass)) saturate(140%);
            -webkit-backdrop-filter: blur(var(--blur-glass)) saturate(140%);
            box-shadow: var(--shadow-card);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(160deg, var(--glass-hi), transparent 40%);
            pointer-events: none;
            opacity: .5;
        }
        .grid {
            display: grid;
            gap: 14px;
        }
        .grid-4 {
            grid-template-columns: repeat(4, 1fr);
        }
        .grid-3 {
            grid-template-columns: repeat(3, 1fr);
        }
        .grid-2 {
            grid-template-columns: repeat(2, 1fr);
        }
        @media(max-width:1100px) {
            .grid-4 {
                grid-template-columns: repeat(2, 1fr);
            }
            .grid-3 {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media(max-width:640px) {
            .grid-4,
            .grid-3,
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .stat-card {
            padding: 16px 18px;
        }
        .stat-label {
            font-size: 11px;
            color: var(--text-3);
            font-weight: 600;
            letter-spacing: .3px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-icon {
            width: 26px;
            height: 26px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }
        .stat-value {
            font-size: 22px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
        }
        .stat-value.green {
            color: var(--green);
        }
        .stat-value.red {
            color: var(--red);
        }
        .stat-value.orange {
            color: var(--orange);
        }
        .stat-foot {
            font-size: 10.5px;
            color: var(--text-3);
            margin-top: 3px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .bar {
            width: 4px;
            height: 16px;
            border-radius: 4px;
            background: linear-gradient(180deg, var(--green), var(--orange));
        }

        /* ===== TABLES ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
        }
        th {
            text-align: left;
            padding: 8px 10px;
            color: var(--text-3);
            font-weight: 700;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .5px;
            border-bottom: 1px solid var(--glass-brd);
        }
        td {
            padding: 9px 10px;
            border-bottom: 1px solid var(--glass-brd);
            color: var(--text-1);
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius-sm);
        }

        .badge {
            padding: 2px 10px;
            border-radius: var(--radius-cap);
            font-size: 10px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge-green {
            background: rgba(30, 166, 114, 0.15);
            color: var(--green);
            border: 1px solid rgba(30, 166, 114, 0.35);
        }
        .badge-red {
            background: rgba(229, 72, 77, 0.15);
            color: var(--red);
            border: 1px solid rgba(229, 72, 77, 0.35);
        }
        .badge-orange {
            background: rgba(242, 153, 74, 0.15);
            color: var(--orange);
            border: 1px solid rgba(242, 153, 74, 0.35);
        }
        .badge-grey {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-2);
            border: 1px solid var(--glass-brd);
        }
        .badge-main {
            background: rgba(242, 153, 74, 0.15);
            color: var(--orange);
            border: 1px solid rgba(242, 153, 74, 0.35);
        }
        .badge-paid {
            background: rgba(30, 166, 114, 0.15);
            color: var(--green);
            border: 1px solid rgba(30, 166, 114, 0.35);
        }
        .badge-pending {
            background: rgba(242, 153, 74, 0.15);
            color: var(--orange);
            border: 1px solid rgba(242, 153, 74, 0.35);
        }
        .badge-archived {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-3);
            border: 1px solid var(--glass-brd);
        }

        /* ===== FORMS ===== */
        .formrow {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }
        label {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-2);
            margin-bottom: 3px;
            display: block;
        }
        input,
        select,
        textarea {
            width: 100%;
            padding: 9px 12px;
            border-radius: 14px;
            border: 1px solid var(--glass-brd);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-1);
            font-size: 13px;
            outline: none;
            font-family: inherit;
            transition: border .2s;
            -webkit-tap-highlight-color: transparent;
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--green);
        }
        select option {
            background: #0e2019;
            color: #eef7f2;
        }
        html[data-theme="light"] select option {
            background: #fff;
            color: #0e2019;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 10, 8, 0.6);
            backdrop-filter: blur(6px);
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal {
            background: var(--bg-2);
            border: 1px solid var(--glass-brd);
            border-radius: 26px;
            padding: 24px;
            max-width: 820px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
        }
        .modal-title {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 14px;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .empty {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-3);
        }
        .empty .emoji {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .searchbar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass);
            border: 1px solid var(--glass-brd);
            padding: 6px 14px;
            border-radius: var(--radius-cap);
        }
        .searchbar input {
            border: none;
            background: transparent;
            padding: 0;
        }
        .filter-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .chip {
            padding: 5px 12px;
            border-radius: var(--radius-cap);
            background: var(--glass);
            border: 1px solid var(--glass-brd);
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-2);
            cursor: pointer;
            transition: all .2s;
            -webkit-tap-highlight-color: transparent;
        }
        .chip.active {
            background: linear-gradient(135deg, var(--green), var(--green-2));
            color: #052018;
            border-color: transparent;
        }
        .chip:hover:not(.active) {
            background: var(--glass-hi);
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 7px 16px;
            border-radius: var(--radius-cap);
            background: var(--glass);
            border: 1px solid var(--glass-brd);
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-2);
            transition: all .2s;
            -webkit-tap-highlight-color: transparent;
        }
        .tab.active {
            background: linear-gradient(135deg, var(--orange), var(--orange-2));
            color: #2b1500;
            border-color: transparent;
        }
        .tab:hover:not(.active) {
            background: var(--glass-hi);
        }

        /* ===== INVESTOR ROW ===== */
        .investor-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 6px;
            border: 1px solid var(--glass-brd);
            flex-wrap: wrap;
            gap: 8px;
        }
        .investor-row.is-main {
            border-left: 4px solid var(--green);
        }
        .iv-name {
            font-weight: 700;
        }
        .iv-id {
            font-size: 10.5px;
            color: var(--text-3);
            font-family: 'JetBrains Mono', monospace;
        }
        .investor-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
            color: #fff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        .loss-badge {
            background: rgba(229, 72, 77, 0.12);
            color: var(--red);
            border: 1px solid rgba(229, 72, 77, 0.3);
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 10.5px;
            font-weight: 700;
        }

        /* ===== ORDER CARD ===== */
        .order-card {
            background: var(--glass);
            backdrop-filter: blur(var(--blur-glass));
            border: 1px solid var(--glass-brd);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            margin-bottom: 16px;
            overflow: hidden;
            transition: all .25s ease;
        }
        .order-card:hover {
            background: var(--glass-hi);
            transform: translateY(-2px);
            box-shadow: var(--shadow-soft);
        }
        .order-top {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            flex-wrap: wrap;
        }
        .order-stamp {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 12px;
            border: 2px solid;
            text-align: center;
            line-height: 1.1;
            background: var(--glass);
            backdrop-filter: blur(4px);
        }
        .stamp-open {
            color: var(--orange);
            border-color: var(--orange);
            background: rgba(242, 153, 74, 0.12);
        }
        .stamp-profit {
            color: var(--green);
            border-color: var(--green);
            background: rgba(30, 166, 114, 0.12);
        }
        .stamp-loss {
            color: var(--red);
            border-color: var(--red);
            background: rgba(229, 72, 77, 0.12);
        }
        .order-meta {
            flex: 1;
            min-width: 170px;
        }
        .order-meta .dates {
            font-size: 11.5px;
            color: var(--text-2);
        }
        .order-meta .amounts {
            margin-top: 3px;
            font-size: 13px;
            line-height: 1.6;
        }
        .order-meta .amounts b {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
        }
        .toggle-link {
            background: none;
            border: none;
            color: var(--green);
            font-size: 11.5px;
            cursor: pointer;
            text-decoration: underline dotted;
            padding: 0;
            font-weight: 600;
            margin-top: 2px;
            transition: color .2s;
            font-family: inherit;
        }
        .toggle-link:hover {
            color: var(--green-2);
            text-decoration: underline solid;
        }
        .order-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .split-bar {
            display: flex;
            height: 5px;
            border-radius: var(--radius-cap);
            overflow: hidden;
            margin: 0 20px 12px;
            background: rgba(0, 0, 0, 0.04);
            opacity: .8;
        }
        .split-seg {
            height: 100%;
            transition: width .8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .order-detail {
            border-top: 1px dashed var(--glass-brd);
            padding: 0 20px 18px;
            display: none;
        }
        .order-detail.open {
            display: block;
            animation: viewEnter 0.35s ease;
        }
        @keyframes viewEnter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .snapshot-lock {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10.5px;
            color: var(--orange);
            font-weight: 700;
            background: rgba(242, 153, 74, 0.12);
            padding: 3px 10px;
            border-radius: 99px;
            border: 1px solid rgba(242, 153, 74, 0.3);
        }
        .order-details-body .inner {
            padding: 14px 0 6px;
            border-top: 1px solid var(--glass-brd);
        }
        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: var(--glass);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-top: 10px;
        }
        .calc-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid var(--glass-brd);
            font-size: 12px;
        }
        .calc-item .label {
            color: var(--text-3);
        }
        .calc-item .value {
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }
        .calc-item .value.green {
            color: var(--green);
        }
        .calc-item .value.red {
            color: var(--red);
        }
        .calc-item .value.orange {
            color: var(--orange);
        }

        /* ===== BUSINESS CARD ===== */
        .business-card {
            background: var(--glass);
            border: 1px solid var(--glass-brd);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 12px;
            transition: all .25s ease;
        }
        .business-card:hover {
            border-color: var(--green);
        }
        .business-card .biz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        .business-card .biz-name {
            font-size: 16px;
            font-weight: 800;
        }
        .business-card .biz-id {
            font-size: 11px;
            color: var(--text-3);
            font-family: 'JetBrains Mono', monospace;
        }
        .business-card .biz-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
            margin-top: 8px;
        }
        .business-card .biz-stat {
            text-align: center;
            padding: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }
        .business-card .biz-stat .num {
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
        }
        .business-card .biz-stat .lbl {
            font-size: 10px;
            color: var(--text-3);
        }

        /* ===== AUDIT ===== */
        .audit-item {
            display: flex;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--glass-brd);
        }
        .audit-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            margin-top: 4px;
            flex-shrink: 0;
        }
        .audit-time {
            font-size: 10.5px;
            color: var(--text-3);
            font-family: 'JetBrains Mono', monospace;
        }

        /* ===== STATEMENT / LETTER ===== */
        .statement-letter {
            background: #fff;
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 0;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--glass-brd);
        }
        .statement-letter .letter-header {
            background: linear-gradient(135deg, var(--green), var(--green-2));
            padding: 20px 28px;
            color: #fff;
        }
        .statement-letter .letter-header h2 {
            font-size: 20px;
            font-weight: 800;
            margin: 0;
        }
        .statement-letter .letter-header .sub {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 2px;
        }
        .statement-letter .letter-body {
            padding: 20px 28px;
            color: #0e2019;
        }
        .statement-letter .letter-footer {
            padding: 12px 28px;
            border-top: 2px solid var(--green);
            text-align: center;
            font-size: 10.5px;
            color: #6b8578;
            background: #f8faf9;
        }
        .statement-letter .letter-footer .brand {
            font-weight: 700;
            color: var(--green);
        }
        .statement-letter .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin: 12px 0 16px;
        }
        .statement-letter .summary-grid .item {
            background: #f4f7f6;
            border-radius: 10px;
            padding: 10px 14px;
            text-align: center;
            border: 1px solid #e9ecef;
        }
        .statement-letter .summary-grid .item .label {
            font-size: 9px;
            color: #6b8578;
            text-transform: uppercase;
            letter-spacing: .4px;
        }
        .statement-letter .summary-grid .item .value {
            font-size: 16px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            margin-top: 2px;
        }
        .statement-letter .summary-grid .item .value.green {
            color: var(--green);
        }
        .statement-letter .summary-grid .item .value.red {
            color: var(--red);
        }
        .statement-letter .summary-grid .item .value.orange {
            color: var(--orange);
        }
        .statement-letter .print-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 8px;
        }
        .statement-letter .print-table th {
            background: #f4f7f6;
            color: #3c5a4e;
            padding: 8px 12px;
            text-align: left;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 9.5px;
            letter-spacing: .4px;
            border-bottom: 2px solid var(--green);
        }
        .statement-letter .print-table td {
            padding: 7px 12px;
            border-bottom: 1px solid #e9ecef;
        }
        .statement-letter .print-table .total-row {
            font-weight: 700;
            border-top: 2px solid var(--green);
        }

        /* ===== TOGGLE SWITCH ===== */
        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            padding: 4px 0;
        }
        .toggle-switch input[type="checkbox"] {
            width: 44px;
            height: 24px;
            appearance: none;
            background: var(--glass-brd);
            border-radius: 99px;
            position: relative;
            cursor: pointer;
            transition: background .3s ease;
            flex-shrink: 0;
            border: 1px solid var(--glass-brd);
        }
        .toggle-switch input[type="checkbox"]::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            background: var(--text-2);
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all .3s ease;
        }
        .toggle-switch input[type="checkbox"]:checked {
            background: var(--green);
            border-color: var(--green);
        }
        .toggle-switch input[type="checkbox"]:checked::after {
            left: 22px;
            background: #fff;
        }
        .toggle-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
        }

        /* ===== ADD INVESTOR BAR ===== */
        .add-investor-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .add-investor-bar .field {
            flex: 1;
            min-width: 110px;
        }
        .add-investor-bar input {
            padding: 10px 14px;
            border: 1.5px solid var(--glass-brd);
            border-radius: var(--radius-sm);
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 13.5px;
            width: 100%;
            background: var(--glass);
            color: var(--text-1);
            outline: none;
            transition: all .2s;
        }
        .add-investor-bar input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 4px var(--green-glow);
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width:900px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                width: 270px !important;
                transform: translateX(-100%);
                background: var(--bg-2);
                border-right: 1px solid var(--glass-brd);
                padding: 16px 12px;
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-toggle {
                display: flex;
            }
            .sidebar-overlay.active {
                display: block;
            }
            .main {
                padding: 14px;
                padding-top: 68px;
            }
            .topbar {
                flex-direction: column;
                align-items: stretch;
            }
            .biz-switch {
                justify-content: center;
            }
            .business-card .biz-stats {
                grid-template-columns: 1fr 1fr;
            }
            .notification-dropdown {
                width: calc(100vw - 28px);
                right: 0;
                left: 14px;
            }
            .order-top {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .order-actions {
                width: 100%;
                justify-content: flex-start;
            }
            .order-actions .btn {
                flex: 1;
                justify-content: center;
            }
            .investor-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .investor-left {
                flex-wrap: wrap;
            }
            .add-investor-bar .field {
                min-width: 80px;
            }
        }
        @media(max-width:700px) {
            .statement-letter .letter-body {
                padding: 14px 16px;
            }
            .statement-letter .letter-header {
                padding: 14px 16px;
            }
            .statement-letter .letter-header h2 {
                font-size: 17px;
            }
        }

        /* ===== PRINT ===== */
        @media print {
            .sidebar,
            .topbar,
            .btn,
            .no-print,
            .sidebar-toggle,
            .sidebar-overlay,
            .notification-bell,
            .toast-container,
            .biz-switch {
                display: none !important;
            }
            body {
                background: #fff !important;
                color: #000 !important;
            }
            .card {
                box-shadow: none !important;
                border: 1px solid #ccc !important;
                backdrop-filter: none !important;
                background: #fff !important;
            }
            .main {
                padding: 10px !important;
            }
            .order-detail {
                display: block !important;
                max-height: none !important;
                opacity: 1 !important;
            }
            .order-detail .inner {
                border-top: 1px solid #ddd !important;
            }
            .business-card {
                border: 1px solid #ddd !important;
                background: #fff !important;
            }
            .notification-dropdown {
                display: none !important;
            }
            .statement-letter {
                box-shadow: none !important;
                border: 1px solid #ddd !important;
            }
            .statement-letter .letter-header {
                background: var(--green) !important;
                color: #fff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .statement-letter .letter-footer {
                background: #f8faf9 !important;
            }
            .statement-letter .summary-grid .item {
                background: #f8faf9 !important;
            }
        }

        /* ===== PULSE DOT ===== */
        .pulse-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: pulseDot 2s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%,
            100% {
                opacity: .3;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.4);
            }
        }
        .empty-note {
            color: var(--text-2);
            font-size: 13.5px;
            padding: 48px 20px;
            text-align: center;
            background: var(--glass);
            backdrop-filter: blur(18px);
            border: 1.5px dashed var(--glass-brd);
            border-radius: var(--radius-card);
        }
        .settings-section {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--glass-brd);
        }
        .settings-section:last-child {
            border-bottom: none;
        }
        .settings-section .section-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-1);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .order-preview-table td,
        .order-preview-table th {
            padding: 6px 8px;
            font-size: 11.5px;
        }
        .order-preview-table .highlight {
            background: rgba(30, 166, 114, 0.08);
        }
        .order-preview-table .total-row {
            font-weight: 700;
            border-top: 2px solid var(--glass-brd);
        }
    </style>
</head>
<body>
    <div class="app">

        <!-- SIDEBAR OVERLAY (mobile) -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" aria-label="Toggle Menu">☰</button>

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand-mark">₮</div>
                <div>
                    <div class="brand-title" data-t="appTitle">ইনভেস্ট লেজার প্রো</div>
                    <div class="brand-sub" data-t="appSub">পোর্টফোলিও সিস্টেম</div>
                </div>
            </div>
            <nav class="nav" id="navList"></nav>
            <div class="side-foot">
                <div class="toggle-row">
                    <div class="toggle-col">
                        <button class="roundtoggle lang-btn" id="langToggle" onclick="toggleLang()" title="Language"><span class="icon" id="langIcon">বা</span></button>
                        <div class="roundtoggle-label" id="langLabel">ভাষা</div>
                    </div>
                    <div class="toggle-col">
                        <button class="roundtoggle theme-btn" id="themeToggle" onclick="toggleTheme()" title="Theme"><span class="icon" id="themeIcon">☀️</span></button>
                        <div class="roundtoggle-label" id="themeLabel">থিম</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main">
            <div class="topbar">
                <div>
                    <div class="page-title" id="pageTitle">ড্যাশবোর্ড</div>
                    <div class="page-sub" id="pageSub"></div>
                </div>
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                    <div class="notif-wrapper">
                        <div class="notification-bell" onclick="toggleNotifications(event)">
                            🔔
                            <span class="badge-count" id="notifCount">0</span>

        // ============================================================
        // TOAST
        // ============================================================
        function toast(msg, type = 'success') {
            const container = document.getElementById('toastRoot');
            if (!container) return;
            const el = document.createElement('div');
            el.className = `toast-item ${type}`;
            const icon = type === 'success' ? '✅' : '❌';
            el.innerHTML = `<span class="toast-icon">${icon}</span> ${msg}`;
            container.appendChild(el);
            setTimeout(() => {
                if (el.parentNode) {
                    el.classList.add('removing');
                    setTimeout(() => { if (el.parentNode) el.remove(); }, 400);
                }
            }, 2800);
        }

        // ============================================================
        // SIDEBAR TOGGLE
        // ============================================================
        let sidebarOpen = false;

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
            document.getElementById('sidebarOverlay').classList.toggle('active', sidebarOpen);
        }

        function closeSidebar() {
            if (window.innerWidth <= 900 && sidebarOpen) {
                sidebarOpen = false;
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('active');
            }
        }

        // ============================================================

        // ============================================================
        function toggleNotifications(e) {
            if (e) e.stopPropagation();
            _notifOpen = !_notifOpen;
            const dropdown = document.getElementById('notifDropdown');
            if (dropdown) dropdown.classList.toggle('open', _notifOpen);
            if (_notifOpen) renderNotifications();
        }

        function closeNotifications() {
            _notifOpen = false;
            const dropdown = document.getElementById('notifDropdown');
            if (dropdown) dropdown.classList.remove('open');
        }

        function addNotification(message, type = 'info', link = null) {
            STATE.notifications.unshift({
                id: uid('NOTIF'),
                message: message,
                type: type,
                link: link,
                time: new Date().toISOString(),
                read: false
            });
            if (STATE.notifications.length > 100) STATE.notifications = STATE.notifications.slice(0, 100);
            updateNotifBadge();
            saveState();
        }

        function updateNotifBadge() {
            const unread = STATE.notifications.filter(n => !n.read).length;
            const badge = document.getElementById('notifCount');
            if (badge) {
                badge.textContent = unread;
                badge.style.display = unread > 0 ? 'flex' : 'none';
            }
        }

        function renderNotifications() {
            const container = document.getElementById('notifList');
            if (!container) return;
            const items = STATE.notifications.slice(0, 30);
            if (!items.length) {
                container.innerHTML = `<div class="notif-empty">🔕 কোন নোটিফিকেশন নেই</div>`;
                return;
            }
            container.innerHTML = items.map(n => `
            <div class="notif-item ${n.read ? '' : 'unread'}" onclick="showNotifDetail('${n.id}')">
              <div>${!n.read ? '<span class="badge-dot"></span>' : ''} ${n.message}</div>
              <div class="time">${new Date(n.time).toLocaleString()}</div>
            </div>
          `).join('');
        }

        function showNotifDetail(id) {
            const notif = STATE.notifications.find(n => n.id === id);
            if (notif) notif.read = true;
            updateNotifBadge();
            renderNotifications();
            saveState();
            if (notif) {
                document.getElementById('modalRoot').innerHTML = `
              <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
                <div class="modal">
                  <div class="modal-title">📨 নোটিফিকেশন</div>
                  <div style="padding:10px 0;font-size:14px;line-height:1.8;">${notif.message}</div>
                  <div style="font-size:11px;color:var(--text-3);margin-top:8px;">${new Date(notif.time).toLocaleString()}</div>
                  <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">বাতিল</button></div>
                </div>
              </div>
            `;

            closeNotifications();
        }

        function renderNav() {
            const el = document.getElementById('navList');
            if (!el) return;
            el.innerHTML = NAV.map(g => `
            <div class="navgroup-label">${tr(g.group)}</div>
            ${g.items.map(it => `<div class="navitem ${STATE.activeNav === it.id ? 'active' : ''}" onclick="goTo('${it.id}')"><span class="dot"></span><span>${tr(it.label)}</span></div>`).join('')}
          `).join('');
        }

        function goTo(id) { STATE.activeNav = id;
            closeSidebar();
            renderAll(); }

        // ============================================================
        // CORE HELPERS
        // ============================================================
        function getInvestorDeposits(inv, uptoDate, excludeReversed) {
            let list = inv.deposits || [];
            if (uptoDate) list = list.filter(d => d.date <= uptoDate);
            if (excludeReversed) list = list.filter(d => !d.reversed);
            return list;
        }

        function getInvestorWithdraws(inv, uptoDate, excludeReversed) {
            let list = inv.withdraws || [];
            if (uptoDate) list = list.filter(w => w.date <= uptoDate);
            if (excludeReversed) list = list.filter(w => !w.reversed);
            return list;
        }

        function investorTotalDeposit(inv, uptoDate) {
            return getInvestorDeposits(inv, uptoDate, true).reduce((s, d) => s + d.amount, 0);
        }

        function investorTotalWithdraw(inv, uptoDate) {
            return getInvestorWithdraws(inv, uptoDate, true).reduce((s, w) => s + w.amount, 0);
        }

        function investorUtilizedInRunningOrders(biz, investorId, excludeOrderId) {
            let sum = 0;
            biz.orders.filter(o => o.status === 'running' && o.id !== excludeOrderId).forEach(o => {
                const alloc = o.snapshot.investors.find(a => a.investorId === investorId);
                if (alloc) sum += alloc.utilized;
            });
            return sum;
        }

        function investorAvailableBalance(biz, inv, atDate, excludeOrderId) {
            atDate = atDate || todayStr();
            const dep = investorTotalDeposit(inv, atDate);
            const wd = investorTotalWithdraw(inv, atDate);
            const utilized = investorUtilizedInRunningOrders(biz, inv.id, excludeOrderId);
            return roundAmount(dep - wd - utilized);
        }

        function getInvestorSharingRate(inv, atDate) {
            atDate = atDate || todayStr();
            const applicable = (inv.sharingHistory || []).filter(s => s.effectiveDate <= atDate).sort((a, b) => a
            .effectiveDate.localeCompare(b.effectiveDate));
            return applicable.length ? applicable[applicable.length - 1].rate : (inv.sharingHistory && inv.sharingHistory
                .length ? inv.sharingHistory[0].rate : 0);
        }

        function getMainCommissionRate(biz, atDate) {
            atDate = atDate || todayStr();
            const mainInv = biz.investors.find(i => i.isMain);
            if (!mainInv || !mainInv.commissionRateHistory) return 60;
            const applicable = mainInv.commissionRateHistory.filter(s => s.effectiveDate <= atDate).sort((a, b) => a
                .effectiveDate.localeCompare(b.effectiveDate));
            return applicable.length ? applicable[applicable.length - 1].rate : 60;
        }

        function getInvestorLossState(inv) {
            const pendingLoss = Math.max(0, (inv.lossBalance || 0) - (inv.recoveredLoss || 0));
            const pendingProfit = inv.isMain ? 0 : Math.max(0, (inv.netPayable || 0) - (inv.paidProfit || 0));
            return {
                previousLoss: inv.lossBalance || 0,
                totalProfit: inv.totalProfit || 0,
                totalLoss: inv.totalLoss || 0,
                recoveredLoss: inv.recoveredLoss || 0,
                pendingLoss: pendingLoss,
                netPayable: inv.netPayable || 0,
                paidProfit: inv.paidProfit || 0,
                pendingProfit: pendingProfit
            };
        }

        function bizTotals(biz) {
            let totalInvestment = 0,
                utilized = 0;
            biz.investors.forEach(inv => {
                const dep = investorTotalDeposit(inv);
                const wd = investorTotalWithdraw(inv);
                const net = dep - wd;
                if (net > 0) totalInvestment += net;
                const util = investorUtilizedInRunningOrders(biz, inv.id);
                if (!inv.isMain) { utilized += util; } else { utilized += net; }
            });
            let totalProfit = 0,
                totalLoss = 0,
                totalCommission = 0,
                netPayable = 0;
            biz.orders.filter(o => o.status === 'closed').forEach(o => {
                if (o.result && o.result.type === 'profit') { totalProfit += o.result.amount;
                    totalCommission += o.result.commission || 0; } else if (o.result && o.result.type === 'loss') { totalLoss +=
                        o.result.amount; }
                netPayable += (o.result && o.result.netPayable) || 0;
            });
            biz.investors.forEach(inv => {
                totalProfit += inv.totalProfit || 0;
                totalLoss += inv.totalLoss || 0;
                if (!inv.isMain) netPayable += inv.netPayable || 0;
            });
            return {
                totalInvestment: roundAmount(totalInvestment),
                utilized: roundAmount(utilized),
                lazy: roundAmount(Math.max(0, totalInvestment - utilized)),
                totalProfit: roundAmount(totalProfit),
                totalLoss: roundAmount(totalLoss),
                totalCommission: roundAmount(totalCommission),
                netPayable: roundAmount(netPayable),
                running: biz.orders.filter(o => o.status === 'running').length,
                closed: biz.orders.filter(o => o.status === 'closed').length,
                cancelled: biz.orders.filter(o => o.status === 'cancelled').length,
                activeInvestors: biz.investors.filter(i => i.active).length,
                totalInvestors: biz.investors.length,
                pendingLoss: roundAmount(biz.investors.reduce((s, i) => s + Math.max(0, (i.lossBalance || 0) - (i
                    .recoveredLoss || 0)), 0))
            };
        }

        // ============================================================
        // ORDER ALLOCATION (Main Investor First)
        // ============================================================
        function calculateOrderAllocation(biz, startDate, utilizedAmount) {
            const investors = [];
            let totalAvailable = 0;
            biz.investors.forEach(inv => {
                if (!inv.active) return;
                const avail = investorAvailableBalance(biz, inv, startDate);
                if (avail > 0) {
                    const rate = inv.isMain ? 0 : getInvestorSharingRate(inv, startDate);
                    const commRate = inv.isMain ? getMainCommissionRate(biz, startDate) : 0;
                    investors.push({
                        investorId: inv.id,
                        name: inv.name,
                        isMain: inv.isMain || false,
                        available: avail,
                        sharingRate: rate,
                        previousLoss: inv.lossBalance || 0,
                        recoveredLoss: inv.recoveredLoss || 0,
                        pendingLoss: Math.max(0, (inv.lossBalance || 0) - (inv.recoveredLoss || 0)),
                        sharingRateAtDate: rate,
                        commissionRateAtDate: commRate
                    });
                    totalAvailable += avail;
                }
            });
            if (!investors.length) return { error: tr('noActiveInvestorsForOrder'), investors: [], totalAvailable: 0,
                totalUtilized: 0, unutilized: 0, allocations: [] };

            let totalUtilized = utilizedAmount || totalAvailable;
            if (totalUtilized > totalAvailable) totalUtilized = totalAvailable;

            // --- MAIN INVESTOR FIRST ---
            const main = investors.find(a => a.isMain);
            const nonMain = investors.filter(a => !a.isMain);

            let allocations = [];
            let remaining = totalUtilized;

            // 1. Allocate from main investor
            if (main) {
                const mainAlloc = Math.min(main.available, remaining);
                allocations.push({
                    ...main,
                    allocated: mainAlloc,
                    unutilized: main.available - mainAlloc
                });
                remaining -= mainAlloc;
            } else {
                // fallback: no main investor, allocate proportionally
                const totalAvail = investors.reduce((s, a) => s + a.available, 0);
                investors.forEach(a => {
                    const share = totalAvail > 0 ? a.available / totalAvail : 0;
                    const alloc = share * totalUtilized;
                    allocations.push({ ...a, allocated: roundAmount(alloc), unutilized: roundAmount(a.available -
                            alloc) });
                });
                const totalAlloc = allocations.reduce((s, a) => s + a.allocated, 0);
                const diff = roundAmount(totalUtilized - totalAlloc);
                if (diff !== 0 && allocations.length) {
                    const largest = allocations.reduce((a, b) => a.allocated > b.allocated ? a : b);
                    largest.allocated = roundAmount(largest.allocated + diff);
                    largest.unutilized = roundAmount(largest.available - largest.allocated);
                }
                return { investors, totalAvailable: roundAmount(totalAvailable), totalUtilized: roundAmount(
                        totalUtilized), unutilized: roundAmount(totalAvailable - totalUtilized), allocations };
            }

            // 2. Allocate from non-main investors proportionally
            if (remaining > 0 && nonMain.length) {
                const nonMainTotalAvail = nonMain.reduce((s, a) => s + a.available, 0);
                if (nonMainTotalAvail > 0) {
                    nonMain.forEach(a => {
                        const share = a.available / nonMainTotalAvail;
                        const alloc = share * remaining;
                        allocations.push({ ...a, allocated: roundAmount(alloc), unutilized: roundAmount(a
                                .available - alloc) });
                    });
                    const totalNonMainAlloc = allocations.filter(a => !a.isMain).reduce((s, a) => s + a.allocated,
                    0);
                    const diff2 = roundAmount(remaining - totalNonMainAlloc);
                    if (diff2 !== 0) {
                        const nonMainAllocs = allocations.filter(a => !a.isMain);
                        if (nonMainAllocs.length) {
                            const largest2 = nonMainAllocs.reduce((a, b) => a.allocated > b.allocated ? a : b);
                            largest2.allocated = roundAmount(largest2.allocated + diff2);
                            largest2.unutilized = roundAmount(largest2.available - largest2.allocated);
                        }
                    }
                } else {
                    // no non-main available
                    nonMain.forEach(a => {
                        allocations.push({ ...a, allocated: 0, unutilized: a.available });
                    });
                }
            } else {
                // remaining is 0, non-main get 0 allocation
                nonMain.forEach(a => {
                    allocations.push({ ...a, allocated: 0, unutilized: a.available });
                });
            }

            // Validate no negative allocations
            for (const a of allocations) {
                if (a.allocated < 0) a.allocated = 0;
                if (a.unutilized < 0) a.unutilized = 0;
            }

            const totalAlloc2 = allocations.reduce((s, a) => s + a.allocated, 0);
            const unutilized = roundAmount(totalAvailable - totalAlloc2);

            return {
                investors,
                totalAvailable: roundAmount(totalAvailable),
                totalUtilized: roundAmount(totalAlloc2),
                unutilized: unutilized,
                allocations
            };
        }

            if (biz.investors.length > 1) return true;
            if (biz.orders.length > 0) return true;

            if (biz.investors[0] && (biz.investors[0].deposits.length > 0 || biz.investors[0].withdraws.length > 0))
            return true;
            return false;
        }

            </div>
          </div>`;
        }

        function confirmAddCommissionRate(bizId) {
            const b = STATE.businesses.find(x => x.id === bizId);
            if (!b) return;
            const mainInv = b.investors.find(i => i.isMain);
            if (!mainInv) return;
            const rate = parseFloat(document.getElementById('newCommissionRate').value);
            const date = document.getElementById('newCommissionRateDate').value;
            if (!rate || rate < 0) { toast(tr('fillRequired')); return; }
            if (!date) { toast(tr('fillRequired')); return; }
            if (mainInv.commissionRateHistory.some(r => r.effectiveDate === date)) { toast('এই তারিখে ইতিমধ্যে একটি Rate রয়েছে');
                return; }
            mainInv.commissionRateHistory.push({ rate: rate, effectiveDate: date });
            logAudit(b, 'commission_rate_added', `কমিশন রেট যোগ: ${rate}% (${date})`, { rate, date });
            addNotification(`🎖️ কমিশন রেট: ${rate}% (${date})`);
            saveState();
            closeModal();
            toast(tr('saved'));
            renderCommissionLedger();
