<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ইনভেস্ট লেজার প্রো</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ===== BASE ===== */
        :root {
            --green: #1ea672;
            --green-2: #0f8a5f;
            --green-glow: rgba(30,166,114,0.35);
            --red: #e5484d;
            --red-2: #c62f34;
            --red-glow: rgba(229,72,77,0.30);
            --orange: #f2994a;
            --orange-2: #d9772e;
            --orange-glow: rgba(242,153,74,0.30);
            --bg-1: #f1f6f2;
            --bg-2: #e9f2ec;
            --bg-3: #eef8f1;
            --glass: rgba(255,255,255,0.65);
            --glass-brd: rgba(20,60,45,0.10);
            --glass-hi: rgba(255,255,255,0.80);
            --text-1: #0e2019;
            --text-2: #3c5a4e;
            --text-3: #6b8578;
            --shadow-soft: 0 20px 50px -24px rgba(20,60,45,0.25);
            --shadow-card: 0 8px 32px rgba(0,0,0,0.08);
            --radius-cap: 999px;
            --radius-card: 26px;
            --radius-sm: 16px;
            --sidebar-width: 220px;
            --blur-glass: 18px;
        }
        html[data-theme="dark"] {
            --bg-1: #0c1a17;
            --bg-2: #0a1512;
            --bg-3: #0e2019;
            --glass: rgba(255,255,255,0.055);
            --glass-brd: rgba(255,255,255,0.10);
            --glass-hi: rgba(255,255,255,0.09);
            --text-1: #eef7f2;
            --text-2: #a9c2b8;
            --text-3: #7d968c;
            --shadow-soft: 0 20px 50px -20px rgba(0,0,0,0.55);
            --shadow-card: 0 8px 32px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Hind Siliguri', 'Manrope', sans-serif;
            background:
                radial-gradient(1100px 700px at 8% -10%, rgba(30,166,114,0.12), transparent 60%),
                radial-gradient(900px 600px at 100% 0%, rgba(242,153,74,0.08), transparent 55%),
                radial-gradient(800px 700px at 50% 120%, rgba(229,72,77,0.06), transparent 55%),
                linear-gradient(180deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3));
            min-height: 100vh;
            color: var(--text-1);
            transition: background .4s ease, color .3s ease;
        }
        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-thumb { background: var(--glass-brd); border-radius: 99px; }
        ::-webkit-scrollbar-track { background: transparent; }
        .font-en { font-family: 'Manrope', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .app { display: flex; min-height: 100vh; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            padding: 16px 10px;
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 50;
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
            overflow: hidden;
            background: var(--bg-2);
            border-right: 1px solid var(--glass-brd);
        }
        .sidebar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 8px 10px;
            flex-shrink: 0;
        }
        .sidebar .brand-mark {
            width: 36px;
            height: 36px;
            border-radius: 14px;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--green), var(--orange));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #08130f;
            box-shadow: 0 8px 20px -6px var(--green-glow);
            font-size: 14px;
        }
        .sidebar .brand-title { font-weight: 800; font-size: 14px; letter-spacing: .2px; white-space: nowrap; }
        .sidebar .brand-sub { font-size: 10px; color: var(--text-3); letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
        .nav {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow-y: auto;
            flex: 1;
            padding-right: 2px;
        }
        .navgroup-label {
            font-size: 9.5px;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 8px 10px 3px;
            opacity: 0.7;
            white-space: nowrap;
        }
        .navitem {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: var(--radius-cap);
            color: var(--text-2);
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            border: 1px solid transparent;
            transition: all .18s ease;
            white-space: nowrap;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .navitem:hover { background: var(--glass); color: var(--text-1); border-color: var(--glass-brd); }
        .navitem.active {
            background: linear-gradient(135deg, var(--green-glow), transparent 70%);
            border-color: rgba(30,166,114,0.4);
            color: var(--text-1);
            box-shadow: inset 0 0 0 1px rgba(30,166,114,0.15);
        }
        .navitem .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); flex-shrink: 0; }
        .navitem.active .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }

        .side-foot {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--glass-brd);
            align-items: center;
            flex-shrink: 0;
        }
        .toggle-row { display: flex; gap: 10px; justify-content: center; }
        .roundtoggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--glass-brd);
            background: var(--glass);
            color: var(--text-1);
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .25s ease;
            box-shadow: 0 8px 20px -10px rgba(0,0,0,0.4);
            -webkit-tap-highlight-color: transparent;
        }
        .roundtoggle:hover { transform: translateY(-2px); border-color: rgba(30,166,114,0.4); }
        .roundtoggle:active { transform: scale(.92); }
        .roundtoggle .icon { font-size: 16px; line-height: 1; }
        .roundtoggle.lang-btn { background: linear-gradient(135deg, var(--green-glow), transparent 70%); }
        .roundtoggle.theme-btn { background: linear-gradient(135deg, var(--orange-glow), transparent 70%); }
        .roundtoggle-label { font-size: 9px; color: var(--text-3); text-align: center; margin-top: -2px; }
        .toggle-col { display: flex; flex-direction: column; align-items: center; gap: 3px; }

        .sidebar-toggle {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 60;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--glass-brd);
            background: var(--glass);
            backdrop-filter: blur(20px);
            color: var(--text-1);
            font-size: 22px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all .3s ease;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .sidebar-toggle:hover { transform: scale(1.05); border-color: var(--green); }
        .sidebar-toggle:active { transform: scale(.92); }
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 45;
            display: none;
            opacity: 0;
            transition: opacity .35s ease;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        /* ===== MAIN ===== */
        .main {
            flex: 1;
            min-width: 0;
            padding: 20px 26px 50px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .page-title { font-size: 24px; font-weight: 800; }
        .page-sub { color: var(--text-3); font-size: 12.5px; margin-top: 2px; }
        .biz-switch {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass);
            border: 1px solid var(--glass-brd);
            padding: 5px 5px 5px 14px;
            border-radius: var(--radius-cap);
            backdrop-filter: blur(20px);
        }
        .biz-switch select {
            background: transparent;
            border: none;
            color: var(--text-1);
            font-weight: 700;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .biz-switch select option { background: #0e2019; color: #eef7f2; }
        html[data-theme="light"] .biz-switch select option { background: #fff; color: #0e2019; }

        /* ===== NOTIFICATION ===== */
        .notif-wrapper { position: relative; display: inline-block; }
        .notification-bell {
            position: relative;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all .25s ease;
            border: 1px solid var(--glass-brd);
            background: var(--glass);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 10;
        }
        .notification-bell:hover:not(.open) { transform: scale(1.05); border-color: var(--green); }
        .notification-bell.open { transform: scale(1); border-color: var(--green); }
        .notification-bell .badge-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--red);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-1);
        }
        .notification-dropdown-fixed {
            position: fixed;
            z-index: 9999;
            width: 420px;
            max-height: 500px;
            overflow-y: auto;
            background: var(--bg-2);
            border: 1px solid var(--glass-brd);
            border-radius: var(--radius-card);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 12px;
            display: none;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .notification-dropdown-fixed.open { display: block; }
        .notification-dropdown-fixed .notif-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--glass-brd);
            flex-wrap: wrap;
            gap: 6px;
        }
        .notification-dropdown-fixed .notif-header .notif-tabs {
            display: flex;
            gap: 5px;
        }
        .notification-dropdown-fixed .notif-header .notif-tabs .notif-tab {
            padding: 4px 12px;
            border-radius: var(--radius-cap);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            background: var(--glass);
            color: var(--text-2);
            border: 1px solid var(--glass-brd);
            transition: all .2s;
        }
        .notification-dropdown-fixed .notif-header .notif-tabs .notif-tab.active {
            background: var(--green);
            color: #fff;
            border-color: var(--green);
        }
        .notification-dropdown-fixed .notif-header .notif-actions {
            display: flex;
            gap: 5px;
        }
        .notification-dropdown-fixed .notif-header .notif-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 11px;
            color: var(--text-2);
            padding: 4px 8px;
            border-radius: var(--radius-cap);
            transition: all .2s;
        }
        .notification-dropdown-fixed .notif-header .notif-actions button:hover { background: var(--glass); }
        .notification-dropdown-fixed .notif-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--glass-brd);
            font-size: 12.5px;
            cursor: pointer;
            transition: all .2s ease;
            border-radius: 8px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .notification-dropdown-fixed .notif-item:hover { background: var(--glass); }
        .notification-dropdown-fixed .notif-item:last-child { border-bottom: none; }
        .notification-dropdown-fixed .notif-item .notif-icon { font-size: 18px; flex-shrink: 0; margin-top: 2px; }
        .notification-dropdown-fixed .notif-item .notif-content { flex: 1; }
        .notification-dropdown-fixed .notif-item .notif-content .notif-msg { font-weight: 500; }
        .notification-dropdown-fixed .notif-item .notif-content .notif-meta {
            display: flex;
            gap: 10px;
            font-size: 10px;
            color: var(--text-3);
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .notification-dropdown-fixed .notif-item .notif-content .notif-meta .notif-time { font-family: 'JetBrains Mono', monospace; }
        .notification-dropdown-fixed .notif-item .notif-content .notif-meta .notif-badge {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
        }
        .notification-dropdown-fixed .notif-item .notif-actions-item {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-shrink: 0;
        }
        .notification-dropdown-fixed .notif-item .notif-actions-item button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-3);
            padding: 2px 6px;
            border-radius: var(--radius-cap);
            transition: all .2s;
        }
        .notification-dropdown-fixed .notif-item .notif-actions-item button:hover { background: var(--glass); color: var(--text-1); }
        .notification-dropdown-fixed .notif-empty {
            text-align: center;
            padding: 30px;
            color: var(--text-3);
        }
        .notification-dropdown-fixed .notif-close-btn {
            position: sticky;
            bottom: 0;
            background: var(--bg-2);
            padding: 8px;
            text-align: center;
            border-top: 1px solid var(--glass-brd);
            cursor: pointer;
            color: var(--text-2);
            font-size: 12px;
            border-radius: 0 0 var(--radius-card) var(--radius-card);
            margin: 0 -12px -12px;
            transition: background .2s;
        }
        .notification-dropdown-fixed .notif-close-btn:hover {
            color: var(--text-1);
            background: var(--glass);
        }

        /* ===== TOAST (Bottom-Right) ===== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            pointer-events: none;
            width: auto;
            max-width: 380px;
        }
        .toast-item {
            padding: 12px 18px 12px 16px;
            border-radius: var(--radius-cap);
            background: var(--bg-2);
            border: 1px solid var(--glass-brd);
            color: var(--text-1);
            font-weight: 500;
            font-size: 13px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.18);
            animation: toastSlideInRight 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 380px;
            position: relative;
        }
        .toast-item .toast-icon { font-size: 18px; flex-shrink: 0; }
        .toast-item .toast-close {
            background: none;
            border: none;
            color: var(--text-3);
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            flex-shrink: 0;
            transition: color .2s;
        }
        .toast-item .toast-close:hover { color: var(--text-1); }
        .toast-item.success { border-color: rgba(30,166,114,0.55); }
        .toast-item.error { border-color: rgba(229,72,77,0.55); }
        .toast-item.warning { border-color: rgba(242,153,74,0.55); }
        .toast-item.info { border-color: rgba(30,166,114,0.35); }
        @keyframes toastSlideInRight {
            0% { opacity: 0; transform: translateX(60px) scale(0.95); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes toastSlideOutRight {
            0% { opacity: 1; transform: translateX(0) scale(1); }
            100% { opacity: 0; transform: translateX(60px) scale(0.95); }
        }
        .toast-item.removing { animation: toastSlideOutRight 0.3s ease forwards; }

        /* ===== BUTTONS ===== */
        .btn {
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 12.5px;
            padding: 9px 20px;
            border-radius: var(--radius-cap);
            transition: transform .15s ease, box-shadow .2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(.96); }
        .btn-green { background: linear-gradient(135deg, var(--green), var(--green-2)); color: #052018; box-shadow: 0 10px 24px -10px var(--green-glow); }
        .btn-red { background: linear-gradient(135deg, var(--red), var(--red-2)); color: #2b0507; box-shadow: 0 10px 24px -10px var(--red-glow); }
        .btn-orange { background: linear-gradient(135deg, var(--orange), var(--orange-2)); color: #2b1500; box-shadow: 0 10px 24px -10px var(--orange-glow); }
        .btn-ghost { background: var(--glass); color: var(--text-1); border: 1px solid var(--glass-brd); }
        .btn-sm { padding: 6px 12px; font-size: 11.5px; }
        .btn-danger { background: linear-gradient(135deg, #dc3545, #b02a37); color: #fff; box-shadow: 0 10px 24px -10px rgba(220,53,69,0.35); }
        .btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }

        /* ===== CARDS ===== */
        .card {
            background: var(--glass);
            border: 1px solid var(--glass-brd);
            border-radius: var(--radius-card);
            backdrop-filter: blur(var(--blur-glass)) saturate(140%);
            -webkit-backdrop-filter: blur(var(--blur-glass)) saturate(140%);
            box-shadow: var(--shadow-card);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(160deg, var(--glass-hi), transparent 40%);
            pointer-events: none;
            opacity: .5;
        }
        .grid { display: grid; gap: 14px; }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        @media(max-width:1100px) { .grid-4 { grid-template-columns: repeat(2,1fr); } .grid-3 { grid-template-columns: repeat(2,1fr); } }
        @media(max-width:640px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } }

        .stat-card { padding: 16px 18px; }
        .stat-label {
            font-size: 11px;
            color: var(--text-3);
            font-weight: 600;
            letter-spacing: .3px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-icon {
            width: 26px;
            height: 26px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }
        .stat-value { font-size: 22px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
        .stat-value.green { color: var(--green); }
        .stat-value.red { color: var(--red); }
        .stat-value.orange { color: var(--orange); }
        .stat-foot { font-size: 10.5px; color: var(--text-3); margin-top: 3px; }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .bar { width: 4px; height: 16px; border-radius: 4px; background: linear-gradient(180deg, var(--green), var(--orange)); }

        /* ===== TABLES ===== */
        table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        th {
            text-align: left;
            padding: 8px 10px;
            color: var(--text-3);
            font-weight: 700;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .5px;
            border-bottom: 1px solid var(--glass-brd);
        }
        td { padding: 9px 10px; border-bottom: 1px solid var(--glass-brd); color: var(--text-1); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); }

        .badge {
            padding: 2px 10px;
            border-radius: var(--radius-cap);
            font-size: 10px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge-green { background: rgba(30,166,114,0.15); color: var(--green); border: 1px solid rgba(30,166,114,0.35); }
        .badge-red { background: rgba(229,72,77,0.15); color: var(--red); border: 1px solid rgba(229,72,77,0.35); }
        .badge-orange { background: rgba(242,153,74,0.15); color: var(--orange); border: 1px solid rgba(242,153,74,0.35); }
        .badge-grey { background: rgba(255,255,255,0.08); color: var(--text-2); border: 1px solid var(--glass-brd); }
        .badge-main { background: rgba(242,153,74,0.15); color: var(--orange); border: 1px solid rgba(242,153,74,0.35); }
        .badge-paid { background: rgba(30,166,114,0.15); color: var(--green); border: 1px solid rgba(30,166,114,0.35); }
        .badge-pending { background: rgba(242,153,74,0.15); color: var(--orange); border: 1px solid rgba(242,153,74,0.35); }
        .badge-archived { background: rgba(255,255,255,0.08); color: var(--text-3); border: 1px solid var(--glass-brd); }

        /* ===== FORMS ===== */
        .formrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 10px; margin-bottom: 10px; }
        label { font-size: 11.5px; font-weight: 700; color: var(--text-2); margin-bottom: 3px; display: block; }
        input, select, textarea {
            width: 100%;
            padding: 9px 12px;
            border-radius: 14px;
            border: 1px solid var(--glass-brd);
            background: rgba(255,255,255,0.04);
            color: var(--text-1);
            font-size: 13px;
            outline: none;
            font-family: inherit;
            transition: border .2s;
            -webkit-tap-highlight-color: transparent;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--green); }
        select option { background: #0e2019; color: #eef7f2; }
        html[data-theme="light"] select option { background: #fff; color: #0e2019; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4,10,8,0.6);
            backdrop-filter: blur(6px);
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal {
            background: var(--bg-2);
            border: 1px solid var(--glass-brd);
            border-radius: 26px;
            padding: 24px;
            max-width: 900px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.6);
        }
        .modal-title { font-size: 17px; font-weight: 800; margin-bottom: 14px; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

        .empty { text-align: center; padding: 40px 16px; color: var(--text-3); }
        .empty .emoji { font-size: 32px; margin-bottom: 8px; }
        .empty-note { color: var(--text-2); font-size: 13.5px; padding: 48px 20px; text-align: center; background: var(--glass); backdrop-filter: blur(18px); border: 1.5px dashed var(--glass-brd); border-radius: var(--radius-card); }

        .searchbar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass);
            border: 1px solid var(--glass-brd);
            padding: 6px 14px;
            border-radius: var(--radius-cap);
        }
        .searchbar input { border: none; background: transparent; padding: 0; }
        .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
        .chip {
            padding: 5px 12px;
            border-radius: var(--radius-cap);
            background: var(--glass);
            border: 1px solid var(--glass-brd);
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-2);
            cursor: pointer;
            transition: all .2s;
            -webkit-tap-highlight-color: transparent;
        }
        .chip.active { background: linear-gradient(135deg, var(--green), var(--green-2)); color: #052018; border-color: transparent; }
        .chip:hover:not(.active) { background: var(--glass-hi); }

        .tabs { display: flex; gap: 5px; margin-bottom: 14px; flex-wrap: wrap; }
        .tab {
            padding: 7px 16px;
            border-radius: var(--radius-cap);
            background: var(--glass);
            border: 1px solid var(--glass-brd);
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-2);
            transition: all .2s;
            -webkit-tap-highlight-color: transparent;
        }
        .tab.active { background: linear-gradient(135deg, var(--orange), var(--orange-2)); color: #2b1500; border-color: transparent; }
        .tab:hover:not(.active) { background: var(--glass-hi); }

        /* ===== INVESTOR ROW ===== */
        .investor-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 16px;
            background: rgba(255,255,255,0.03);
            margin-bottom: 6px;
            border: 1px solid var(--glass-brd);
            flex-wrap: wrap;
            gap: 8px;
        }
        .investor-row.is-main { border-left: 4px solid var(--green); background: rgba(30,166,114,0.04); }
        .iv-name { font-weight: 700; }
        .iv-id { font-size: 10.5px; color: var(--text-3); font-family: 'JetBrains Mono', monospace; }
        .investor-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .loss-badge {
            background: rgba(229,72,77,0.12);
            color: var(--red);
            border: 1px solid rgba(229,72,77,0.3);
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 10.5px;
            font-weight: 700;
        }

        /* ===== ORDER CARD ===== */
        .order-card {
            background: var(--glass);
            backdrop-filter: blur(var(--blur-glass));
            border: 1px solid var(--glass-brd);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            margin-bottom: 16px;
            overflow: hidden;
            transition: all .25s ease;
        }
        .order-card:hover { background: var(--glass-hi); transform: translateY(-2px); box-shadow: var(--shadow-soft); }
        .order-top {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            flex-wrap: wrap;
        }
        .order-stamp {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 12px;
            border: 2px solid;
            text-align: center;
            line-height: 1.1;
            background: var(--glass);
            backdrop-filter: blur(4px);
        }
        .stamp-open { color: var(--orange); border-color: var(--orange); background: rgba(242,153,74,0.12); }
        .stamp-profit { color: var(--green); border-color: var(--green); background: rgba(30,166,114,0.12); }
        .stamp-loss { color: var(--red); border-color: var(--red); background: rgba(229,72,77,0.12); }
        .order-meta { flex: 1; min-width: 170px; }
        .order-meta .dates { font-size: 11.5px; color: var(--text-2); }
        .order-meta .amounts { margin-top: 3px; font-size: 13px; line-height: 1.6; }
        .order-meta .amounts b { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
        .toggle-link {
            background: none;
            border: none;
            color: var(--green);
            font-size: 11.5px;
            cursor: pointer;
            text-decoration: underline dotted;
            padding: 0;
            font-weight: 600;
            margin-top: 2px;
            transition: color .2s;
            font-family: inherit;
        }
        .toggle-link:hover { color: var(--green-2); text-decoration: underline solid; }
        .order-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .split-bar {
            display: flex;
            height: 5px;
            border-radius: var(--radius-cap);
            overflow: hidden;
            margin: 0 20px 12px;
            background: rgba(0,0,0,0.04);
            opacity: .8;
        }
        .split-seg { height: 100%; transition: width .8s cubic-bezier(0.22,1,0.36,1); }
        .order-detail {
            border-top: 1px dashed var(--glass-brd);
            padding: 0 20px 18px;
            display: none;
        }
        .order-detail.open { display: block; animation: viewEnter 0.35s ease; }
        @keyframes viewEnter {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .snapshot-lock {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10.5px;
            color: var(--orange);
            font-weight: 700;
            background: rgba(242,153,74,0.12);
            padding: 3px 10px;
            border-radius: 99px;
            border: 1px solid rgba(242,153,74,0.3);
        }
        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: var(--glass);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-top: 10px;
        }
        .calc-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid var(--glass-brd);
            font-size: 12px;
        }
        .calc-item .label { color: var(--text-3); }
        .calc-item .value { font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .calc-item .value.green { color: var(--green); }
        .calc-item .value.red { color: var(--red); }
        .calc-item .value.orange { color: var(--orange); }

        /* ===== BUSINESS CARD ===== */
        .business-card {
            background: var(--glass);
            border: 1px solid var(--glass-brd);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 12px;
            transition: all .25s ease;
        }
        .business-card:hover { border-color: var(--green); }
        .business-card .biz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        .business-card .biz-name { font-size: 16px; font-weight: 800; }
        .business-card .biz-id { font-size: 11px; color: var(--text-3); font-family: 'JetBrains Mono', monospace; }
        .business-card .biz-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px,1fr));
            gap: 8px;
            margin-top: 8px;
        }
        .business-card .biz-stat {
            text-align: center;
            padding: 6px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
        }
        .business-card .biz-stat .num { font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 14px; }
        .business-card .biz-stat .lbl { font-size: 10px; color: var(--text-3); }

        /* ===== STATEMENT LETTER ===== */
        .statement-letter {
            background: #fff;
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: 0;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--glass-brd);
        }
        html[data-theme="dark"] .statement-letter { background: var(--bg-2); }
        .statement-letter .letter-header {
            background: linear-gradient(135deg, var(--green), var(--green-2));
            padding: 20px 28px;
            color: #fff;
        }
        .statement-letter .letter-header h2 { font-size: 20px; font-weight: 800; margin: 0; }
        .statement-letter .letter-header .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }
        .statement-letter .letter-body { padding: 20px 28px; color: var(--text-1); }
        .statement-letter .letter-footer {
            padding: 12px 28px;
            border-top: 2px solid var(--green);
            text-align: center;
            font-size: 10.5px;
            color: #6b8578;
            background: #f8faf9;
        }
        html[data-theme="dark"] .statement-letter .letter-footer { background: var(--bg-1); color: var(--text-3); }
        .statement-letter .letter-footer .brand { font-weight: 700; color: var(--green); }
        .statement-letter .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
            gap: 10px;
            margin: 12px 0 16px;
        }
        .statement-letter .summary-grid .item {
            background: #f4f7f6;
            border-radius: 10px;
            padding: 10px 14px;
            text-align: center;
            border: 1px solid #e9ecef;
        }
        html[data-theme="dark"] .statement-letter .summary-grid .item { background: var(--glass); border-color: var(--glass-brd); }
        .statement-letter .summary-grid .item .label { font-size: 9px; color: #6b8578; text-transform: uppercase; letter-spacing: .4px; }
        .statement-letter .summary-grid .item .value { font-size: 16px; font-weight: 800; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
        .statement-letter .summary-grid .item .value.green { color: var(--green); }
        .statement-letter .summary-grid .item .value.red { color: var(--red); }
        .statement-letter .summary-grid .item .value.orange { color: var(--orange); }
        .statement-letter .print-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 8px;
        }
        .statement-letter .print-table th {
            background: #f4f7f6;
            color: #3c5a4e;
            padding: 8px 12px;
            text-align: left;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 9.5px;
            letter-spacing: .4px;
            border-bottom: 2px solid var(--green);
        }
        html[data-theme="dark"] .statement-letter .print-table th { background: var(--glass); color: var(--text-2); }
        .statement-letter .print-table td { padding: 7px 12px; border-bottom: 1px solid #e9ecef; }
        html[data-theme="dark"] .statement-letter .print-table td { border-color: var(--glass-brd); }
        .statement-letter .print-table .total-row { font-weight: 700; border-top: 2px solid var(--green); }

        /* ===== TOGGLE SWITCH ===== */
        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 4px 0;
        }
        .toggle-switch input[type="checkbox"] {
            width: 44px;
            height: 24px;
            appearance: none;
            background: var(--glass-brd);
            border-radius: 99px;
            position: relative;
            cursor: pointer;
            transition: background .3s ease;
            flex-shrink: 0;
            border: 1px solid var(--glass-brd);
        }
        .toggle-switch input[type="checkbox"]::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            background: var(--text-2);
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all .3s ease;
        }
        .toggle-switch input[type="checkbox"]:checked {
            background: var(--green);
            border-color: var(--green);
        }
        .toggle-switch input[type="checkbox"]:checked::after { left: 22px; background: #fff; }
        .toggle-label { font-size: 12px; font-weight: 600; color: var(--text-2); }

        /* ===== RESPONSIVE ===== */
        @media(max-width:900px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                width: 270px !important;
                transform: translateX(-100%);
                background: var(--bg-2);
                border-right: 1px solid var(--glass-brd);
                padding: 16px 12px;
                box-shadow: 0 0 40px rgba(0,0,0,0.3);
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-toggle { display: flex; }
            .sidebar-overlay.active { display: block; }
            .main { padding: 14px; padding-top: 68px; }
            .topbar { flex-direction: column; align-items: stretch; }
            .biz-switch { justify-content: center; }
            .business-card .biz-stats { grid-template-columns: 1fr 1fr; }
            .notification-dropdown-fixed { width: calc(100vw - 28px); left: 14px !important; right: 14px !important; }
            .order-top { flex-direction: column; align-items: stretch; gap: 10px; }
            .order-actions { width: 100%; justify-content: flex-start; }
            .order-actions .btn { flex: 1; justify-content: center; }
            .investor-row { flex-direction: column; align-items: stretch; gap: 8px; }
            .investor-left { flex-wrap: wrap; }
        }
        @media(max-width:700px) {
            .statement-letter .letter-body { padding: 14px 16px; }
            .statement-letter .letter-header { padding: 14px 16px; }
            .statement-letter .letter-header h2 { font-size: 17px; }
            .toast-container { right: 12px; bottom: 12px; max-width: calc(100% - 24px); }
            .toast-item { max-width: 100%; }
        }

        /* ===== PRINT ===== */
        @media print {
            .sidebar, .topbar, .btn, .no-print, .sidebar-toggle, .sidebar-overlay,
            .notification-bell, .toast-container, .biz-switch, .notification-dropdown-fixed { display: none !important; }
            body { background: #fff !important; color: #000 !important; }
            .card { box-shadow: none !important; border: 1px solid #ccc !important; backdrop-filter: none !important; background: #fff !important; }
            .main { padding: 10px !important; }
            .order-detail { display: block !important; max-height: none !important; opacity: 1 !important; }
            .order-detail .inner { border-top: 1px solid #ddd !important; }
            .business-card { border: 1px solid #ddd !important; background: #fff !important; }
            .statement-letter { box-shadow: none !important; border: 1px solid #ddd !important; background: #fff !important; }
            .statement-letter .letter-header { background: var(--green) !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .statement-letter .letter-footer { background: #f8faf9 !important; }
            .statement-letter .summary-grid .item { background: #f8faf9 !important; }
            .statement-letter .print-table th { background: #f4f7f6 !important; color: #3c5a4e !important; }
        }

        .settings-section { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--glass-brd); }
        .settings-section:last-child { border-bottom: none; }
        .settings-section .section-label { font-size: 13px; font-weight: 700; color: var(--text-1); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .order-preview-table td, .order-preview-table th { padding: 6px 8px; font-size: 11.5px; }
        .order-preview-table .total-row { font-weight: 700; border-top: 2px solid var(--glass-brd); }
        .pulse-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulseDot 2s ease-in-out infinite; }
        @keyframes pulseDot { 0%,100%{opacity:.3;transform:scale(1)} 50%{opacity:1;transform:scale(1.4)} }
        .audit-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--glass-brd); }
        .audit-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-top: 4px; flex-shrink: 0; }
        .audit-time { font-size: 10.5px; color: var(--text-3); font-family: 'JetBrains Mono', monospace; }
        .template-editor { font-family: 'JetBrains Mono', monospace; font-size: 12px; min-height: 120px; }
    </style>
</head>
<body>
    <div class="app">

        <!-- SIDEBAR OVERLAY (mobile) -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" aria-label="Toggle Menu">☰</button>

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand-mark">₮</div>
                <div>
                    <div class="brand-title" data-t="appTitle">ইনভেস্ট লেজার প্রো</div>
                    <div class="brand-sub" data-t="appSub">পোর্টফোলিও সিস্টেম</div>
                </div>
            </div>
            <nav class="nav" id="navList"></nav>
            <div class="side-foot">
                <div class="toggle-row">
                    <div class="toggle-col">
                        <button class="roundtoggle lang-btn" id="langToggle" onclick="toggleLang()" title="Language"><span class="icon" id="langIcon">বা</span></button>
                        <div class="roundtoggle-label" id="langLabel">ভাষা</div>
                    </div>
                    <div class="toggle-col">
                        <button class="roundtoggle theme-btn" id="themeToggle" onclick="toggleTheme()" title="Theme"><span class="icon" id="themeIcon">☀️</span></button>
                        <div class="roundtoggle-label" id="themeLabel">থিম</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main">
            <div class="topbar">
                <div>
                    <div class="page-title" id="pageTitle">ড্যাশবোর্ড</div>
                    <div class="page-sub" id="pageSub"></div>
                </div>
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                    <div class="notif-wrapper">
                        <div class="notification-bell" id="notifBell" onclick="toggleNotifications(event)">
                            🔔
                            <span class="badge-count" id="notifCount">0</span>
                        </div>
                        <div class="notification-dropdown-fixed" id="notifDropdownFixed">
                            <div id="notifList"></div>
                            <div class="notif-close-btn" onclick="closeNotifications(); event.stopPropagation();">✕ বন্ধ করুন</div>
                        </div>
                    </div>
                    <div class="biz-switch no-print" id="bizSwitchWrap">
                        <span style="font-size:11px;color:var(--text-3);" data-t="business">বিজনেস</span>
                        <select id="bizSelect" onchange="selectBusiness(this.value)"></select>
                        <button class="btn btn-green btn-sm" onclick="openBusinessModal()">+ <span data-t="newBiz">নতুন</span></button>
                    </div>
                </div>
            </div>
            <div id="content"></div>
        </main>
    </div>

    <div id="modalRoot"></div>
    <div id="toastRoot"></div>

    <script>
        // ============================================================
        // STATE
        // ============================================================
        let STATE = {
            lang: 'bn',
            theme: 'light',
            activeBusinessId: null,
            activeNav: 'dashboard',
            businesses: [],
            settings: {
                dateFormat: 'YYYY-MM-DD',
                maxRunningOrders: 10,
                telegram: { enabled: false, botToken: '', chatId: '' },
                sms: { enabled: false, apiBaseUrl: '', apiKey: '', maskingSenderId: '', nonMaskingSenderId: '',
                    useMasking: true },
                email: { enabled: false, smtpHost: '', smtpPort: 587, smtpUser: '', smtpPass: '', fromEmail: '',
                    fromName: 'Invest Ledger Pro' },
                communication: {
                    templates: {
                        sms: {
                            deposit: { subject: '', body: 'Dear {{InvestorName}}, Your deposit of {{Amount}} has been received. Ref: {{ReferenceNumber}}. Balance: {{AvailableBalance}}.' },
                            withdraw: { subject: '', body: 'Dear {{InvestorName}}, Withdrawal of {{Amount}} processed. Ref: {{ReferenceNumber}}. Balance: {{AvailableBalance}}.' },
                            order_created: { subject: '', body: 'Dear {{InvestorName}}, Order {{OrderNumber}} created. Utilized: {{UtilizedAmount}}.' },
                            order_closed_profit: { subject: '', body: 'Dear {{InvestorName}}, Order {{OrderNumber}} closed with profit {{ProfitAmount}}. Commission: {{Commission}}. Balance: {{AvailableBalance}}.' },
                            order_closed_loss: { subject: '', body: 'Dear {{InvestorName}}, Order {{OrderNumber}} closed with loss {{LossAmount}}. Balance: {{AvailableBalance}}.' },
                            profit_distribution: { subject: '', body: 'Dear {{InvestorName}}, Profit of {{ProfitAmount}} distributed from Order {{OrderNumber}}.' },
                            profit_payment: { subject: '', body: 'Dear {{InvestorName}}, Profit payment of {{Amount}} received. Ref: {{ReferenceNumber}}.' },
                            commission_payment: { subject: '', body: 'Dear {{InvestorName}}, Commission payment of {{Amount}} received.' },
                            loss_recovery: { subject: '', body: 'Dear {{InvestorName}}, Loss recovery of {{Amount}} from Order {{OrderNumber}}.' },
                            welcome: { subject: '', body: 'Welcome {{InvestorName}} to {{CompanyName}}.' },
                            monthly_statement: { subject: '', body: 'Dear {{InvestorName}}, Monthly statement for {{Month}} {{Year}} attached.' },
                            yearly_statement: { subject: '', body: 'Dear {{InvestorName}}, Yearly statement for {{Year}} attached.' }

        function toast(msg, type = 'success') {
            const container = document.getElementById('toastRoot');
            if (!container) return;
            const el = document.createElement('div');
            el.className = `toast-item ${type}`;
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            const icon = icons[type] || 'ℹ️';
            el.innerHTML = `
                <span class="toast-icon">${icon}</span>
                <span class="toast-msg">${msg}</span>
                <button class="toast-close" onclick="this.parentElement.remove();">✕</button>
            `;
            container.appendChild(el);
            let timer = setTimeout(() => {
                if (el.parentNode) {
                    el.classList.add('removing');
                    setTimeout(() => { if (el.parentNode) el.remove(); }, 300);
                }
            }, 4000);
            el.querySelector('.toast-close').addEventListener('click', () => {
                clearTimeout(timer);
                if (el.parentNode) {
                    el.classList.add('removing');
                    setTimeout(() => { if (el.parentNode) el.remove(); }, 300);
                }
            });
        }

        // ============================================================
        // COMMUNICATION ENGINE (Event-Based)
        // ============================================================
        function triggerCommunication(eventType, message, businessId, investorId) {
            const rules = STATE.settings.communication.rules || {};
            const rule = rules[eventType] || { sms: false, email: false, telegram: false, inapp: true };
            const b = STATE.businesses.find(x => x.id === businessId) || currentBiz();
            if (!b) return;

            // Find investor
            let inv = null;
            if (investorId) {
                inv = b.investors.find(i => i.id === investorId);
            } else {
                // Try to find investor from message
                const match = message.match(/👤\s*([^\s]+)/);
                if (match) {
                    const name = match[1];
                    inv = b.investors.find(i => i.name === name);
                }
            }

            if (!inv) return;

            // Build template data
            const data = {
                InvestorName: inv.name,
                BusinessName: b.name,
                CompanyName: STATE.settings.communication.globalVars.companyName || 'Invest Ledger Pro',
                CompanyEmail: STATE.settings.communication.globalVars.companyEmail || '',
                CompanyPhone: STATE.settings.communication.globalVars.companyPhone || '',
                SupportNumber: STATE.settings.communication.globalVars.supportNumber || '',
                Website: STATE.settings.communication.globalVars.website || '',
                Address: STATE.settings.communication.globalVars.address || '',
                Currency: STATE.settings.communication.globalVars.currency || 'BDT',
                SenderName: STATE.settings.communication.globalVars.senderName || 'Invest Ledger',
                TelegramSupport: STATE.settings.communication.globalVars.telegramSupport || '',
                CurrentDate: todayStr(),
                CurrentTime: new Date().toLocaleTimeString(),
                TransactionDate: todayStr(),
                Amount: money(inv.netPayable || 0),
                AvailableBalance: money(inv.capitalBalance || 0),
                ReferenceNumber: newRef(),
                OrderNumber: '',
                UtilizedAmount: money(0),
                ProfitAmount: money(0),
                LossAmount: money(0),
                Commission: money(0),
                Month: new Date().toLocaleString('default', { month: 'long' }),
                Year: new Date().getFullYear().toString()
            };

            // Extract numbers from message
            const amtMatch = message.match(/৳([\d,]+)/);
            if (amtMatch) {
                const num = parseInt(amtMatch[1].replace(/,/g, ''));
                if (!isNaN(num)) data.Amount = money(num);
            }
            const orderMatch = message.match(/অর্ডার\s*([^\s]+)/i);
            if (orderMatch) data.OrderNumber = orderMatch[1];

            // Send based on rules
            if (rule.sms && inv.mobile) {
                const smsTemplate = STATE.settings.communication.templates.sms[eventType] || { body: message };
                const smsBody = replacePlaceholders(smsTemplate.body || message, data);
                sendSMS(inv.mobile, smsBody, b);
            }
            if (rule.email && inv.email) {
                const emailTemplate = STATE.settings.communication.templates.email[eventType] || { subject: eventType,
                    body: message };
                const emailSubject = replacePlaceholders(emailTemplate.subject || eventType, data);
                const emailBody = replacePlaceholders(emailTemplate.body || message, data);
                sendEmail(inv.email, emailSubject, emailBody, b);
            }
            if (rule.telegram) {
                sendTelegramNotification(message);
            }
            // In-app already sent via addNotification
        }

        function replacePlaceholders(text, data) {
            let result = text;
            for (const [key, val] of Object.entries(data)) {
                result = result.replace(new RegExp('{{' + key + '}}', 'g'), val);
            }
            return result;
        }

        // ============================================================
        // SMS / EMAIL / TELEGRAM
        // ============================================================
        async function sendSMS(phone, message, biz) {
            const sms = STATE.settings.sms;
            if (!sms.enabled || !sms.apiKey || !sms.apiBaseUrl) return false;
            const senderId = sms.useMasking ? sms.maskingSenderId : sms.nonMaskingSenderId;
            if (!senderId) return false;
            const payload = {
                api_key: sms.apiKey,
                senderid: senderId,
                type: 'text',
                scheduledDateTime: '',
                msg: message,
                contacts: phone
            };
            let attempts = 0;
            const maxRetries = STATE.settings.communication?.retry?.maxRetries || 3;
            while (attempts < maxRetries) {
                try {
                    const response = await fetch(sms.apiBaseUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    if (data.status === 'success' || response.ok) {
                        logCommunication('SMS', phone, message, 'sent', biz);
                        return true;
                    }
                } catch (e) { console.error('SMS attempt failed:', e); }
                attempts++;
                await new Promise(r => setTimeout(r, 1000));
            }
            logCommunication('SMS', phone, message, 'failed', biz);
            return false;
        }

        async function sendEmail(to, subject, htmlContent, biz) {
            const email = STATE.settings.email;
            if (!email.enabled || !email.smtpHost || !email.smtpUser) return false;
            logCommunication('Email', to, subject, 'sent', biz);
            // Send PDF statement for order close events
            if (subject.includes('Order Closed') || subject.includes('Profit') || subject.includes('Loss')) {
                // Auto-generate PDF attachment (simulated)
                toast('📧 PDF Statement sent to ' + to);
                addNotification('📧 PDF Statement sent to ' + to, 'info');
            }
            return true;
        }

        async function sendTelegramNotification(message) {
            const tg = STATE.settings.telegram;
            if (!tg.enabled || !tg.botToken || !tg.chatId) return;
            try {
                const url = `https://api.telegram.org/bot${tg.botToken}/sendMessage`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: tg.chatId,
                        text: `📢 ${message}\n\n${new Date().toLocaleString()}`,
                        parse_mode: 'HTML'
                    })
                });
                logCommunication('Telegram', tg.chatId, message, 'sent', currentBiz());
            } catch (e) {
                console.error('Telegram send failed:', e);
                logCommunication('Telegram', tg.chatId, message, 'failed', currentBiz());
            }
        }

        function logCommunication(type, recipient, content, status, biz) {
            const log = {
                id: uid('COMM'),
                type: type,
                recipient: recipient,
                content: content.substring(0, 200),
                status: status,
                time: new Date().toISOString(),
                businessId: biz?.id || STATE.activeBusinessId,
                orderNumber: null,
                transactionRef: null
            };
            STATE.settings.communication.logs = STATE.settings.communication.logs || [];
            STATE.settings.communication.logs.unshift(log);
            if (STATE.settings.communication.logs.length > 500) STATE.settings.communication.logs = STATE.settings
                .communication.logs.slice(0, 500);
            saveState();
        }

        // ============================================================
        // CORE HELPERS
        // ============================================================
        function getInvestorDeposits(inv, uptoDate) {
            let list = inv.deposits || [];
            if (uptoDate) list = list.filter(d => d.date <= uptoDate);
            return list.filter(d => !d.reversed);
        }

        function getInvestorWithdraws(inv, uptoDate) {
            let list = inv.withdraws || [];
            if (uptoDate) list = list.filter(w => w.date <= uptoDate);
            return list.filter(w => !w.reversed);
        }

        function investorTotalDeposit(inv, uptoDate) {
            return getInvestorDeposits(inv, uptoDate).reduce((s, d) => s + d.amount, 0);
        }

        function investorTotalWithdraw(inv, uptoDate) {
            return getInvestorWithdraws(inv, uptoDate).reduce((s, w) => s + w.amount, 0);
        }

        function investorUtilizedInRunningOrders(biz, investorId, excludeOrderId) {
            let sum = 0;
            biz.orders.filter(o => o.status === 'running' && o.id !== excludeOrderId).forEach(o => {
                const alloc = o.snapshot.investors.find(a => a.investorId === investorId);
                if (alloc) sum += alloc.utilized;
            });
            return sum;
        }

        function investorAvailableBalance(biz, inv, atDate, excludeOrderId) {
            atDate = atDate || todayStr();
            const dep = investorTotalDeposit(inv, atDate);
            const wd = investorTotalWithdraw(inv, atDate);
            const utilized = investorUtilizedInRunningOrders(biz, inv.id, excludeOrderId);
            return roundAmount(dep - wd - utilized);
        }

        function getInvestorSharingRate(inv, atDate) {
            atDate = atDate || todayStr();
            const applicable = (inv.sharingHistory || []).filter(s => s.effectiveDate <= atDate).sort((a, b) => a
                .effectiveDate.localeCompare(b.effectiveDate));
            return applicable.length ? applicable[applicable.length - 1].rate : (inv.sharingHistory && inv.sharingHistory
                .length ? inv.sharingHistory[0].rate : 0);
        }

        function getInvestorLossState(inv) {
            const pendingLoss = Math.max(0, (inv.lossBalance || 0) - (inv.recoveredLoss || 0));
            const pendingProfit = inv.isMain ? 0 : Math.max(0, (inv.netPayable || 0) - (inv.paidProfit || 0));
            return {
                previousLoss: inv.lossBalance || 0,
                totalProfit: inv.totalProfit || 0,
                totalLoss: inv.totalLoss || 0,
                recoveredLoss: inv.recoveredLoss || 0,
                pendingLoss: pendingLoss,
                netPayable: inv.netPayable || 0,
                paidProfit: inv.paidProfit || 0,
                pendingProfit: pendingProfit
            };
        }

        function bizTotals(biz) {
            let totalInvestment = 0,
                utilized = 0;
            biz.investors.forEach(inv => {
                const dep = investorTotalDeposit(inv);
                const wd = investorTotalWithdraw(inv);
                const net = dep - wd;
                if (net > 0) totalInvestment += net;
                const util = investorUtilizedInRunningOrders(biz, inv.id);
                if (!inv.isMain) { utilized += util; } else { utilized += net; }
            });
            let totalProfit = 0,
                totalLoss = 0,
                totalCommission = 0,
                netPayable = 0;
            biz.orders.filter(o => o.status === 'closed').forEach(o => {
                if (o.result && o.result.type === 'profit') { totalProfit += o.result.amount;
                    totalCommission += o.result.commission || 0; } else if (o.result && o.result.type === 'loss') { totalLoss +=
                        o.result.amount; }
                netPayable += (o.result && o.result.netPayable) || 0;
            });
            biz.investors.forEach(inv => {
                totalProfit += inv.totalProfit || 0;
                totalLoss += inv.totalLoss || 0;
                if (!inv.isMain) netPayable += inv.netPayable || 0;
            });
            return {
                totalInvestment: roundAmount(totalInvestment),
                utilized: roundAmount(utilized),
                lazy: roundAmount(Math.max(0, totalInvestment - utilized)),
                totalProfit: roundAmount(totalProfit),
                totalLoss: roundAmount(totalLoss),
                totalCommission: roundAmount(totalCommission),
                netPayable: roundAmount(netPayable),
                running: biz.orders.filter(o => o.status === 'running').length,
                closed: biz.orders.filter(o => o.status === 'closed').length,
                cancelled: biz.orders.filter(o => o.status === 'cancelled').length,
                activeInvestors: biz.investors.filter(i => i.active).length,
                totalInvestors: biz.investors.length,
                pendingLoss: roundAmount(biz.investors.reduce((s, i) => s + Math.max(0, (i.lossBalance || 0) - (i
                    .recoveredLoss || 0)), 0))
            };
        }

        // ============================================================
        // ORDER ALLOCATION (Main Investor First)
        // ============================================================
        function calculateOrderAllocation(biz, startDate, utilizedAmount) {
            const investors = [];
            let totalAvailable = 0;
            biz.investors.forEach(inv => {
                if (!inv.active) return;
                const avail = investorAvailableBalance(biz, inv, startDate);
                if (avail > 0) {
                    const rate = inv.isMain ? 0 : getInvestorSharingRate(inv, startDate);
                    investors.push({
                        investorId: inv.id,
                        name: inv.name,
                        isMain: inv.isMain || false,
                        available: avail,
                        sharingRate: rate,
                        previousLoss: inv.lossBalance || 0,
                        recoveredLoss: inv.recoveredLoss || 0,
                        pendingLoss: Math.max(0, (inv.lossBalance || 0) - (inv.recoveredLoss || 0)),
                        sharingRateAtDate: rate,
                        totalDeposit: investorTotalDeposit(inv, startDate),
                        totalWithdraw: investorTotalWithdraw(inv, startDate),
                        capitalBalance: inv.capitalBalance || 0,
                        profitBalance: inv.profitBalance || 0
                    });
                    totalAvailable += avail;
                }
            });
            if (!investors.length) return { error: tr('noActiveInvestorsForOrder'), investors: [], totalAvailable: 0,
                totalUtilized: 0, unutilized: 0, allocations: [] };

            let totalUtilized = utilizedAmount || totalAvailable;
            if (totalUtilized > totalAvailable) totalUtilized = totalAvailable;

            const main = investors.find(a => a.isMain);
            const nonMain = investors.filter(a => !a.isMain);
            let allocations = [];
            let remaining = totalUtilized;

            if (main) {
                const mainAlloc = Math.min(main.available, remaining);
                allocations.push({ ...main, allocated: mainAlloc, unutilized: main.available - mainAlloc });
                remaining -= mainAlloc;
            } else {
                const totalAvail = investors.reduce((s, a) => s + a.available, 0);
                investors.forEach(a => {
                    const share = totalAvail > 0 ? a.available / totalAvail : 0;
                    const alloc = share * totalUtilized;
                    allocations.push({ ...a, allocated: roundAmount(alloc), unutilized: roundAmount(a.available -
                            alloc) });
                });
                const totalAlloc = allocations.reduce((s, a) => s + a.allocated, 0);
                const diff = roundAmount(totalUtilized - totalAlloc);
                if (diff !== 0 && allocations.length) {
                    const largest = allocations.reduce((a, b) => a.allocated > b.allocated ? a : b);
                    largest.allocated = roundAmount(largest.allocated + diff);
                    largest.unutilized = roundAmount(largest.available - largest.allocated);
                }
                return { investors, totalAvailable: roundAmount(totalAvailable), totalUtilized: roundAmount(
                        totalUtilized), unutilized: roundAmount(totalAvailable - totalUtilized), allocations };
            }

            if (remaining > 0 && nonMain.length) {
                const nonMainTotalAvail = nonMain.reduce((s, a) => s + a.available, 0);
                if (nonMainTotalAvail > 0) {
                    nonMain.forEach(a => {
                        const share = a.available / nonMainTotalAvail;
                        const alloc = share * remaining;
                        allocations.push({ ...a, allocated: roundAmount(alloc), unutilized: roundAmount(a
                                .available - alloc) });
                    });
                    const totalNonMainAlloc = allocations.filter(a => !a.isMain).reduce((s, a) => s + a.allocated,
                        0);
                    const diff2 = roundAmount(remaining - totalNonMainAlloc);
                    if (diff2 !== 0) {
                        const nonMainAllocs = allocations.filter(a => !a.isMain);
                        if (nonMainAllocs.length) {
                            const largest2 = nonMainAllocs.reduce((a, b) => a.allocated > b.allocated ? a : b);
                            largest2.allocated = roundAmount(largest2.allocated + diff2);
                            largest2.unutilized = roundAmount(largest2.available - largest2.allocated);
                        }
                    }
                } else {
                    nonMain.forEach(a => { allocations.push({ ...a, allocated: 0, unutilized: a.available }); });
                }
            } else {
                nonMain.forEach(a => { allocations.push({ ...a, allocated: 0, unutilized: a.available }); });
            }

            for (const a of allocations) {
                if (a.allocated < 0) a.allocated = 0;
                if (a.unutilized < 0) a.unutilized = 0;
            }

            const totalAlloc2 = allocations.reduce((s, a) => s + a.allocated, 0);
            const unutilized = roundAmount(totalAvailable - totalAlloc2);

            return {
                investors,
                totalAvailable: roundAmount(totalAvailable),
                totalUtilized: roundAmount(totalAlloc2),
                unutilized: unutilized,
                allocations
            };
        }

            toast(tr('businessDeleted'));
            renderAll();

        function confirmReplaceMainInvestor() {

            const newMainId = document.getElementById('newMainInvestorSelect').value;

            if (!oldMain || !newMain) { toast('ইনভেস্টর পাওয়া যায়নি'); return; }

            if (!b.mainInvestorHistory) b.mainInvestorHistory = [];
            b.mainInvestorHistory.push({
                oldMainId: oldMain.id,
                oldMainName: oldMain.name,
                newMainId: newMain.id,

                date: date,

        // ============================================================
        // MAIN INVESTOR REPORT (with filters)
        // ============================================================
        function renderMainInvestorReport() {
            const c = document.getElementById('content');
            const b = currentBiz();
            if (!b) { c.innerHTML = `<div class="card"><div class="empty">${tr('noBiz')}</div></div>`; return; }

            const mainInv = b.investors.find(i => i.isMain);
            if (!mainInv) { c.innerHTML =
                    `<div class="card"><div class="empty">${tr('mainCapital')} ${tr('noInvestors')}</div></div>`; return; }

            const filterHtml = `
                <div class="card" style="margin-bottom:16px;">
                    <div class="formrow">
                        <div><label>${tr('fromDate')}</label><input type="date" id="mainReportDateFrom" value="${STATE.statementFilter.dateFrom || ''}" onchange="updateMainReportFilter()" /></div>
                        <div><label>${tr('toDate')}</label><input type="date" id="mainReportDateTo" value="${STATE.statementFilter.dateTo || ''}" onchange="updateMainReportFilter()" /></div>
                        <div><label>${tr('orderNumber')}</label><input type="text" id="mainReportOrderNo" placeholder="ORD-0001" value="${STATE.statementFilter.orderNumber || ''}" onchange="updateMainReportFilter()" /></div>
                        <div style="display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;">
                            <button class="btn btn-green btn-sm" onclick="applyMainReportFilter()">${tr('applyFilter')}</button>
                            <button class="btn btn-ghost btn-sm" onclick="resetMainReportFilter()">${tr('reset')}</button>
                            <button class="btn btn-ghost btn-sm no-print" onclick="printMainInvestorReportFiltered('${b.id}')">🖨️ ${tr('printPdf')}</button>
                        </div>
                    </div>
                </div>
            `;

            let mainOrders = b.orders.filter(o => o.snapshot?.investors?.some(a => a.investorId === mainInv.id));
            const dateFrom = document.getElementById('mainReportDateFrom')?.value || '';
            const dateTo = document.getElementById('mainReportDateTo')?.value || '';
            const orderNo = document.getElementById('mainReportOrderNo')?.value?.trim() || '';
            if (dateFrom) mainOrders = mainOrders.filter(o => o.createDate >= dateFrom);
            if (dateTo) mainOrders = mainOrders.filter(o => o.createDate <= dateTo);
            if (orderNo) mainOrders = mainOrders.filter(o => o.orderNumber.toLowerCase().includes(orderNo.toLowerCase()));

            const closedMainOrders = mainOrders.filter(o => o.status === 'closed');

            let totalInvestment = 0,
                totalCommission = 0,
                totalProfit = 0,
                totalLoss = 0,
                totalRecovered = 0;
            let runningBalance = 0;

            let orderRows = '';
            closedMainOrders.forEach(o => {
                const alloc = o.snapshot.investors.find(a => a.investorId === mainInv.id);
                const res = o.result ? o.result.allocations.find(a => a.investorId === mainInv.id) : null;
                const utilized = alloc ? alloc.utilized : 0;
                const amount = res ? res.amount : 0;
                const comm = (o.result && o.result.type === 'profit') ? (o.result.commission || 0) : 0;
                const recovered = res ? (res.recovered || 0) : 0;
                const netComm = comm;
                const netPayable = (o.result && o.result.type === 'profit') ? (o.result.netPayable || 0) : 0;
                const isProfit = o.result && o.result.type === 'profit';

                totalInvestment += utilized;
                totalCommission += comm;
                if (isProfit) totalProfit += amount;
                else totalLoss += amount;
                totalRecovered += recovered;

                runningBalance += utilized + (isProfit ? amount : -amount);

                orderRows += `
                            <tr>
                                <td class="mono">${o.orderNumber}</td>
                                <td>${o.createDate}</td>
                                <td class="mono">${money(utilized)}</td>
                                <td><span class="badge ${isProfit ? 'badge-green' : 'badge-red'}">${isProfit ? tr('profit') : tr('loss')}</span></td>
                                <td class="mono" style="color:${isProfit ? 'var(--green)' : 'var(--red)'}">${money(amount)}</td>
                                <td class="mono" style="color:var(--orange)">${money(comm)}</td>
                                <td class="mono" style="color:var(--green)">${money(recovered)}</td>
                                <td class="mono" style="color:var(--orange)">${money(netComm)}</td>
                                <td class="mono" style="color:var(--green)">${money(netPayable)}</td>
                                <td class="mono">${money(runningBalance)}</td>
                            </tr>
                        `;
            });

            const pendingComm = Math.max(0, totalCommission - (mainInv.commissionWithdrawn || 0));

            c.innerHTML = `
                ${filterHtml}
                <div class="card" style="margin-bottom:16px;">
                    <div class="section-title"><span class="bar" style="background:var(--orange)"></span>${tr('mainInvestorReport')}</div>
                    <div style="font-size:12px;color:var(--text-3);">${mainInv.name} (${mainInv.id})</div>
                </div>

                <div class="grid grid-4" style="margin-bottom:16px;">
                    ${statCard('💰', '', 'totalInvestment', money(totalInvestment))}
                    ${statCard('🎖️', 'orange', 'totalCommissionEarned', money(totalCommission))}
                    ${statCard('💳', 'green', 'totalWithdrawn', money(mainInv.commissionWithdrawn||0))}
                    ${statCard('⏳', 'orange', 'pendingCommission', money(pendingComm))}
                    ${statCard('📈', 'green', 'totalProfitEarned', money(totalProfit))}
                    ${statCard('📉', 'red', 'totalLossIncurred', money(totalLoss))}
                    ${statCard('♻️', 'green', 'lossRecovery', money(totalRecovered))}
                    ${statCard('🏦', 'green', 'netCapital', money(totalInvestment + totalProfit - totalLoss))}
                </div>

                <div class="card">
                    <div class="section-title"><span class="bar"></span>${tr('orderWise')} ${tr('mainInvestorReport')}</div>
                    <div class="table-wrap">
                        <table style="font-size:11px;">
                            <thead>
                                <tr>
                                    <th>${tr('orderNumber')}</th>
                                    <th>${tr('createDate')}</th>
                                    <th>${tr('utilizedInvestment')}</th>
                                    <th>${tr('resultType')}</th>
                                    <th>${tr('amount')}</th>
                                    <th>${tr('commission')}</th>
                                    <th>${tr('lossRecovery')}</th>
                                    <th>${tr('netCommission')}</th>
                                    <th>${tr('netPayable')}</th>
                                    <th>${tr('runningBalance')}</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${orderRows || `<tr><td colspan="10"><div class="empty">${tr('noOrders')}</div></td></tr>`}
                            </tbody>
                        </table>
                    </div>
                    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
                        ${b.mainInvestorHistory && b.mainInvestorHistory.length ? `<button class="btn btn-ghost btn-sm" onclick="viewMainInvestorHistory('${b.id}')">📜 ${tr('mainInvestorHistory')}</button>` : ''}
                    </div>
                </div>
            `;
        }
