        function withdrawCommission(bizId) {
            const b = STATE.businesses.find(x => x.id === bizId);
            if (!b) return;
            const mainInv = b.investors.find(i => i.isMain);
            if (!mainInv) return;
            const pending = (b.commissionLedger?.pending || 0);
            if (pending <= 0) { toast('কোনো পেন্ডিং কমিশন নেই'); return; }
            document.getElementById('modalRoot').innerHTML = `
          <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
            <div class="modal">
              <div class="modal-title">💰 ${tr('withdrawCommission')} — ${b.name}</div>
              <div style="margin-bottom:12px;"><div><strong>${tr('pendingCommission')}:</strong> ${money(pending)}</div></div>
              <label>${tr('amount')}</label><input id="cWithdrawAmount" type="number" min="0" max="${pending}" step="1" value="${pending}"/>
              <div style="height:10px;"></div><label>${tr('note')}</label><input id="cWithdrawNote" placeholder="${tr('note')}"/>
              <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('cancel')}</button><button class="btn btn-orange" onclick="confirmWithdrawCommission('${bizId}')">💰 ${tr('withdraw')}</button></div>
            </div>
          </div>`;
        }

        function confirmWithdrawCommission(bizId) {
            const b = STATE.businesses.find(x => x.id === bizId);
            if (!b) return;
            const amount = roundAmount(parseFloat(document.getElementById('cWithdrawAmount').value));
            const note = document.getElementById('cWithdrawNote').value.trim();
            if (!amount || amount <= 0) { toast(tr('fillRequired')); return; }
            const pending = (b.commissionLedger?.pending || 0);
            if (amount > pending) { toast('পর্যাপ্ত পেন্ডিং কমিশন নেই'); return; }
            b.commissionLedger.totalWithdrawn = (b.commissionLedger.totalWithdrawn || 0) + amount;
            b.commissionLedger.pending = (b.commissionLedger.pending || 0) - amount;
            b.commissionLedger.history.push({ date: todayStr(), type: 'withdrawn', amount: amount, note: note ||
                    'কমিশন উত্তোলন' });
            const mainInv = b.investors.find(i => i.isMain);
            if (mainInv) {
                mainInv.commissionWithdrawn = (mainInv.commissionWithdrawn || 0) + amount;
                mainInv.commissionPending = Math.max(0, (mainInv.commissionPending || 0) - amount);
                mainInv.commissionHistory = mainInv.commissionHistory || [];
                mainInv.commissionHistory.push({ date: todayStr(), type: 'withdrawn', amount: amount, note: note ||
                        'কমিশন উত্তোলন' });
            }
            logAudit(b, 'commission_withdrawn', `কমিশন উত্তোলন: ${money(amount)}`, { amount, note });
            addNotification(`💰 কমিশন উত্তোলন: ${money(amount)}`);
            saveState();
            closeModal();
            toast(tr('saved'));
            renderCommissionLedger();
        }

        // ============================================================
        // COST LEDGER
        // ============================================================
        function renderCostLedger() {
            const c = document.getElementById('content');
            let html =
                `<div class="card" style="margin-bottom:16px;"><div class="section-title"><span class="bar" style="background:var(--orange)"></span>${tr('costLedger')}</div><div style="font-size:12px;color:var(--text-3);">${tr('consolidatedDesc')}</div></div>`;

            let allCosts = [];
            STATE.businesses.forEach(b => {
                const costOrders = (b.costLedger?.orders || []);
                const totalCost = costOrders.reduce((s, o) => s + (o.cost || 0), 0);
                allCosts.push({ businessName: b.name, businessId: b.id, orders: costOrders, totalCost: totalCost });
            });

            let grandTotalCost = allCosts.reduce((s, d) => s + d.totalCost, 0);
            html +=
                `<div class="grid grid-4" style="margin-bottom:16px;">${statCard('💰','','totalCost',money(grandTotalCost))}${statCard('📦','','totalOrder',allCosts.reduce((s,d)=>s+d.orders.length,0))}</div>`;

            allCosts.forEach(d => {
                html +=
                    `<div class="card" style="margin-top:14px;"><div class="section-title"><span class="bar" style="background:var(--orange)"></span>${d.businessName}</div><div style="font-weight:600;font-size:13px;color:var(--text-2);margin-bottom:6px;">${tr('totalCost')}: ${money(d.totalCost)}</div>`;
                if (d.orders.length) {
                    html +=
                        `<div class="table-wrap"><table style="font-size:11px;"><thead><tr><th>${tr('orderNumber')}</th><th>${tr('orderCost')}</th><th>${tr('grossProfit')}</th><th>${tr('netProfit')}</th><th>${tr('createDate')}</th></tr></thead><tbody>`;
                    d.orders.forEach(o => {
                        const gross = o.grossProfit || 0;
                        const cost = o.cost || 0;
                        const net = gross - cost;
                        html +=
                            `<tr><td class="mono">${o.orderNumber}</td><td class="mono" style="color:var(--orange)">${money(cost)}</td><td class="mono" style="color:var(--green)">${money(gross)}</td><td class="mono" style="color:${net>=0?'var(--green)':'var(--red)'}">${money(net)}</td><td>${o.date||''}</td></tr>`;
                    });
                    html += `</tbody></table></div>`;
                } else {
                    html += `<div class="empty" style="padding:20px 0;">${tr('noOrders')}</div>`;
                }
                html += `</div>`;
            });

            if (!allCosts.length) {
                html += `<div class="card"><div class="empty">${tr('noBiz')}</div></div>`;
            }

            c.innerHTML = html;
        }

        // ============================================================
        // ORDER CREATION (with Gross/Cost)
        // ============================================================
        function openCreateOrderModal() {
            const b = currentBiz();
            if (!b) { toast(tr('noBiz')); return; }
            const startDate = todayStr();
            const result = calculateOrderAllocation(b, startDate, 0);
            if (result.error) { toast(result.error); return; }
            document.getElementById('modalRoot').innerHTML = `
          <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
            <div class="modal" style="max-width:820px;">
              <div class="modal-title">${tr('createOrder')}</div>
              <div class="formrow"><div><label>${tr('orderStartDate')} <span style="color:var(--red)">*</span></label><input id="orderStartDate" type="date" value="${startDate}" onchange="updateOrderPreview()" /></div><div><label>${tr('orderEndDate')}</label><input id="orderEndDate" type="date" value="" /></div></div>
              <div class="formrow"><div><label>${tr('totalAvailable')}: <span class="mono" style="color:var(--green)">${money(result.totalAvailable)}</span></label><input id="utilizedAmount" type="number" min="0" step="1000" value="${result.totalAvailable}" onchange="updateOrderPreview()" oninput="updateOrderPreview()" /></div></div>
              <div style="margin-top:12px;border-top:1px solid var(--glass-brd);padding-top:12px;"><div class="section-title" style="font-size:13px;"><span class="bar"></span>${tr('orderInvestors')}</div><div id="orderPreviewContainer">${renderOrderPreviewHTML(result, b)}</div></div>
              <div style="margin-top:12px;padding:10px;background:rgba(242,153,74,0.08);border-radius:var(--radius-sm);border:1px solid rgba(242,153,74,0.2);"><div style="font-size:11px;color:var(--text-3);">⚠️ ${tr('orderSnapshotWarning')}</div></div>
              <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('cancel')}</button><button class="btn btn-green" onclick="confirmCreateOrder()">✅ ${tr('confirmOrder')}</button></div>
            </div>
          </div>`;
            _orderPreviewData = { result, biz: b };
        }

        function updateOrderPreview() {
            const startDate = document.getElementById('orderStartDate').value || todayStr();
            const utilizedAmount = roundAmount(parseFloat(document.getElementById('utilizedAmount').value) || 0);
            const b = currentBiz();
            if (!b) return;
            const result = calculateOrderAllocation(b, startDate, utilizedAmount);
            if (result.error) { document.getElementById('orderPreviewContainer').innerHTML =
                `<div class="empty">${result.error}</div>`; return; }
            document.getElementById('orderPreviewContainer').innerHTML = renderOrderPreviewHTML(result, b);
            _orderPreviewData = { result, biz: b };
        }

        function renderOrderPreviewHTML(result, b) {
            if (!result.investors.length) return `<div class="empty">${tr('noActiveInvestorsForOrder')}</div>`;
            let html =
                `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;font-size:12px;"><div><strong>${tr('totalAvailable')}:</strong> <span class="mono" style="color:var(--green)">${money(result.totalAvailable)}</span></div><div><strong>${tr('totalUtilized')}:</strong> <span class="mono" style="color:var(--orange)">${money(result.totalUtilized)}</span></div><div><strong>${tr('unutilizedAmount')}:</strong> <span class="mono" style="color:var(--text-3)">${money(result.unutilized)}</span></div></div>
          <div class="table-wrap"><table class="order-preview-table"><thead><tr><th>${tr('investor')}</th><th>${tr('available')}</th><th>${tr('utilized')} (%)</th><th>${tr('sharingRate')}</th><th>${tr('unutilizedAmount')}</th><th>${tr('previousLoss')}</th><th>${tr('pendingLoss')}</th></tr></thead><tbody>`;
            result.allocations.forEach(a => {
                const pct = result.totalAvailable > 0 ? ((a.allocated / result.totalAvailable) * 100) : 0;
                const unutilizedDisplay = a.isMain ? '—' : money(a.unutilized);
                html +=
                    `<tr><td>${a.name}${a.isMain ? ` <span class="badge badge-orange">${tr('mainCapital')}</span>` : ''}</td><td class="mono">${money(a.available)}</td><td class="mono" style="color:var(--orange)">${money(a.allocated)} (${pct.toFixed(1)}%)</td><td class="mono">${a.isMain ? '—' : a.sharingRate + '%'}</td><td class="mono" style="color:var(--text-3)">${unutilizedDisplay}</td><td class="mono" style="color:var(--red)">${money(a.previousLoss||0)}</td><td class="mono" style="color:var(--orange)">${money(a.pendingLoss||0)}</td></tr>`;
            });
            const nonMainUnutilized = result.allocations.filter(a => !a.isMain && a.unutilized > 0);
            if (nonMainUnutilized.length > 0 && result.unutilized > 0) {
                html +=
                    `<tr class="total-row"><td style="font-weight:700;color:var(--text-3)">${tr('unutilizedDistribution')}</td><td colspan="6" style="font-size:11px;color:var(--text-3);">${nonMainUnutilized.map(a => `${a.name}: ${money(a.unutilized)}`).join(' | ')}</td></tr>`;
            }
            html += `</tbody></table></div>`;
            return html;
        }

        function confirmCreateOrder() {
            const b = currentBiz();
            if (!b) return;
            const startDate = document.getElementById('orderStartDate').value || todayStr();
            const endDate = document.getElementById('orderEndDate').value || '';
            const utilizedAmount = roundAmount(parseFloat(document.getElementById('utilizedAmount').value) || 0);
            if (!startDate) { toast(tr('fillRequired')); return; }
            const result = calculateOrderAllocation(b, startDate, utilizedAmount);
            if (result.error || !result.investors.length) { toast(result.error || tr('noActiveInvestorsForOrder')); return; }
            // Validate balances haven't changed
            for (const alloc of result.allocations) {
                const inv = b.investors.find(i => i.id === alloc.investorId);
                if (!inv) continue;
                const currentAvail = investorAvailableBalance(b, inv, startDate);
                if (Math.abs(currentAvail - alloc.available) > 1) {
                    toast(`⚠️ ${inv.name} এর ব্যালেন্স পরিবর্তিত হয়েছে! দয়া করে পুনরায় চেক করুন।`);
                    updateOrderPreview();
                    return;
                }
            }
            b.orderSeq = (b.orderSeq || 0) + 1;
            const orderNumber = 'ORD-' + String(b.orderSeq).padStart(4, '0');
            const snapshotInvestors = result.allocations.map(a => ({
                investorId: a.investorId,
                name: a.name,
                isMain: a.isMain,
                utilized: a.allocated,
                sharingRate: a.sharingRate,
                sharingRateAtDate: a.sharingRateAtDate,
                commissionRateAtDate: a.commissionRateAtDate || 0,
                previousLoss: a.previousLoss || 0,
                recoveredLoss: a.recoveredLoss || 0,
                pendingLoss: a.pendingLoss || 0,
                availableBefore: a.available,
                unutilized: a.isMain ? 0 : a.unutilized,
                snapshotDate: startDate,
                snapshotBalance: a.available,
                snapshotRate: a.sharingRate
            }));
            const order = {
                id: uid('ORD'),
                orderNumber,
                status: 'running',
                createDate: startDate,
                closeDate: endDate || null,
                snapshot: {
                    investors: snapshotInvestors,
                    totalAvailable: result.totalAvailable,
                    totalUtilized: result.totalUtilized,
                    unutilized: result.unutilized,
                    snapshotDate: startDate,
                    isLocked: true
                },
                result: null,
                costLedger: { cost: 0, grossProfit: 0, netProfit: 0 },
                timeline: [{ date: startDate, event: 'created', detail: `অর্ডার তৈরি: ${orderNumber}` }]
            };
            b.orders.push(order);
            for (const alloc of result.allocations) {
                const inv = b.investors.find(i => i.id === alloc.investorId);
                if (inv) {
                    let remaining = alloc.allocated;
                    for (const dep of inv.deposits) {
                        if (remaining <= 0) break;
                        if (!dep.locked && !dep.reversed && dep.date <= startDate) {
                            dep.locked = true;
                            remaining -= dep.amount;
                            const tx = b.transactions.find(t => t.ref === dep.ref);
                            if (tx) tx.locked = true;
                        }
                    }
                }
            }
            logAudit(b, 'order_created', `অর্ডার তৈরি: ${orderNumber} (Utilized: ${money(result.totalUtilized)})`, {
                orderNumber,
                utilized: result.totalUtilized
            });
            addNotification(`📦 অর্ডার তৈরি: ${orderNumber} (${money(result.totalUtilized)})`);
            saveState();
            closeModal();
            toast(tr('saved'));
            renderOrders();
        }

        // ============================================================
        // ORDERS PAGE
        // ============================================================
        function renderOrders() {
            const c = document.getElementById('content');
            const b = currentBiz();
            if (!b) { c.innerHTML = `<div class="card"><div class="empty">${tr('noBiz')}</div></div>`; return; }
            const runningOrders = b.orders.filter(o => o.status === 'running');
            const closedOrders = b.orders.filter(o => o.status === 'closed');
            const cancelledOrders = b.orders.filter(o => o.status === 'cancelled');

            let html = `
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
              <div style="display:flex; gap:12px; flex-wrap:wrap;">
                <span class="badge badge-orange">🟢 ${tr('running')}: ${runningOrders.length}</span>
                <span class="badge badge-green">🔒 ${tr('closed')}: ${closedOrders.length}</span>
                <span class="badge badge-grey">🚫 ${tr('cancelled')}: ${cancelledOrders.length}</span>
              </div>
              <button class="btn btn-green" onclick="openCreateOrderModal()">＋ ${tr('createOrder')}</button>
            </div>
          `;

            if (b.orders.length === 0) {
                html += `<div class="empty-note">${tr('noOrders')}</div>`;
                c.innerHTML = html;
                return;
            }

            const sorted = [...b.orders].sort((a, b2) => a.orderNumber - b2.orderNumber);
            sorted.forEach(order => {
                const isExpanded = _expandedOrderId === order.id;
                const totalUtilized = order.snapshot?.totalUtilized || 0;
                let stampClass = 'stamp-open';
                if (order.status === 'closed') {
                    stampClass = (order.result && order.result.type === 'profit') ? 'stamp-profit' : 'stamp-loss';
                } else if (order.status === 'cancelled') {
                    stampClass = 'stamp-open';
                }
                const resultLabel = order.result ? (order.result.type === 'profit' ? tr('profit') : tr('loss')) :
                '—';
                const resultAmount = order.result ? money(order.result.amount) : '—';

                // Show net profit if closed
                let netDisplay = '';
                if (order.status === 'closed' && order.costLedger) {
                    const gross = order.costLedger.grossProfit || 0;
                    const cost = order.costLedger.cost || 0;
                    const net = gross - cost;
                    netDisplay =
                        ` | ${tr('netProfit')}: <b style="color:${net>=0?'var(--green)':'var(--red)'}">${money(net)}</b>`;
                }

                html += `
              <div class="order-card">
                <div class="order-top">
                  <div class="order-stamp ${stampClass}">#${order.orderNumber}</div>
                  <div class="order-meta">
                    <div class="dates">${order.createDate} → ${order.closeDate || 'চলমান'}</div>
                    <div class="amounts">${tr('utilizedInvestment')}: <b>${money(totalUtilized)}</b> &nbsp;|&nbsp; ${tr('resultType')}: <b>${resultLabel}</b> ${resultAmount !== '—' ? `(${resultAmount})` : ''}${netDisplay}</div>
                    <button class="toggle-link" onclick="toggleOrderExpand('${order.id}')">${isExpanded ? tr('collapseDetails') : tr('expandDetails')}</button>
                  </div>
                  <div class="order-actions">
                    ${order.status === 'running' ? `<button class="btn btn-orange btn-sm" onclick="event.stopPropagation(); openCloseOrder('${order.id}')">${tr('closeOrder')}</button><button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); cancelOrder('${order.id}')">🚫 ${tr('cancelOrder')}</button>` : ''}
                    <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); viewSnapshot('${order.id}')">👁️ ${tr('viewSnapshot')}</button>
                    <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); printSingleOrder('${order.id}')">🖨️ ${tr('printOrder')}</button>
                  </div>
                </div>
                <div class="split-bar">
                  ${(order.snapshot?.investors||[]).map(a => {
                    const pct = order.snapshot.totalUtilized > 0 ? (a.utilized / order.snapshot.totalUtilized * 100) : 0;
                    const color = a.isMain ? 'var(--green)' : 'var(--orange)';
                    return `<div class="split-seg" style="width:${pct}%; background:${color};" title="${a.name}"></div>`;
                  }).join('')}
                </div>
                <div class="order-detail ${isExpanded ? 'open' : ''}" id="detail-${order.id}">
                  <div class="inner">
                    ${renderOrderDetails(order, b)}
                  </div>
                </div>
              </div>
            `;
            });

            c.innerHTML = html;
        }

        function toggleOrderExpand(orderId) {
            _expandedOrderId = _expandedOrderId === orderId ? null : orderId;
            renderOrders();
        }

        function renderOrderDetails(o, b) {
            let html = `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;font-size:12.5px;">
            <div><strong>${tr('orderNumber')}:</strong> <span class="mono">${o.orderNumber}</span></div>
            <div><strong>${tr('createDate')}:</strong> ${o.createDate}</div>
            <div><strong>${tr('closeDate')}:</strong> ${o.closeDate || '—'}</div>
            <div><strong>${tr('totalAvailable')}:</strong> ${money(o.snapshot?.totalAvailable || 0)}</div>
            <div><strong>${tr('utilizedInvestment')}:</strong> ${money(o.snapshot?.totalUtilized || 0)}</div>
            <div><strong>${tr('unutilizedAmount')}:</strong> ${money(o.snapshot?.unutilized || 0)}</div>
            <div><strong>${tr('status')}:</strong> <span class="badge ${o.status==='running'?'badge-orange':o.status==='cancelled'?'badge-grey':'badge-green'}">${o.status==='running'?tr('running'):o.status==='cancelled'?tr('cancelled'):tr('closed')}</span></div>
            ${o.result ? `<div><strong>${tr('resultType')}:</strong> <span class="badge ${o.result.type==='profit'?'badge-green':'badge-red'}">${o.result.type==='profit'?tr('profit'):tr('loss')} ${money(o.result.amount)}</span></div>` : ''}
            ${o.costLedger ? `<div><strong>${tr('grossProfit')}:</strong> ${money(o.costLedger.grossProfit||0)}</div><div><strong>${tr('orderCost')}:</strong> ${money(o.costLedger.cost||0)}</div><div><strong>${tr('netProfit')}:</strong> <span style="color:${(o.costLedger.grossProfit||0)-(o.costLedger.cost||0)>=0?'var(--green)':'var(--red)'}">${money((o.costLedger.grossProfit||0)-(o.costLedger.cost||0))}</span></div>` : ''}
            ${o.timeline ? `<div style="grid-column:1/-1;font-size:11px;color:var(--text-3);border-top:1px solid var(--glass-brd);padding-top:8px;margin-top:4px;"><strong>${tr('timeline')}:</strong> ${o.timeline.map(t => `${t.date} - ${t.detail}`).join(' → ')}</div>` : ''}
          </div>`;

            html += `<div style="margin-top:8px;border-top:1px solid var(--glass-brd);padding-top:8px;">
            <div style="font-weight:600;font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
              <span>👥 ${tr('orderInvestors')}</span>
              ${o.result ? `<button class="btn btn-ghost btn-sm" onclick="showCalculation('${o.id}')">🧮 ${tr('calculationDetails')}</button>` : ''}
            </div>
            <div class="table-wrap"><table style="font-size:11.5px;">
              <thead><tr><th>${tr('investor')}</th><th>${tr('available')}</th><th>${tr('utilized')}</th><th>${tr('sharingRate')}</th><th>${tr('unutilizedAmount')}</th>${o.result ? `<th>${o.result.type==='profit'?tr('profit'):tr('loss')}</th>` : ''}</tr></thead>
              <tbody>
              ${(o.snapshot?.investors||[]).map(a => {
                const alloc = o.result ? o.result.allocations.find(x => x.investorId === a.investorId) : null;
                const unutilizedDisplay = a.isMain ? '—' : money(a.unutilized || 0);
                return `<tr><td>${a.name}${a.isMain ? ` <span class="badge badge-orange">${tr('mainCapital')}</span>` : ''}</td>
                  <td class="mono">${money(a.availableBefore || a.utilized + (a.unutilized || 0))}</td>
                  <td class="mono" style="color:var(--orange)">${money(a.utilized)}</td>
                  <td class="mono">${a.isMain ? '—' : a.sharingRate + '%'}</td>
                  <td class="mono" style="color:var(--text-3)">${unutilizedDisplay}</td>
                  ${o.result ? `<td class="mono" style="color:${o.result.type==='profit'?'var(--green)':'var(--red)'}">${alloc ? money(alloc.amount) : '—'}</td>` : ''}
                </tr>`;
              }).join('')}
              </tbody>
            </table></div>
          </div>`;

            if (o.result && o.result.type === 'profit' && o.result.commission > 0) {
                html +=
                    `<div style="margin-top:6px;display:flex;justify-content:flex-end;font-weight:700;color:var(--orange);">${tr('commission')}: ${money(o.result.commission)}</div>`;
            }
            return html;
        }

        // ============================================================
        // VIEW SNAPSHOT
        // ============================================================

            <div class="modal" style="max-width:760px">
              <div class="modal-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><span>${o.orderNumber} — ${tr('viewSnapshot')}</span><span class="snapshot-lock">🔒 ${tr('snapshotLocked')}</span></div>
              <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;font-size:12px;"><div><strong>${tr('totalAvailable')}:</strong> ${money(o.snapshot.totalAvailable)}</div><div><strong>${tr('utilizedInvestment')}:</strong> ${money(o.snapshot.totalUtilized)}</div><div><strong>${tr('unutilizedAmount')}:</strong> ${money(o.snapshot.unutilized || 0)}</div><div><strong>${tr('snapshotDate')}:</strong> ${o.snapshot.snapshotDate || o.createDate}</div><div><strong>${tr('status')}:</strong> <span class="badge ${o.status==='running'?'badge-orange':o.status==='cancelled'?'badge-grey':'badge-green'}">${o.status==='running'?tr('running'):o.status==='cancelled'?tr('cancelled'):tr('closed')}</span></div></div>

              ${o.snapshot.investors.map(a => { const unutilizedDisplay = a.isMain ? '—' : money(a.unutilized || 0); return `<tr><td>${a.name}${a.isMain ? ` <span class="badge badge-orange">${tr('mainCapital')}</span>` : ''}</td><td class="mono">${money(a.availableBefore || a.utilized + (a.unutilized || 0))}</td><td class="mono" style="color:var(--orange)">${money(a.utilized)}</td><td class="mono">${a.isMain ? '—' : a.sharingRate + '%'}</td><td class="mono" style="color:var(--text-3)">${unutilizedDisplay}</td><td class="mono" style="color:var(--red)">${money(a.previousLoss || 0)}</td><td class="mono" style="color:var(--orange)">${money(a.pendingLoss || 0)}</td></tr>`; }).join('')}

              ${o.result.allocations.map(a => `<tr><td>${a.name}</td><td class="mono" style="color:${o.result.type==='profit'?'var(--green)':'var(--red)'}">${money(a.amount)}</td><td class="mono" style="color:var(--green)">${money(a.recovered || 0)}</td><td class="mono" style="color:var(--green)">${a.isMain ? '—' : money(a.netPayable || 0)}</td></tr>`).join('')}
              ${o.result.type === 'profit' ? `<tr><td style="font-weight:700">${tr('commission')}</td><td class="mono" style="font-weight:700;color:var(--orange)">${money(o.result.commission)}</td><td></td><td></td></tr>` : ''}

            </div>
          </div>`;
        }

        // ============================================================
        // SHOW CALCULATION
        // ============================================================

                <div style="font-weight:700;color:var(--text-3);font-size:11px;">${tr('profitShare')}</div>
                <div style="font-weight:700;color:var(--text-3);font-size:11px;">${tr('netAmount')}</div>

        function previewClose(orderId) {
            const b = currentBiz();
            const o = b.orders.find(x => x.id === orderId);
            if (!o) return;

            const gross = parseFloat(document.getElementById('cGrossProfit').value) || 0;
            const cost = parseFloat(document.getElementById('cOrderCost').value) || 0;
            const netProfitVal = gross - cost;
            document.getElementById('netProfitDisplay').textContent = money(netProfitVal);
            document.getElementById('netProfitDisplay').style.color = netProfitVal >= 0 ? 'var(--green)' : 'var(--red)';

            const type = document.getElementById('cResultType').value;
            const amountEl = document.getElementById('cResultAmount');
            // auto-fill net profit if amount is 0
            if (!amountEl.value || parseFloat(amountEl.value) === 0) {
                if (type === 'profit' && netProfitVal > 0) amountEl.value = netProfitVal;
                else if (type === 'loss' && netProfitVal < 0) amountEl.value = Math.abs(netProfitVal);
            }
            const amount = roundAmount(parseFloat(amountEl.value));
            if (!amount || amount <= 0) { document.getElementById('previewBox').innerHTML =
                `<div style="padding:16px;color:var(--text-3);">${tr('fillRequired')}</div>`; return; }

            const dist = computeDistribution(o, type, amount);
            const showFull = _showFullCalc;
            let html =
                `<div class="table-wrap" style="margin-top:12px"><div class="section-title" style="font-size:13px;margin-bottom:8px"><span class="bar"></span>${tr('distributionBreakdown')}</div><table><thead><tr><th>${tr('investor')}</th><th>${tr('utilizedAmount')}</th>${showFull ? `<th>${tr('totalShare')}</th>` : ''}${showFull ? `<th>${tr('recoveredLoss')}</th>` : ''}${showFull ? `<th>${tr('profitShare')}</th>` : ''}<th>${tr('netPayable')}</th></tr></thead><tbody>`;
            dist.allocations.forEach(a => {
                const isMain = a.isMain || false;
                const totalShare = a.totalShare || 0;
                const netDisplay = isMain ? '—' : money(a.amount);
                html +=
                    `<tr><td>${a.name}${isMain ? ` <span class="badge badge-orange">${tr('mainCapital')}</span>` : ''}</td><td class="mono">${money(a.utilized || 0)}</td>${showFull ? `<td class="mono">${money(totalShare)}</td>` : ''}${showFull ? `<td class="mono" style="color:var(--green)">${money(a.recovered || 0)}</td>` : ''}${showFull ? `<td class="mono" style="color:var(--green)">${money(a.profitShare || 0)}</td>` : ''}<td class="mono" style="font-weight:700;color:${type==='profit'?'var(--green)':'var(--red)'}">${netDisplay}</td></tr>`;
            });
            if (type === 'profit' && dist.commission > 0) {
                html +=
                    `<tr style="border-top:2px solid var(--glass-brd)"><td style="font-weight:700">${tr('mainCommission')}</td><td></td>${showFull ? `<td></td><td></td><td></td>` : ''}<td class="mono" style="font-weight:700;color:var(--orange)">${money(dist.commission)}</td></tr>`;
            }
            html +=
                `<tr style="border-top:2px solid var(--glass-brd);font-weight:700"><td>${tr('grandTotal')}</td><td></td>${showFull ? `<td></td><td></td><td></td>` : ''}<td class="mono">${money(dist.amount)}</td></tr>`;
            if (type === 'profit') { html +=
                    `<tr><td colspan="${showFull ? 6 : 3}" style="font-size:12px;color:var(--text-3)">${tr('netPayableProfit')}: ${money(dist.netPayable)}</td></tr>`; }
            html += `</tbody></table></div>`;
            document.getElementById('previewBox').innerHTML = html;
            document.getElementById('approveBtn').style.display = 'inline-flex';
            _pendingDist = { ...dist, grossProfit: gross, orderCost: cost, netProfit: netProfitVal };
        }

        function computeDistribution(o, type, amount) {
            const investors = o.snapshot.investors;
            const totalUtilized = o.snapshot.totalUtilized || 1;
            let allocations = [];
            if (type === 'profit') {
                let totalLossRecovery = 0;
                const recoveryAllocs = [];
                investors.forEach(a => {
                    const pendingLoss = a.pendingLoss || 0;
                    const share = (a.utilized / totalUtilized) * amount;
                    const recovered = Math.min(pendingLoss, share);
                    recoveryAllocs.push({ investorId: a.investorId, name: a.name, recovered, share,
                    pendingLoss });
                    totalLossRecovery += recovered;
                });
                let remainingProfit = amount - totalLossRecovery;
                let commission = 0;
                const profitAllocs = [];
                const nonMain = investors.filter(a => !a.isMain);
                const nonMainTotalUtilized = nonMain.reduce((s, a) => s + a.utilized, 0) || 1;
                let allocatedProfit = 0;
                nonMain.forEach(a => {
                    const share = (a.utilized / nonMainTotalUtilized) * remainingProfit;
                    const rate = (a.sharingRate || 0) / 100;
                    const investorProfit = share * rate;
                    profitAllocs.push({ investorId: a.investorId, name: a.name, amount: investorProfit });
                    allocatedProfit += investorProfit;
                });
                commission = roundAmount(remainingProfit - allocatedProfit);
                allocations = investors.map(a => {
                    const recovery = recoveryAllocs.find(r => r.investorId === a.investorId);
                    const profit = profitAllocs.find(p => p.investorId === a.investorId);
                    const utilized = a.utilized;
                    const pShare = (utilized / totalUtilized) * amount;
                    const recoveredAmt = recovery ? recovery.recovered : 0;
                    const profitAmt = profit ? profit.amount : 0;
                    return {
                        investorId: a.investorId,
                        name: a.name,
                        isMain: a.isMain,
                        utilized: utilized,
                        totalShare: pShare,
                        recovered: recoveredAmt,
                        profitShare: profitAmt,
                        amount: roundAmount(recoveredAmt + profitAmt),
                        netPayable: roundAmount(profitAmt)
                    };
                });
                const mainInv = investors.find(a => a.isMain);
                if (mainInv && commission > 0) {
                    const existing = allocations.find(a => a.investorId === mainInv.investorId);
                    if (existing) { existing.amount = roundAmount(existing.amount + commission);
                        existing.netPayable = 0;
                        existing.commission = commission; } else { allocations.push({ investorId: mainInv
                                .investorId, name: mainInv.name, isMain: true, utilized: mainInv.utilized ||
                                0, totalShare: 0, recovered: 0, profitShare: 0, amount: roundAmount(
                                commission), netPayable: 0, commission: commission }); }
                }
                return { type: 'profit', amount, allocations, commission, netPayable: roundAmount(amount -
                    commission) };
            } else {
                investors.forEach(a => {
                    const share = (a.utilized / totalUtilized) * amount;
                    allocations.push({
                        investorId: a.investorId,
                        name: a.name,
                        isMain: a.isMain,
                        utilized: a.utilized,
                        totalShare: share,
                        recovered: 0,
                        profitShare: 0,
                        amount: roundAmount(share),
                        netPayable: 0
                    });
                });
                return { type: 'loss', amount, allocations, commission: 0, netPayable: 0 };
            }
        }

        function confirmCloseOrder(orderId) {
            const b = currentBiz();
            const o = b.orders.find(x => x.id === orderId);
            if (!o || !_pendingDist) return;
            if (o.status === 'closed') { toast('অর্ডার ইতিমধ্যে ক্লোজ করা হয়েছে'); return; }
            const dist = _pendingDist;
            o.status = 'closed';
            o.closeDate = document.getElementById('cResultDate')?.value || todayStr();
            o.result = dist;
            o.costLedger = {
                grossProfit: dist.grossProfit || 0,
                cost: dist.orderCost || 0,
                netProfit: dist.netProfit || 0
            };
            o.timeline = o.timeline || [];
            o.timeline.push({ date: o.closeDate, event: 'closed', detail: `অর্ডার ক্লোজ: ${o.orderNumber} - ${dist.type} ${money(dist.amount)}` });

            // Update cost ledger in business
            if (!b.costLedger) b.costLedger = { totalCost: 0, orders: [] };
            b.costLedger.orders.push({
                orderNumber: o.orderNumber,
                date: o.closeDate,
                grossProfit: dist.grossProfit || 0,
                cost: dist.orderCost || 0,
                netProfit: dist.netProfit || 0
            });
            b.costLedger.totalCost = (b.costLedger.totalCost || 0) + (dist.orderCost || 0);

            if (dist.type === 'profit') {
                dist.allocations.forEach(a => {
                    const inv = b.investors.find(i => i.id === a.investorId);
                    if (!inv) return;
                    const profitAmt = a.amount;
                    const recovered = a.recovered || 0;
                    if (recovered > 0) {
                        inv.recoveredLoss = (inv.recoveredLoss || 0) + recovered;
                        b.transactions.push({
                            ref: newRef(),
                            type: 'loss_recovery',
                            investorId: inv.id,
                            amount: recovered,
                            date: o.closeDate,
                            note: `লস রিকভারি ${o.orderNumber}`,
                            locked: true,
                            reversed: false
                        });
                        const pending = (inv.lossBalance || 0) - (inv.recoveredLoss || 0);
                        if (pending <= 0) {
                            addNotification(`✅ ${inv.name} এর লস সম্পূর্ণ রিকভার হয়েছে`);
                        }
                    }
                    const netProfit = profitAmt - recovered;
                    if (netProfit > 0 && !inv.isMain) {
                        inv.totalProfit = (inv.totalProfit || 0) + netProfit;
                        inv.netPayable = (inv.netPayable || 0) + netProfit;
                        b.transactions.push({
                            ref: newRef(),
                            type: 'profit_distribution',
                            investorId: inv.id,
                            amount: netProfit,
                            date: o.closeDate,
                            note: `প্রফিট বণ্টন ${o.orderNumber}`,
                            locked: true,
                            reversed: false
                        });
                    } else if (netProfit > 0 && inv.isMain) {
                        inv.totalProfit = (inv.totalProfit || 0) + netProfit;
                    }
                });
                if (dist.commission > 0) {
                    const mainInv = b.investors.find(i => i.isMain);
                    if (mainInv) {
                        mainInv.totalProfit = (mainInv.totalProfit || 0) + dist.commission;
                        b.commissionLedger.totalEarned = (b.commissionLedger.totalEarned || 0) + dist.commission;
                        b.commissionLedger.pending = (b.commissionLedger.pending || 0) + dist.commission;
                        b.commissionLedger.history.push({
                            date: o.closeDate,
                            type: 'earned',
                            amount: dist.commission,
                            note: `কমিশন ${o.orderNumber}`
                        });
                        mainInv.commissionEarned = (mainInv.commissionEarned || 0) + dist.commission;
                        mainInv.commissionPending = (mainInv.commissionPending || 0) + dist.commission;
                        mainInv.commissionHistory = mainInv.commissionHistory || [];
                        mainInv.commissionHistory.push({
                            date: o.closeDate,
                            type: 'earned',
                            amount: dist.commission,
                            note: `কমিশন ${o.orderNumber}`
                        });
                        b.transactions.push({
                            ref: newRef(),
                            type: 'commission',
                            investorId: mainInv.id,
                            amount: dist.commission,
                            date: o.closeDate,
                            note: `কমিশন ${o.orderNumber}`,
                            locked: true,
                            reversed: false
                        });
                    }
                }
                logAudit(b, 'order_close', `অর্ডার ক্লোজ (প্রফিট): ${o.orderNumber} — ${money(dist.amount)}`, {
                    orderNumber: o.orderNumber,
                    amount: dist.amount,
                    type: 'profit'
                });
            } else {
                dist.allocations.forEach(a => {
                    const inv = b.investors.find(i => i.id === a.investorId);
                    if (!inv) return;
                    inv.lossBalance = (inv.lossBalance || 0) + a.amount;
                    inv.totalLoss = (inv.totalLoss || 0) + a.amount;
                    b.transactions.push({
                        ref: newRef(),
                        type: 'loss_distribution',
                        investorId: inv.id,
                        amount: a.amount,
                        date: o.closeDate,
                        note: `লস বণ্টন ${o.orderNumber}`,
                        locked: true,
                        reversed: false
                    });
                });
                logAudit(b, 'order_close', `অর্ডার ক্লোজ (লস): ${o.orderNumber} — ${money(dist.amount)}`, {
                    orderNumber: o.orderNumber,
                    amount: dist.amount,
                    type: 'loss'
                });
            }
            addNotification(`🔒 অর্ডার ক্লোজ: ${o.orderNumber} (${dist.type}: ${money(dist.amount)})`);
            _pendingDist = null;
            saveState();
            closeModal();
            toast(tr('saved'));
            renderOrders();
        }

        // ============================================================
        // CANCEL ORDER
        // ============================================================
        function cancelOrder(orderId) {
            const b = currentBiz();
            const o = b.orders.find(x => x.id === orderId);
            if (!o || o.status !== 'running') return;
            if (!confirm(`"${o.orderNumber}" ${tr('cancelOrder')} করতে চান?`)) return;
            o.status = 'cancelled';
            o.timeline = o.timeline || [];
            o.timeline.push({ date: todayStr(), event: 'cancelled', detail: `অর্ডার বাতিল: ${o.orderNumber}` });
            // Unlock deposits
            o.snapshot.investors.forEach(a => {
                const inv = b.investors.find(i => i.id === a.investorId);
                if (inv) {
                    let remaining = a.utilized;
                    for (const dep of inv.deposits) {
                        if (remaining <= 0) break;
                        if (dep.locked && !dep.reversed) {
                            dep.locked = false;
                            const tx = b.transactions.find(t => t.ref === dep.ref);
                            if (tx) tx.locked = false;
                            remaining -= dep.amount;
                        }
                    }
                }
            });
            logAudit(b, 'order_cancelled', `অর্ডার বাতিল: ${o.orderNumber}`, { orderNumber: o.orderNumber });
            addNotification(`🚫 অর্ডার বাতিল: ${o.orderNumber}`);
            saveState();
            toast('অর্ডার বাতিল করা হয়েছে');
            renderOrders();
        }

                    ${!inv.isMain ? `<div style="font-size:10px;color:var(--text-3);">📊 ${tr('sharingRate')}: ${rate}% ${currentRate ? `(${tr('effective')}: ${currentRate.effectiveDate})` : ''}</div>` : ''}
                    </div>
                  </div>

                    <div style="text-align:right"><div style="font-size:10.5px;color:var(--text-3)">${tr('utilized')}</div><div class="mono" style="font-weight:700;color:var(--orange)">${money(util)}</div></div>
                    ${!inv.isMain ? `<div style="text-align:right"><div style="font-size:10.5px;color:var(--text-3)">${tr('sharingRate')}</div><div class="mono" style="font-weight:700">${rate}%</div></div>` : ''}
                    <span class="badge ${inv.active?'badge-green':'badge-red'}">${inv.active?tr('active'):tr('inactive')}</span>
                    <button class="btn btn-ghost btn-sm" onclick="openEditInvestorModal('${inv.id}')">✏️ ${tr('edit')}</button>
                    <button class="btn btn-ghost btn-sm" onclick="toggleInvestorActive('${inv.id}')">${tr('toggleActive')}</button>
                    ${pendingProfit > 0 && !inv.isMain ? `<button class="btn btn-green btn-sm" onclick="payProfit('${inv.id}','${b.id}')">💰 ${tr('payProfit')}</button>` : ''}
                    ${!inv.isMain ? `<button class="btn btn-ghost btn-sm" onclick="openSharingRateHistory('${inv.id}')">📊 ${tr('rateHistory')}</button>` : ''}
                    ${!hasHistory ? `<button class="btn btn-danger btn-sm" onclick="deleteInvestor('${inv.id}')">🗑️ ${tr('delete')}</button>` : `<span class="badge badge-grey" title="${tr('investorHasHistory')}">🔒 ${tr('protected')}</span>`}

        function openInvestorModal() {

          <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
            <div class="modal">
              <div class="modal-title">${tr('addInvestor')}</div>
              <label>${tr('name')} <span style="color:var(--red)">*</span></label><input id="mInvName"/>
              <div style="height:10px"></div><label>${tr('mobile')}</label><input id="mInvMobile"/>
              <div style="height:10px"></div><label>${tr('email')}</label><input id="mInvEmail" type="email" placeholder="name@example.com"/>
              <div style="height:10px"></div><label>${tr('sharingRate')} <span style="color:var(--red)">*</span></label><input id="mInvShare" type="number" min="0" max="100" value="40"/>
              <div style="height:10px"></div><label>${tr('effectiveDate')} <span style="color:var(--red)">*</span></label><input id="mInvShareDate" type="date" value="${todayStr()}"/>

          </div>`;

        function createInvestor() {
            const b = currentBiz();
            if (!b) return;
            const name = document.getElementById('mInvName').value.trim();
            const mobile = document.getElementById('mInvMobile').value.trim();
            const email = document.getElementById('mInvEmail').value.trim();
            const rate = parseFloat(document.getElementById('mInvShare').value) || 40;
            const effectiveDate = document.getElementById('mInvShareDate').value || todayStr();
            if (!name) { toast(tr('fillRequired')); return; }
            if (!effectiveDate) { toast(tr('fillRequired')); return; }
            let n = b.investors.length + 1;
            let idCand = 'INV-' + String(n).padStart(4, '0');
            while (b.investors.some(i => i.id === idCand)) { n++;
                idCand = 'INV-' + String(n).padStart(4, '0'); }
            const inv = {
                id: idCand,
                name,
                mobile,
                email,
                active: true,
                isMain: false,
                deposits: [],
                withdraws: [],
                sharingHistory: [{ rate, effectiveDate }],
                commissionRateHistory: [{ rate: 60, effectiveDate: todayStr() }],
                lossBalance: 0,
                totalProfit: 0,
                totalLoss: 0,
                recoveredLoss: 0,
                pendingLoss: 0,
                netPayable: 0,
                paidProfit: 0,
                pendingProfit: 0,
                commissionEarned: 0,
                commissionWithdrawn: 0,
                commissionPending: 0,
                commissionHistory: []
            };
            b.investors.push(inv);
            logAudit(b, 'investor_added', `ইনভেস্টর যুক্ত: ${name} (${idCand})`, { name, id: idCand });
            addNotification(`👤 ইনভেস্টর যুক্ত: ${name} (${idCand})`);
            saveState();
            closeModal();
            toast(tr('saved'));
            renderInvestors();
        }

        function investorHasHistory(biz, investorId) {
            const inv = biz.investors.find(i => i.id === investorId);
            if (!inv) return false;
            if (inv.deposits.length > 0 || inv.withdraws.length > 0) return true;
            if (inv.totalProfit > 0 || inv.totalLoss > 0) return true;
            if (inv.netPayable > 0 || inv.paidProfit > 0) return true;
            for (const order of biz.orders) {
                if (order.snapshot && order.snapshot.investors.some(a => a.investorId === investorId)) return true;
            }
            return false;
        }

        function toggleInvestorActive(invId) {
            const b = currentBiz();
            const inv = b.investors.find(i => i.id === invId);
            if (!inv) return;
            inv.active = !inv.active;
            logAudit(b, 'investor_status', `${inv.name} ${inv.active?'একটিভ':'ইনএকটিভ'} করা হয়েছে`, { name: inv.name,
                active: inv.active });
            addNotification(`🔄 ${inv.name} ${inv.active?'একটিভ':'ইনএকটিভ'} করা হয়েছে`);
            saveState();
            renderInvestors();
        }

        function deleteInvestor(invId) {
            const b = currentBiz();
            const inv = b.investors.find(i => i.id === invId);
            if (!inv) return;
            if (investorHasHistory(b, invId)) { toast('এই ইনভেস্টরের ইতিহাস রয়েছে, ডিলিট করা যাবে না। শুধুমাত্র Inactive করা যাবে।',

            b.investors = b.investors.filter(i => i.id !== invId);

            addNotification(`🗑️ ইনভেস্টর ডিলিট: ${inv.name}`);

            toast('ইনভেস্টর ডিলিট করা হয়েছে');

        function openEditInvestorModal(invId) {
            const b = currentBiz();
            const inv = b.investors.find(i => i.id === invId);
            if (!inv) return;
            const rate = getInvestorSharingRate(inv);
            document.getElementById('modalRoot').innerHTML = `
          <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
            <div class="modal">
              <div class="modal-title">${tr('editInvestor')} — <span class="mono" style="font-size:13px;color:var(--text-3)">${inv.id}</span></div>
              <label>${tr('name')} <span style="color:var(--red)">*</span></label><input id="eInvName" value="${inv.name.replace(/"/g,'&quot;')}"/>
              <div style="height:10px"></div><label>${tr('mobile')}</label><input id="eInvMobile" value="${(inv.mobile||'').replace(/"/g,'&quot;')}"/>
              <div style="height:10px"></div><label>${tr('email')}</label><input id="eInvEmail" type="email" value="${(inv.email||'').replace(/"/g,'&quot;')}"/>

              <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('cancel')}</button><button class="btn btn-green" onclick="saveInvestorEdit('${inv.id}')">${tr('save')}</button></div>
            </div>
          </div>`;

        function saveInvestorEdit(invId) {
            const b = currentBiz();
            const inv = b.investors.find(i => i.id === invId);
            if (!inv) return;
            const name = document.getElementById('eInvName').value.trim();
            const mobile = document.getElementById('eInvMobile').value.trim();
            const email = document.getElementById('eInvEmail').value.trim();
            if (!name) { toast(tr('fillRequired')); return; }
            inv.name = name;
            inv.mobile = mobile;
            inv.email = email;
            if (!inv.isMain) {
                const shareEl = document.getElementById('eInvShare');
                if (shareEl) {
                    const newRate = parseFloat(shareEl.value) || 0;
                    const curRate = getInvestorSharingRate(inv);
                    if (newRate !== curRate) {
                        if (isRateUsedInOrders(b, inv.id, todayStr())) {
                            toast('⚠️ এই রেট ইতিমধ্যে অর্ডারে ব্যবহৃত হয়েছে। নতুন Effective Date সহ যোগ করুন。', 'error');
                            return;
                        }
                        inv.sharingHistory.push({ rate: newRate, effectiveDate: todayStr() });
                    }
                }
            }
            logAudit(b, 'investor_edit', `ইনভেস্টর এডিট: ${inv.name} (${inv.id})`, { name: inv.name, id: inv.id });
            addNotification(`✏️ ইনভেস্টর আপডেট: ${inv.name}`);
            saveState();
            closeModal();
            toast(tr('updated'));
            renderInvestors();
        }

        function isRateUsedInOrders(biz, investorId, effectiveDate) {
            for (const order of biz.orders) {
                if (order.status === 'running' || order.status === 'closed') {
                    const alloc = order.snapshot.investors.find(a => a.investorId === investorId);
                    if (alloc && alloc.snapshotDate && alloc.snapshotDate >= effectiveDate) return true;
                }
            }
            return false;
        }

        function openSharingRateHistory(invId) {
            const b = currentBiz();
            const inv = b.investors.find(i => i.id === invId);
            if (!inv) return;
            const history = (inv.sharingHistory || []).slice().sort((a, b2) => a.effectiveDate.localeCompare(b2
            .effectiveDate));
            const currentRate = history.length ? history[history.length - 1] : null;
            document.getElementById('modalRoot').innerHTML = `
          <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
            <div class="modal">
              <div class="modal-title">📊 ${tr('rateHistory')} — ${inv.name}</div>
              <div style="margin-bottom:12px;"><strong>${tr('currentRate')}:</strong> ${currentRate ? `${currentRate.rate}% (${currentRate.effectiveDate})` : 'N/A'}</div>
              <div class="table-wrap"><table style="font-size:11px;"><thead><tr><th>${tr('effectiveDate')}</th><th>${tr('rate')}</th><th>${tr('status')}</th></tr></thead><tbody>
              ${history.map((h,idx)=>{const isCurrent = idx === history.length-1; const isUsed = isRateUsedInOrders(b, inv.id, h.effectiveDate); return `<tr><td>${h.effectiveDate}</td><td>${h.rate}%</td><td><span class="badge ${isCurrent?'badge-green':'badge-grey'}">${isCurrent?tr('current'):tr('expired')}</span>${isUsed ? ' 🔒' : ''}</td></tr>`;}).join('')}

              <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('cancel')}</button></div>
            </div>
          </div>`;
        }

        function addSharingRate(invId) {
            const b = currentBiz();
            const inv = b.investors.find(i => i.id === invId);
            if (!inv) return;
            document.getElementById('modalRoot').innerHTML = `
          <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
            <div class="modal">
              <div class="modal-title">➕ ${tr('addRate')} — ${inv.name}</div>
              <label>${tr('rate')} (%)</label><input id="newRate" type="number" min="0" max="100" step="0.5" value="${(inv.sharingHistory||[]).length ? inv.sharingHistory[inv.sharingHistory.length-1].rate : 40}"/>
              <div style="height:10px;"></div><label>${tr('effectiveDate')} <span style="color:var(--red)">*</span></label><input id="newRateDate" type="date" value="${todayStr()}"/>
              <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('cancel')}</button><button class="btn btn-green" onclick="confirmAddSharingRate('${inv.id}')">${tr('save')}</button></div>
            </div>
          </div>`;
        }

        function confirmAddSharingRate(invId) {
            const b = currentBiz();
            const inv = b.investors.find(i => i.id === invId);
            if (!inv) return;
            const rate = parseFloat(document.getElementById('newRate').value);
            const date = document.getElementById('newRateDate').value;
            if (isNaN(rate) || rate < 0) { toast(tr('fillRequired')); return; }
            if (!date) { toast(tr('fillRequired')); return; }
            if ((inv.sharingHistory||[]).some(r => r.effectiveDate === date)) { toast('এই তারিখে ইতিমধ্যে একটি Rate রয়েছে');
                return; }
            inv.sharingHistory.push({ rate, effectiveDate: date });
            logAudit(b, 'sharing_rate_added', `শেয়ারিং রেট যোগ: ${rate}% (${date})`, { rate, date });
            addNotification(`📊 শেয়ারিং রেট: ${inv.name} — ${rate}% (${date})`);
            saveState();
            closeModal();
            toast(tr('saved'));
            renderInvestors();
        }

        function payProfit(investorId, businessId) {
            const b = STATE.businesses.find(x => x.id === businessId);
            if (!b) return;
            const inv = b.investors.find(i => i.id === investorId);
            if (!inv) return;
            if (inv.isMain) { toast('মেইন ইনভেস্টরের জন্য প্রফিট পেমেন্ট প্রযোজ্য নয়'); return; }
            const pending = (inv.netPayable || 0) - (inv.paidProfit || 0);
            if (pending <= 0) { toast('কোনো পেন্ডিং প্রফিট নেই'); return; }
            document.getElementById('modalRoot').innerHTML = `
          <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
            <div class="modal">
              <div class="modal-title">💰 ${tr('payProfit')} — ${inv.name}</div>
              <div style="margin-bottom:12px;"><div><strong>${tr('netPayableProfit')}:</strong> ${money(inv.netPayable||0)}</div><div><strong>${tr('paidProfit')}:</strong> ${money(inv.paidProfit||0)}</div><div><strong>${tr('pendingProfit')}:</strong> ${money(pending)}</div></div>
              <label>${tr('amount')}</label><input id="pPayAmount" type="number" min="0" max="${pending}" step="1" value="${pending}"/>
              <div style="height:10px"></div><label>${tr('note')}</label><input id="pPayNote" placeholder="${tr('note')}"/>
              <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('cancel')}</button><button class="btn btn-green" onclick="confirmPayProfit('${investorId}','${businessId}')">💰 ${tr('pay')}</button></div>
            </div>
          </div>`;
        }

        function confirmPayProfit(investorId, businessId) {
            const b = STATE.businesses.find(x => x.id === businessId);
            if (!b) return;
            const inv = b.investors.find(i => i.id === investorId);
            if (!inv) return;
            const amount = roundAmount(parseFloat(document.getElementById('pPayAmount').value));
            const note = document.getElementById('pPayNote').value.trim();
            if (!amount || amount <= 0) { toast(tr('fillRequired')); return; }
            const pending = (inv.netPayable || 0) - (inv.paidProfit || 0);
            if (amount > pending) { toast('পর্যাপ্ত পেন্ডিং প্রফিট নেই'); return; }
            inv.paidProfit = (inv.paidProfit || 0) + amount;
            inv.pendingProfit = Math.max(0, pending - amount);
            b.transactions.push({
                ref: newRef(),
                type: 'profit_payment',
                investorId: inv.id,
                amount: amount,
                date: todayStr(),
                note: note || `প্রফিট পরিশোধ ${inv.name}`,
                locked: false,
                reversed: false
            });
            logAudit(b, 'profit_paid', `প্রফিট পরিশোধ: ${inv.name} — ${money(amount)}`, { investor: inv.name, amount,
                note });
            addNotification(`💰 প্রফিট পরিশোধ: ${inv.name} — ${money(amount)}`);
            saveState();
            closeModal();
            toast(tr('saved'));
            renderInvestors();
        }

        // ============================================================
        // TRANSACTIONS
        // ============================================================
        function renderTransactions() {
            const c = document.getElementById('content');
            const b = currentBiz();
            if (!b) { c.innerHTML = `<div class="card"><div class="empty">${tr('noBiz')}</div></div>`; return; }
            const types = ['all', 'deposit', 'withdraw', 'profit_distribution', 'loss_distribution', 'commission',
                'loss_recovery', 'profit_payment', 'reversal', 'adjustment'
            ];
            const filtered = b.transactions.filter(t => txFilter === 'all' || t.type === txFilter);
            c.innerHTML = `
            <div class="filter-chips">${types.map(ty => `<div class="chip ${txFilter===ty?'active':''}" onclick="txFilter='${ty}'; renderTransactions()">${ty==='all'?tr('allTypes'):ty}</div>`).join('')}</div>
            <div class="card"><div class="table-wrap"><table>
              <thead><tr><th>${tr('reference')}</th><th>${tr('txType')}</th><th>${tr('investor')}</th><th>${tr('txDate')}</th><th>${tr('txAmount')}</th><th>${tr('note')}</th><th>${tr('status')}</th><th>${tr('action')}</th></tr></thead>
              <tbody>
              ${filtered.length ? filtered.slice().reverse().map(t => {
                const inv = b.investors.find(i => i.id === t.investorId);
                const colorMap = {deposit:'badge-green',withdraw:'badge-red',profit_distribution:'badge-green',loss_distribution:'badge-red',commission:'badge-orange',loss_recovery:'badge-orange',profit_payment:'badge-green',reversal:'badge-grey',adjustment:'badge-grey'};
                const isLocked = t.locked || false;
                const isReversed = t.reversed || false;
                return `<tr><td class="mono">${t.ref}</td><td><span class="badge ${colorMap[t.type]||'badge-grey'}">${t.type}</span></td><td>${inv?inv.name:'—'}</td><td>${t.date}</td><td class="mono" style="color:${t.amount<0?'var(--red)':'var(--green)'}">${money(t.amount)}</td><td>${t.note||''}</td><td>${isLocked?'🔒':''} ${isReversed?'↩️':'✅'}</td>
                <td>${!isLocked && !isReversed && t.type !== 'reversal' ? `<button class="btn btn-ghost btn-sm" onclick="reverseTransaction('${t.ref}','${b.id}')">↩️ ${tr('reverse')}</button>` : ''}${t.type === 'profit_payment' ? `<button class="btn btn-ghost btn-sm" onclick="reverseTransaction('${t.ref}','${b.id}')">↩️ ${tr('reverse')}</button>` : ''}</td>
                </tr>`;
              }).join('') : `<tr><td colspan="8"><div class="empty">${tr('noTx')}</div></td></tr>`}
              </tbody>
            </table></div></div>`;
        }

        function reverseTransaction(ref, businessId) {
            const b = STATE.businesses.find(x => x.id === businessId);
            if (!b) return;
            const tx = b.transactions.find(t => t.ref === ref);
            if (!tx) { toast('ট্রানজেকশন পাওয়া যায়নি'); return; }
            if (tx.reversed) { toast('ট্রানজেকশন ইতিমধ্যে রিভার্স করা হয়েছে'); return; }
            if (tx.locked) { toast('লকড ট্রানজেকশন রিভার্স করা যাবে না'); return; }
            if (!confirm(`"${ref}" রিভার্স করতে চান?`)) return;
            const reverseRef = newRef();
            const reverseTx = {
                ref: reverseRef,
                type: 'reversal',
                investorId: tx.investorId,
                amount: -tx.amount,
                date: todayStr(),
                note: `রিভার্স ${ref}: ${tx.note||''}`,
                locked: false,
                reversed: false,
                originalRef: ref
            };
            b.transactions.push(reverseTx);
            tx.reversed = true;
            if (tx.investorId) {
                const inv = b.investors.find(i => i.id === tx.investorId);
                if (inv) {
                    if (tx.type === 'deposit') { const dep = inv.deposits.find(d => d.ref === ref); if (dep) dep
                            .reversed = true; } else if (tx.type === 'withdraw') { const wd = inv.withdraws.find(w =>
                            w.ref === ref); if (wd) wd.reversed = true; } else if (tx.type === 'profit_payment') {
                        inv.paidProfit = Math.max(0, (inv.paidProfit || 0) - tx.amount);
                        inv.pendingProfit = Math.max(0, (inv.pendingProfit || 0) + tx.amount);
                    }
                }
            }
            logAudit(b, 'transaction_reversed', `ট্রানজেকশন রিভার্স: ${ref} → ${reverseRef}`, { originalRef: ref,
                reverseRef, amount: tx.amount });
            addNotification(`↩️ ${tr('reverse')}: ${ref}`);
            saveState();
            toast('ট্রানজেকশন রিভার্স করা হয়েছে');
            renderTransactions();
        }

        // ============================================================
        // INVESTMENT (Deposit/Withdraw)
        // ============================================================
        function renderInvestment() {
            const c = document.getElementById('content');
            const b = currentBiz();
            if (!b) { c.innerHTML = `<div class="card"><div class="empty">${tr('noBiz')}</div></div>`; return; }
            const invOptions = b.investors.map(i =>
                `<option value="${i.id}">${i.name} (${i.id})${!i.active?' [Inactive]':''}</option>`).join('');
            c.innerHTML = `
            <div class="tabs"><div class="tab ${investmentTab==='deposit'?'active':''}" onclick="investmentTab='deposit'; renderInvestment()">${tr('deposit')}</div><div class="tab ${investmentTab==='withdraw'?'active':''}" onclick="investmentTab='withdraw'; renderInvestment()">${tr('withdraw')}</div></div>

              <label>${tr('investor')}</label><select id="fInvestor">${invOptions}</select>
              <div style="height:10px"></div>
              <div class="formrow"><div><label>${tr('amount')}</label><input id="fAmount" type="number" min="0" step="1"/></div><div><label>${tr('effectiveDate')}</label><input id="fDate" type="date" value="${todayStr()}"/></div></div>
              <label>${tr('note')}</label><input id="fNote" placeholder="${tr('note')}"/>
              <div id="availHint" style="margin-top:8px;font-size:12px;color:var(--text-3)"></div>
              <div class="modal-actions" style="justify-content:flex-start;margin-top:16px"><button class="btn ${investmentTab==='deposit'?'btn-green':'btn-red'}" onclick="submitInvestment()">${investmentTab==='deposit'?tr('submitDeposit'):tr('submitWithdraw')}</button></div>
            </div>
            <div style="height:20px"></div>

                return `<tr><td class="mono">${t.ref}</td><td>${inv?inv.name:'—'}</td><td><span class="badge ${t.type==='deposit'?'badge-green':'badge-red'}">${t.type==='deposit'?tr('deposit'):tr('withdraw')}</span></td><td>${t.date}</td><td class="mono">${money(t.amount)}</td><td>${t.note||''}</td><td>${isLocked?'🔒':''} ${t.reversed?'↩️':''}</td>
                <td>${!isLocked && !t.reversed ? `<button class="btn btn-ghost btn-sm" onclick="openEditEntryModal('${t.ref}')">✏️ ${tr('edit')}</button>` : ''}${!isLocked && !t.reversed && t.type !== 'reversal' ? `<button class="btn btn-ghost btn-sm" onclick="reverseTransaction('${t.ref}','${b.id}')">↩️ ${tr('reverse')}</button>` : ''}</td>

        function updateAvailHint() {
            const b = currentBiz();
            const invId = document.getElementById('fInvestor')?.value;
            if (!invId) return;
            const inv = b.investors.find(i => i.id === invId);
            if (!inv) return;
            const avail = investorAvailableBalance(b, inv);
            const el = document.getElementById('availHint');
            if (el) el.textContent = (STATE.lang === 'bn' ? 'বর্তমান অ্যাভেইলেবল ব্যালেন্স: ' :
                'Current available balance: ') + money(avail);
        }

        function isTransactionLocked(biz, ref) {
            const tx = biz.transactions.find(t => t.ref === ref);
            if (!tx) return false;
            if (tx.locked) return true;
            for (const order of biz.orders) {
                if (order.status === 'closed' && order.snapshot) {
                    const used = order.snapshot.investors.some(a => {
                        const inv = biz.investors.find(i => i.id === a.investorId);
                        if (!inv) return false;
                        const depUsed = inv.deposits.some(d => d.ref === ref && d.date <= order.createDate);
                        const wdUsed = inv.withdraws.some(w => w.ref === ref && w.date <= order.createDate);
                        return depUsed || wdUsed;
                    });
                    if (used) return true;
                }
            }
            return false;
        }

        function submitInvestment() {
            const b = currentBiz();
            if (!b) return;
            const invId = document.getElementById('fInvestor').value;
            const inv = b.investors.find(i => i.id === invId);
            if (!inv) return;
            const amount = roundAmount(parseFloat(document.getElementById('fAmount').value));
            const date = document.getElementById('fDate').value || todayStr();
            const note = document.getElementById('fNote').value.trim();
            if (!amount || amount <= 0) { toast(tr('fillRequired')); return; }
            const ref = newRef();
            const isDeposit = investmentTab === 'deposit';
            if (isDeposit) {
                inv.deposits.push({ id: uid('DEP'), amount, date, ref, note, locked: false, reversed: false });
                b.transactions.push({ ref, type: 'deposit', investorId: inv.id, amount, date, note, locked: false,
                    reversed: false });
                logAudit(b, 'deposit', `${money(amount)} ডিপোজিট ${inv.name} (${ref})`, { investor: inv.name, amount,
                    ref });
                addNotification(`💰 ডিপোজিট: ${inv.name} — ${money(amount)}`);
            } else {
                const check = canWithdraw(b, invId, amount, date);
                if (!check.ok) { toast(check.msg, 'error'); return; }
                inv.withdraws.push({ id: uid('WD'), amount, date, ref, note, locked: false, reversed: false });
                b.transactions.push({ ref, type: 'withdraw', investorId: inv.id, amount, date, note, locked: false,
                    reversed: false });
                logAudit(b, 'withdraw', `${money(amount)} উইথড্র ${inv.name} (${ref})`, { investor: inv.name, amount,
                    ref });
                addNotification(`📤 উইথড্র: ${inv.name} — ${money(amount)}`);
            }
            saveState();
            toast(tr('saved'));
            renderInvestment();
        }

        function canWithdraw(biz, investorId, amount, date) {
            const inv = biz.investors.find(i => i.id === investorId);
            if (!inv) return { ok: false, msg: 'ইনভেস্টর পাওয়া যায়নি' };
            const avail = investorAvailableBalance(biz, inv, date);
            if (amount > avail) return { ok: false, msg: `পর্যাপ্ত ব্যালেন্স নেই। অ্যাভেইলেবল: ${money(avail)}` };
            return { ok: true };
        }

            const tx = b.transactions.find(t => t.ref === ref);

        function saveEntryEdit(ref) {
            const b = currentBiz();
            if (!b) return;
            if (isTransactionLocked(b, ref)) { toast('এই ট্রানজেকশন লকড, এডিট করা যাবে না।', 'error'); return; }
            const tx = b.transactions.find(t => t.ref === ref);
            if (!tx) return;
            const inv = b.investors.find(i => i.id === tx.investorId);
            if (!inv) return;
            const list = tx.type === 'deposit' ? inv.deposits : inv.withdraws;
            const entry = list.find(e => e.ref === ref);
            if (!entry) return;
            const oldAmount = entry.amount;
            const oldDate = entry.date;
            const oldNote = entry.note || '';
            const amount = roundAmount(parseFloat(document.getElementById('eEntryAmount').value));
            const date = document.getElementById('eEntryDate').value || todayStr();
            const note = document.getElementById('eEntryNote').value.trim();
            if (!amount || amount <= 0) { toast(tr('fillRequired')); return; }
            if (tx.type === 'withdraw') { const check = canWithdraw(b, inv.id, amount, date); if (!check.ok) { toast(
                        check.msg, 'error'); return; } }
            entry.amount = amount;
            entry.date = date;
            entry.note = note;
            tx.amount = amount;
            tx.date = date;
            tx.note = note;
            logAudit(b, tx.type + '_edit',
                `${tx.type==='deposit'?'ডিপোজিট':'উইথড্র'} এডিট (${ref}) ${inv.name}: ${money(oldAmount)} → ${money(amount)}`, {

                    newAmount: amount,
                    oldDate,
                    newDate: date,
                    oldNote,
                    newNote: note

            toast(tr('updated'));

        async function sendTestTelegram() {
            const tg = STATE.settings.telegram;
            if (!tg.enabled || !tg.botToken || !tg.chatId) { toast('টেলিগ্রাম সেটিংস সঠিকভাবে কনফিগার করুন', 'error'); return; }
            try {
                const url = `https://api.telegram.org/bot${tg.botToken}/sendMessage`;
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: tg.chatId,
                        text: `📢 টেস্ট নোটিফিকেশন!\n\nসিস্টেম: ${STATE.businesses.length}টি বিজনেস\nসময়: ${new Date().toLocaleString()}`,
                        parse_mode: 'HTML' }) });
                const result = await response.json();
                if (result.ok) { toast('টেলিগ্রাম টেস্ট সফল! ✅');
                    addNotification('📨 টেলিগ্রাম টেস্ট সফল'); } else { toast('টেলিগ্রাম টেস্ট ব্যর্থ: ' + (result
                        .description || 'Unknown error'), 'error'); }
            } catch (e) { toast('টেলিগ্রাম টেস্ট ব্যর্থ: ' + e.message, 'error'); }
        }

        async function sendTestEmail() {

            const details = { intro: `এটি একটি টেস্ট ইমেইল।`, fields: { [tr('system')]: { value: 'Invest Ledger Pro' },
                    [tr('date')]: { value: todayStr() }, [tr('status')]: { value: '✅ সফল', color: 'green' } },

            const htmlContent = buildEmailHTML('Test User', 'Invest Ledger Pro', subject, details);
            await sendEmail(testEmail, subject, htmlContent, null);
            toast('ইমেইল পাঠানো হয়েছে! ✉️');

        function buildEmailHTML(to, from, subject, details) {
            let rows = '';
