        function printMainInvestorReportFiltered(bizId) {
            const b = STATE.businesses.find(x => x.id === bizId);
            if (!b) return;
            const mainInv = b.investors.find(i => i.isMain);
            if (!mainInv) return;
            let orders = b.orders.filter(o => o.snapshot?.investors?.some(a => a.investorId === mainInv.id) && o.status ===
                'closed');
            const dateFrom = document.getElementById('mainReportDateFrom')?.value || '';
            const dateTo = document.getElementById('mainReportDateTo')?.value || '';

        // ============================================================

        function renderCommissionLedger() {

                    const totalEarned = b.orders.reduce((s, o) => { if (o.status === 'closed' && o.result && o

                        0);
                    const withdrawn = mainInv.commissionWithdrawn || 0;
                    allCommissionData.push({
                        businessName: b.name,
                        businessId: b.id,
                        totalEarned: totalEarned,
                        withdrawn: withdrawn,
                        pending: Math.max(0, totalEarned - withdrawn),
                        history: b.commissionLedger?.history || [],

                    });
                }
            });
            let html =

                totalWithdrawn = 0,
                totalPending = 0;

                totalWithdrawn += d.withdrawn;
                totalPending += d.pending; });
            html +=
                `<div class="grid grid-4" style="margin-bottom:16px;">${statCard('🎖️','orange','totalCommissionEarned',money(totalEarned))}${statCard('💳','green','totalWithdrawn',money(totalWithdrawn))}${statCard('⏳','orange','pendingCommission',money(totalPending))}</div>`;
            html +=
                `<div class="card"><div class="section-title"><span class="bar"></span>${tr('perBusiness')}</div><div class="table-wrap"><table><thead><tr><th>${tr('business')}</th><th>${tr('totalCommissionEarned')}</th><th>${tr('totalWithdrawn')}</th><th>${tr('pendingCommission')}</th><th>${tr('action')}</th></tr></thead><tbody>${allCommissionData.length ? allCommissionData.map(d => `<tr><td style="font-weight:700;cursor:pointer" onclick="selectBusiness('${d.businessId}'); goTo('bizdash')">${d.businessName}</td><td class="mono" style="color:var(--orange)">${money(d.totalEarned)}</td><td class="mono" style="color:var(--green)">${money(d.withdrawn)}</td><td class="mono" style="color:var(--orange)">${money(d.pending)}</td><td><button class="btn btn-ghost btn-sm" onclick="withdrawCommission('${d.businessId}')">💰 ${tr('withdraw')}</button></td></tr>`).join('') : `<tr><td colspan="5"><div class="empty">${tr('noBiz')}</div></td></tr>`}</tbody></table></div>`;

                    html +=
                        `<div class="card" style="margin-top:14px;"><div class="section-title"><span class="bar" style="background:var(--orange)"></span>${d.businessName} — ${tr('commissionRateHistory')}</div><div class="table-wrap"><table style="font-size:11px;"><thead><tr><th>${tr('effectiveDate')}</th><th>${tr('rate')}</th><th>${tr('status')}</th></tr></thead><tbody>${d.rateHistory.map((r,idx)=>{const isCurrent = idx === d.rateHistory.length-1; return `<tr><td>${r.effectiveDate}</td><td>${r.rate}%</td><td><span class="badge ${isCurrent?'badge-green':'badge-grey'}">${isCurrent?tr('current'):tr('expired')}</span></td></tr>`;}).join('')}</tbody></table></div><div style="margin-top:8px;"><button class="btn btn-ghost btn-sm" onclick="addCommissionRate('${d.businessId}')">➕ ${tr('addCommissionRate')}</button></div></div>`;
                }
                if (d.history && d.history.length) {
                    html +=

        function addCommissionRate(bizId) {
            const b = STATE.businesses.find(x => x.id === bizId);
            if (!b) return;
            document.getElementById('modalRoot').innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
                    <div class="modal">
                        <div class="modal-title">➕ ${tr('addCommissionRate')}</div>
                        <label>${tr('rate')} (%)</label><input id="newCommissionRate" type="number" min="0" max="100" step="0.5" value="60"/>
                        <div style="height:10px;"></div>
                        <label>${tr('effectiveDate')} <span style="color:var(--red)">*</span></label>
                        <input id="newCommissionRateDate" type="date" value="${todayStr()}"/>
                        <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('cancel')}</button><button class="btn btn-green" onclick="confirmAddCommissionRate('${bizId}')">${tr('save')}</button></div>
                    </div>
                </div>`;
        }

        function confirmAddCommissionRate(bizId) {
            const b = STATE.businesses.find(x => x.id === bizId);
            if (!b) return;
            const mainInv = b.investors.find(i => i.isMain);
            if (!mainInv) return;
            const rate = parseFloat(document.getElementById('newCommissionRate').value);
            const date = document.getElementById('newCommissionRateDate').value;
            if (!rate || rate < 0) { toast(tr('fillRequired')); return; }
            if (!date) { toast(tr('fillRequired')); return; }
            if (mainInv.commissionRateHistory.some(r => r.effectiveDate === date)) { toast('এই তারিখে ইতিমধ্যে একটি Rate রয়েছে');
                return; }
            mainInv.commissionRateHistory.push({ rate: rate, effectiveDate: date });
            logAudit(b, 'commission_rate_added', `কমিশন রেট যোগ: ${rate}% (${date})`, { rate, date });
            addNotification(`🎖️ কমিশন রেট: ${rate}% (${date})`, 'info', null, b.id);
            saveState();
            closeModal();
            toast(tr('saved'));
            renderCommissionLedger();
        }

        function withdrawCommission(bizId) {
            const b = STATE.businesses.find(x => x.id === bizId);
            if (!b) return;
            const mainInv = b.investors.find(i => i.isMain);
            if (!mainInv) return;
            const pending = (b.commissionLedger?.pending || 0);
            if (pending <= 0) { toast('কোনো পেন্ডিং কমিশন নেই'); return; }
            document.getElementById('modalRoot').innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
                    <div class="modal">
                        <div class="modal-title">💰 ${tr('withdrawCommission')} — ${b.name}</div>
                        <div style="margin-bottom:12px;"><div><strong>${tr('pendingCommission')}:</strong> ${money(pending)}</div></div>
                        <label>${tr('amount')}</label><input id="cWithdrawAmount" type="number" min="0" max="${pending}" step="1" value="${pending}"/>
                        <div style="height:10px;"></div><label>${tr('note')}</label><input id="cWithdrawNote" placeholder="${tr('note')}"/>
                        <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('cancel')}</button><button class="btn btn-orange" onclick="confirmWithdrawCommission('${bizId}')">💰 ${tr('withdraw')}</button></div>
                    </div>
                </div>`;
        }

        function confirmWithdrawCommission(bizId) {
            const b = STATE.businesses.find(x => x.id === bizId);
            if (!b) return;
            const amount = roundAmount(parseFloat(document.getElementById('cWithdrawAmount').value));
            const note = document.getElementById('cWithdrawNote').value.trim();
            if (!amount || amount <= 0) { toast(tr('fillRequired')); return; }
            const pending = (b.commissionLedger?.pending || 0);
            if (amount > pending) { toast('পর্যাপ্ত পেন্ডিং কমিশন নেই'); return; }
            b.commissionLedger.totalWithdrawn = (b.commissionLedger.totalWithdrawn || 0) + amount;
            b.commissionLedger.pending = (b.commissionLedger.pending || 0) - amount;
            b.commissionLedger.history.push({ date: todayStr(), type: 'withdrawn', amount: amount, note: note ||
                    'কমিশন উত্তোলন' });
            const mainInv = b.investors.find(i => i.isMain);
            if (mainInv) {
                mainInv.commissionWithdrawn = (mainInv.commissionWithdrawn || 0) + amount;
                mainInv.commissionPending = Math.max(0, (mainInv.commissionPending || 0) - amount);
                mainInv.commissionHistory = mainInv.commissionHistory || [];
                mainInv.commissionHistory.push({ date: todayStr(), type: 'withdrawn', amount: amount, note: note ||
                        'কমিশন উত্তোলন' });
            }
            logAudit(b, 'commission_withdrawn', `কমিশন উত্তোলন: ${money(amount)}`, { amount, note });
            addNotification(`💰 কমিশন উত্তোলন: ${money(amount)}`, 'info', null, b.id);
            saveState();
            closeModal();
            toast(tr('saved'));
            renderCommissionLedger();
        }

            });

            if (!allCosts.length) {
                html += `<div class="card"><div class="empty">${tr('noBiz')}</div></div>`;
            }

            c.innerHTML = html;

        function updateOrderPreview() {
            const startDate = document.getElementById('orderStartDate').value || todayStr();
            const utilizedAmount = roundAmount(parseFloat(document.getElementById('utilizedAmount').value) || 0);

            if (!b) return;
            const result = calculateOrderAllocation(b, startDate, utilizedAmount);

                    `<div class="empty">${result.error}</div>`; return; }

        function renderOrderPreviewHTML(result, b) {
            if (!result.investors.length) return `<div class="empty">${tr('noActiveInvestorsForOrder')}</div>`;

                `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;font-size:12px;"><div><strong>${tr('totalAvailable')}:</strong> <span class="mono" style="color:var(--green)">${money(result.totalAvailable)}</span></div><div><strong>${tr('totalUtilized')}:</strong> <span class="mono" style="color:var(--orange)">${money(result.totalUtilized)}</span></div><div><strong>${tr('unutilizedAmount')}:</strong> <span class="mono" style="color:var(--text-3)">${money(result.unutilized)}</span></div></div>
                <div class="table-wrap"><table class="order-preview-table"><thead><tr><th>${tr('investor')}</th><th>${tr('available')}</th><th>${tr('utilized')} (%)</th><th>${tr('sharingRate')}</th><th>${tr('unutilizedAmount')}</th><th>${tr('previousLoss')}</th><th>${tr('pendingLoss')}</th></tr></thead><tbody>`;
            result.allocations.forEach(a => {
                const pct = result.totalAvailable > 0 ? ((a.allocated / result.totalAvailable) * 100) : 0;
                const unutilizedDisplay = a.isMain ? '—' : money(a.unutilized);
                html +=
                    `<tr><td>${a.name}${a.isMain ? ` <span class="badge badge-orange">${tr('mainCapital')}</span>` : ''}</td><td class="mono">${money(a.available)}</td><td class="mono" style="color:var(--orange)">${money(a.allocated)} (${pct.toFixed(1)}%)</td><td class="mono">${a.isMain ? '—' : a.sharingRate + '%'}</td><td class="mono" style="color:var(--text-3)">${unutilizedDisplay}</td><td class="mono" style="color:var(--red)">${money(a.previousLoss||0)}</td><td class="mono" style="color:var(--orange)">${money(a.pendingLoss||0)}</td></tr>`;
            });
            const nonMainUnutilized = result.allocations.filter(a => !a.isMain && a.unutilized > 0);
            if (nonMainUnutilized.length > 0 && result.unutilized > 0) {
                html +=
                    `<tr class="total-row"><td style="font-weight:700;color:var(--text-3)">${tr('unutilizedDistribution')}</td><td colspan="6" style="font-size:11px;color:var(--text-3);">${nonMainUnutilized.map(a => `${a.name}: ${money(a.unutilized)}`).join(' | ')}</td></tr>`;
            }
            html += `</tbody></table></div>`;
            return html;
        }

        function confirmCreateOrder() {
            const b = currentBiz();
            if (!b) return;
            const startDate = document.getElementById('orderStartDate').value || todayStr();
            const endDate = document.getElementById('orderEndDate').value || '';
            const utilizedAmount = roundAmount(parseFloat(document.getElementById('utilizedAmount').value) || 0);
            if (!startDate) { toast(tr('fillRequired')); return; }
            const result = calculateOrderAllocation(b, startDate, utilizedAmount);
            if (result.error || !result.investors.length) { toast(result.error || tr('noActiveInvestorsForOrder')); return; }
            for (const alloc of result.allocations) {
                const inv = b.investors.find(i => i.id === alloc.investorId);
                if (!inv) continue;
                const currentAvail = investorAvailableBalance(b, inv, startDate);
                if (Math.abs(currentAvail - alloc.available) > 1) {
                    toast(`⚠️ ${inv.name} এর ব্যালেন্স পরিবর্তিত হয়েছে! দয়া করে পুনরায় চেক করুন।`);
                    updateOrderPreview();
                    return;
                }
                if (alloc.allocated < 0) {
                    toast(`⚠️ ${inv.name} এর জন্য নেগেটিভ বরাদ্দ তৈরি হয়েছে!`);
                    return;
                }
            }
            b.orderSeq = (b.orderSeq || 0) + 1;
            const orderNumber = 'ORD-' + String(b.orderSeq).padStart(4, '0');
            const snapshotInvestors = result.allocations.map(a => ({
                investorId: a.investorId,
                name: a.name,
                isMain: a.isMain,
                utilized: a.allocated,
                sharingRate: a.sharingRate,
                sharingRateAtDate: a.sharingRateAtDate,
                previousLoss: a.previousLoss || 0,
                recoveredLoss: a.recoveredLoss || 0,
                pendingLoss: a.pendingLoss || 0,
                availableBefore: a.available,
                unutilized: a.isMain ? 0 : a.unutilized,
                snapshotDate: startDate,
                snapshotBalance: a.available,
                snapshotRate: a.sharingRate,
                totalDeposit: a.totalDeposit || 0,
                totalWithdraw: a.totalWithdraw || 0,
                capitalBalance: a.capitalBalance || 0,
                profitBalance: a.profitBalance || 0
            }));
            const order = {
                id: uid('ORD'),
                orderNumber,
                status: 'running',
                createDate: startDate,
                closeDate: endDate || null,
                snapshot: {
                    investors: snapshotInvestors,
                    totalAvailable: result.totalAvailable,
                    totalUtilized: result.totalUtilized,
                    unutilized: result.unutilized,
                    snapshotDate: startDate,
                    isLocked: true
                },
                result: null,
                costLedger: { cost: 0, grossProfit: 0, netProfit: 0 },
                timeline: [{ date: startDate, event: 'created', detail: `অর্ডার তৈরি: ${orderNumber}` }]
            };
            b.orders.push(order);
            for (const alloc of result.allocations) {
                const inv = b.investors.find(i => i.id === alloc.investorId);
                if (inv) {
                    let remaining = alloc.allocated;
                    for (const dep of inv.deposits) {
                        if (remaining <= 0) break;
                        if (!dep.locked && !dep.reversed && dep.date <= startDate) {
                            dep.locked = true;
                            remaining -= dep.amount;
                            const tx = b.transactions.find(t => t.ref === dep.ref);
                            if (tx) tx.locked = true;
                        }
                    }
                }
            }
            logAudit(b, 'order_created', `অর্ডার তৈরি: ${orderNumber} (Utilized: ${money(result.totalUtilized)})`, {
                orderNumber,
                utilized: result.totalUtilized
            });
            addNotification(`📦 অর্ডার তৈরি: ${orderNumber} (${money(result.totalUtilized)})`, 'order_created', 'order/' +
                order.id, b.id);
            saveState();
            closeModal();
            toast(tr('saved'));
            renderOrders();
        }

        // ============================================================
        // ORDERS PAGE (unchanged)
        // ============================================================
        function renderOrders() {
            const c = document.getElementById('content');

            const runningOrders = b.orders.filter(o => o.status === 'running');

            let html = `
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
                    <div style="display:flex; gap:12px; flex-wrap:wrap;">
                        <span class="badge badge-orange">🟢 ${tr('running')}: ${runningOrders.length}</span>
                        <span class="badge badge-green">🔒 ${tr('closed')}: ${closedOrders.length}</span>
                        <span class="badge badge-grey">🚫 ${tr('cancelled')}: ${cancelledOrders.length}</span>
                    </div>
                    <button class="btn btn-green" onclick="openCreateOrderModal()">＋ ${tr('createOrder')}</button>
                </div>
            `;

            if (b.orders.length === 0) {
                html += `<div class="empty-note">${tr('noOrders')}</div>`;
                c.innerHTML = html;
                return;
            }

            const sorted = [...b.orders].sort((a, b2) => a.orderNumber - b2.orderNumber);
            sorted.forEach(order => {
                const isExpanded = _expandedOrderId === order.id;
                const totalUtilized = order.snapshot?.totalUtilized || 0;
                let stampClass = 'stamp-open';
                if (order.status === 'closed') {
                    stampClass = (order.result && order.result.type === 'profit') ? 'stamp-profit' : 'stamp-loss';
                } else if (order.status === 'cancelled') {
                    stampClass = 'stamp-open';
                }
                const resultLabel = order.result ? (order.result.type === 'profit' ? tr('profit') : tr('loss')) :
                '—';
                const resultAmount = order.result ? money(order.result.amount) : '—';

                let netDisplay = '';
                if (order.status === 'closed' && order.costLedger) {
                    const gross = order.costLedger.grossProfit || 0;
                    const cost = order.costLedger.cost || 0;
                    const net = gross - cost;
                    netDisplay =
                        ` | ${tr('netProfit')}: <b style="color:${net>=0?'var(--green)':'var(--red)'}">${money(net)}</b>`;
                }

                html += `
                            <div class="order-card">
                                <div class="order-top">
                                    <div class="order-stamp ${stampClass}">#${order.orderNumber}</div>
                                    <div class="order-meta">
                                        <div class="dates">${order.createDate} → ${order.closeDate || 'চলমান'}</div>
                                        <div class="amounts">${tr('utilizedInvestment')}: <b>${money(totalUtilized)}</b> &nbsp;|&nbsp; ${tr('resultType')}: <b>${resultLabel}</b> ${resultAmount !== '—' ? `(${resultAmount})` : ''}${netDisplay}</div>
                                        <button class="toggle-link" onclick="toggleOrderExpand('${order.id}')">${isExpanded ? tr('collapseDetails') : tr('expandDetails')}</button>
                                    </div>
                                    <div class="order-actions">
                                        ${order.status === 'running' ? `<button class="btn btn-orange btn-sm" onclick="event.stopPropagation(); openCloseOrder('${order.id}')">${tr('closeOrder')}</button><button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); cancelOrder('${order.id}')">🚫 ${tr('cancelOrder')}</button>` : ''}
                                        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); viewSnapshot('${order.id}')">👁️ ${tr('viewSnapshot')}</button>
                                        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); printSingleOrder('${order.id}')">🖨️ ${tr('printOrder')}</button>
                                    </div>
                                </div>
                                <div class="split-bar">
                                    ${(order.snapshot?.investors||[]).map(a => {
                                        const pct = order.snapshot.totalUtilized > 0 ? (a.utilized / order.snapshot.totalUtilized * 100) : 0;
                                        const color = a.isMain ? 'var(--green)' : 'var(--orange)';
                                        return `<div class="split-seg" style="width:${pct}%; background:${color};" title="${a.name}"></div>`;

                                </div>
                            </div>
                        `;
            });

            c.innerHTML = html;
        }

            document.getElementById('modalRoot').innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this) closeModal()">

        function previewClose(orderId) {
            const b = currentBiz();
            const o = b.orders.find(x => x.id === orderId);
            if (!o) return;

            const gross = parseFloat(document.getElementById('cGrossProfit').value) || 0;
            const cost = parseFloat(document.getElementById('cOrderCost').value) || 0;
            const netProfitVal = gross - cost;
            document.getElementById('netProfitDisplay').textContent = money(netProfitVal);
            document.getElementById('netProfitDisplay').style.color = netProfitVal >= 0 ? 'var(--green)' : 'var(--red)';

            const type = document.getElementById('cResultType').value;
            const amountEl = document.getElementById('cResultAmount');
            if (!amountEl.value || parseFloat(amountEl.value) === 0) {
                if (type === 'profit' && netProfitVal > 0) amountEl.value = netProfitVal;
                else if (type === 'loss' && netProfitVal < 0) amountEl.value = Math.abs(netProfitVal);
            }
            const amount = roundAmount(parseFloat(amountEl.value));
            if (!amount || amount <= 0) { document.getElementById('previewBox').innerHTML =
                    `<div style="padding:16px;color:var(--text-3);">${tr('fillRequired')}</div>`; return; }

            const dist = computeDistribution(o, type, amount);
            const showFull = _showFullCalc;
            let html =
                `<div class="table-wrap" style="margin-top:12px"><div class="section-title" style="font-size:13px;margin-bottom:8px"><span class="bar"></span>${tr('distributionBreakdown')}</div><table><thead><tr><th>${tr('investor')}</th><th>${tr('utilizedAmount')}</th>${showFull ? `<th>${tr('totalShare')}</th>` : ''}${showFull ? `<th>${tr('recoveredLoss')}</th>` : ''}${showFull ? `<th>${tr('profitShare')}</th>` : ''}<th>${tr('netPayable')}</th></tr></thead><tbody>`;
            dist.allocations.forEach(a => {
                const isMain = a.isMain || false;
                const totalShare = a.totalShare || 0;
                const netDisplay = isMain ? '—' : money(a.amount);
                const label = isMain ? tr('commission') : '';
                html +=
                    `<tr><td>${a.name}${isMain ? ` <span class="badge badge-orange">${tr('mainCapital')}</span>` : ''}</td><td class="mono">${money(a.utilized || 0)}</td>${showFull ? `<td class="mono">${money(totalShare)}</td>` : ''}${showFull ? `<td class="mono" style="color:var(--green)">${money(a.recovered || 0)}</td>` : ''}${showFull ? `<td class="mono" style="color:var(--green)">${money(a.profitShare || 0)}</td>` : ''}<td class="mono" style="font-weight:700;color:${type==='profit'?'var(--green)':'var(--red)'}">${netDisplay} ${label}</td></tr>`;
            });
            if (type === 'profit' && dist.commission > 0) {}
            html +=
                `<tr style="border-top:2px solid var(--glass-brd);font-weight:700"><td>${tr('grandTotal')}</td><td></td>${showFull ? `<td></td><td></td><td></td>` : ''}<td class="mono">${money(dist.amount)}</td></tr>`;
            if (type === 'profit') { html +=
                    `<tr><td colspan="${showFull ? 6 : 3}" style="font-size:12px;color:var(--text-3)">${tr('netPayableProfit')}: ${money(dist.netPayable)}</td></tr>`; }
            html += `</tbody></table></div>`;
            document.getElementById('previewBox').innerHTML = html;
            document.getElementById('approveBtn').style.display = 'inline-flex';
            _pendingDist = { ...dist, grossProfit: gross, orderCost: cost, netProfit: netProfitVal };
        }

        function computeDistribution(o, type, amount) {
            const investors = o.snapshot.investors;
            const totalUtilized = o.snapshot.totalUtilized || 1;
            let allocations = [];
            if (type === 'profit') {
                const rawShares = investors.map(a => {
                    const share = (a.utilized / totalUtilized) * amount;
                    return { ...a, rawShare: share };
                });

                const actualProfits = rawShares.map(a => {
                    if (a.isMain) return { ...a, actualProfit: 0 };
                    const rate = a.sharingRate || 0;
                    const actual = a.rawShare * (rate / 100);
                    return { ...a, actualProfit: actual };
                });

                let totalRecovered = 0;
                const afterRecovery = actualProfits.map(a => {
                    if (a.isMain) return { ...a, recovered: 0, remainingProfit: 0 };
                    const pendingLoss = a.pendingLoss || 0;
                    const recovered = Math.min(pendingLoss, a.actualProfit);
                    totalRecovered += recovered;
                    return { ...a, recovered: recovered, remainingProfit: a.actualProfit - recovered };
                });

                const totalNetProfit = afterRecovery.filter(a => !a.isMain).reduce((s, a) => s + a.remainingProfit,
                0);
                const commission = roundAmount(amount - totalNetProfit - totalRecovered);
                const finalCommission = Math.max(0, commission);

                allocations = afterRecovery.map(a => {
                    const net = a.isMain ? 0 : a.remainingProfit;
                    const amt = a.isMain ? finalCommission : net;
                    return {
                        investorId: a.investorId,
                        name: a.name,
                        isMain: a.isMain,
                        utilized: a.utilized,
                        totalShare: a.rawShare,
                        recovered: a.recovered || 0,
                        profitShare: a.isMain ? 0 : a.actualProfit,
                        amount: roundAmount(amt),
                        netPayable: roundAmount(net)
                    };
                });

                let sumAlloc = allocations.reduce((s, a) => s + a.amount, 0);
                let diff = roundAmount(amount - sumAlloc);
                if (diff !== 0) {
                    const mainAlloc = allocations.find(a => a.isMain);
                    if (mainAlloc) {
                        mainAlloc.amount = roundAmount(mainAlloc.amount + diff);
                        if (mainAlloc.amount < 0) mainAlloc.amount = 0;
                    } else {
                        const largest = allocations.reduce((a, b) => a.amount > b.amount ? a : b);
                        largest.amount = roundAmount(largest.amount + diff);
                        if (largest.amount < 0) largest.amount = 0;
                    }
                }

                const mainAlloc = allocations.find(a => a.isMain);
                const finalCommissionVal = mainAlloc ? mainAlloc.amount : 0;

                return {
                    type: 'profit',
                    amount,
                    allocations,
                    commission: finalCommissionVal,
                    netPayable: roundAmount(amount - finalCommissionVal)
                };
            } else {
                investors.forEach(a => {
                    const share = (a.utilized / totalUtilized) * amount;
                    allocations.push({
                        investorId: a.investorId,
                        name: a.name,
                        isMain: a.isMain,
                        utilized: a.utilized,
                        totalShare: share,
                        recovered: 0,
                        profitShare: 0,
                        amount: roundAmount(share),
                        netPayable: 0
                    });
                });
                let sumAlloc = allocations.reduce((s, a) => s + a.amount, 0);
                let diff = roundAmount(amount - sumAlloc);
                if (diff !== 0 && allocations.length) {
                    const largest = allocations.reduce((a, b) => a.amount > b.amount ? a : b);
                    largest.amount = roundAmount(largest.amount + diff);
                    if (largest.amount < 0) largest.amount = 0;
                }
                return { type: 'loss', amount, allocations, commission: 0, netPayable: 0 };
            }
        }

        function confirmCloseOrder(orderId) {
            const b = currentBiz();
            const o = b.orders.find(x => x.id === orderId);
            if (!o || !_pendingDist) return;
            if (o.status === 'closed') { toast('অর্ডার ইতিমধ্যে ক্লোজ করা হয়েছে'); return; }
            const dist = _pendingDist;
            o.status = 'closed';
            o.closeDate = document.getElementById('cResultDate')?.value || todayStr();
            o.result = dist;
            o.costLedger = {
                grossProfit: dist.grossProfit || 0,
                cost: dist.orderCost || 0,
                netProfit: dist.netProfit || 0
            };
            o.timeline = o.timeline || [];
            o.timeline.push({ date: o.closeDate, event: 'closed', detail: `অর্ডার ক্লোজ: ${o.orderNumber} - ${dist.type} ${money(dist.amount)}` });

            if (!b.costLedger) b.costLedger = { totalCost: 0, orders: [] };
            b.costLedger.orders.push({
                orderNumber: o.orderNumber,
                date: o.closeDate,
                grossProfit: dist.grossProfit || 0,
                cost: dist.orderCost || 0,
                netProfit: dist.netProfit || 0
            });
            b.costLedger.totalCost = (b.costLedger.totalCost || 0) + (dist.orderCost || 0);

            // --- AUDIT: Process distribution only once ---
            if (dist.type === 'profit') {
                dist.allocations.forEach(a => {
                    const inv = b.investors.find(i => i.id === a.investorId);
                    if (!inv) return;
                    const profitAmt = a.amount;
                    const recovered = a.recovered || 0;
                    const netProfit = profitAmt - recovered;

                    if (recovered > 0) {
                        inv.recoveredLoss = (inv.recoveredLoss || 0) + recovered;
                        const tx = {
                            ref: newRef(),
                            type: 'loss_recovery',
                            investorId: inv.id,
                            amount: recovered,
                            date: o.closeDate,
                            note: `লস রিকভারি ${o.orderNumber}`,
                            locked: true,
                            reversed: false,
                            balanceBefore: inv.profitBalance || 0,
                            balanceAfter: (inv.profitBalance || 0) + recovered
                        };
                        b.transactions.push(tx);
                        inv.profitBalance = (inv.profitBalance || 0) + recovered;
                    }

                    if (netProfit > 0 && !inv.isMain) {
                        inv.totalProfit = (inv.totalProfit || 0) + netProfit;
                        inv.netPayable = (inv.netPayable || 0) + netProfit;
                        inv.pendingProfit = (inv.pendingProfit || 0) + netProfit;
                        const tx = {
                            ref: newRef(),
                            type: 'profit_distribution',
                            investorId: inv.id,
                            amount: netProfit,
                            date: o.closeDate,
                            note: `প্রফিট বণ্টন ${o.orderNumber}`,
                            locked: true,
                            reversed: false,
                            balanceBefore: inv.profitBalance || 0,
                            balanceAfter: (inv.profitBalance || 0) + netProfit
                        };
                        b.transactions.push(tx);
                        inv.profitBalance = (inv.profitBalance || 0) + netProfit;
                    }
                });

                // Commission for main investor (only once)
                if (dist.commission > 0) {
                    const mainInv = b.investors.find(i => i.isMain);
                    if (mainInv) {
                        // Add to main investor's totalProfit and commission ledger
                        mainInv.totalProfit = (mainInv.totalProfit || 0) + dist.commission;
                        mainInv.profitBalance = (mainInv.profitBalance || 0) + dist.commission;
                        b.commissionLedger.totalEarned = (b.commissionLedger.totalEarned || 0) + dist.commission;
                        b.commissionLedger.pending = (b.commissionLedger.pending || 0) + dist.commission;
                        b.commissionLedger.history.push({
                            date: o.closeDate,
                            type: 'earned',
                            amount: dist.commission,
                            note: `কমিশন ${o.orderNumber}`
                        });
                        mainInv.commissionEarned = (mainInv.commissionEarned || 0) + dist.commission;
                        mainInv.commissionPending = (mainInv.commissionPending || 0) + dist.commission;
                        mainInv.commissionHistory = mainInv.commissionHistory || [];
                        mainInv.commissionHistory.push({
                            date: o.closeDate,
                            type: 'earned',
                            amount: dist.commission,
                            note: `কমিশন ${o.orderNumber}`
                        });
                        const tx = {
                            ref: newRef(),
                            type: 'commission',
                            investorId: mainInv.id,
                            amount: dist.commission,
                            date: o.closeDate,
                            note: `কমিশন ${o.orderNumber}`,
                            locked: true,
                            reversed: false,
                            balanceBefore: mainInv.profitBalance - dist.commission,
                            balanceAfter: mainInv.profitBalance
                        };
                        b.transactions.push(tx);
                    }
                }
                logAudit(b, 'order_close', `অর্ডার ক্লোজ (প্রফিট): ${o.orderNumber} — ${money(dist.amount)}`, {
                    orderNumber: o.orderNumber,
                    amount: dist.amount,
                    type: 'profit'
                });
                // Trigger event-based communication
                triggerCommunication('order_closed_profit', `অর্ডার ক্লোজ (প্রফিট): ${o.orderNumber} — ${money(dist.amount)}`,
                    b.id);
                // Auto PDF email
                if (STATE.settings.email.enabled) {
                    b.investors.forEach(inv => {
                        if (inv.email) {
                            sendEmail(inv.email, `Order Statement - ${o.orderNumber}`,
                                `<h3>Order ${o.orderNumber} Closed</h3><p>Dear ${inv.name},</p><p>Order closed with ${dist.type}. Amount: ${money(dist.amount)}</p><p>PDF attached.</p>`,
                                b);
                        }
                    });
                }
            } else {
                dist.allocations.forEach(a => {
                    const inv = b.investors.find(i => i.id === a.investorId);
                    if (!inv) return;
                    inv.lossBalance = (inv.lossBalance || 0) + a.amount;
                    inv.totalLoss = (inv.totalLoss || 0) + a.amount;
                    const tx = {
                        ref: newRef(),
                        type: 'loss_distribution',
                        investorId: inv.id,
                        amount: a.amount,
                        date: o.closeDate,
                        note: `লস বণ্টন ${o.orderNumber}`,
                        locked: true,
                        reversed: false,
                        balanceBefore: inv.profitBalance || 0,
                        balanceAfter: inv.profitBalance || 0
                    };
                    b.transactions.push(tx);
                });
                logAudit(b, 'order_close', `অর্ডার ক্লোজ (লস): ${o.orderNumber} — ${money(dist.amount)}`, {
                    orderNumber: o.orderNumber,
                    amount: dist.amount,
                    type: 'loss'
                });
                triggerCommunication('order_closed_loss', `অর্ডার ক্লোজ (লস): ${o.orderNumber} — ${money(dist.amount)}`,
                    b.id);
            }
            addNotification(`🔒 অর্ডার ক্লোজ: ${o.orderNumber} (${dist.type}: ${money(dist.amount)})`, dist.type ===
                'profit' ? 'order_closed_profit' : 'order_closed_loss', 'order/' + o.id, b.id);
            _pendingDist = null;
            saveState();
            closeModal();
            toast(tr('saved'));
            renderOrders();
        }

        // ============================================================
        // CANCEL ORDER (unchanged)
        // ============================================================
        function cancelOrder(orderId) {
            const b = currentBiz();
            const o = b.orders.find(x => x.id === orderId);
            if (!o || o.status !== 'running') return;
            if (!confirm(`"${o.orderNumber}" ${tr('cancelOrder')} করতে চান?`)) return;
            o.status = 'cancelled';
            o.timeline = o.timeline || [];
            o.timeline.push({ date: todayStr(), event: 'cancelled', detail: `অর্ডার বাতিল: ${o.orderNumber}` });
            o.snapshot.investors.forEach(a => {
                const inv = b.investors.find(i => i.id === a.investorId);
                if (inv) {
                    let remaining = a.utilized;
                    for (const dep of inv.deposits) {
                        if (remaining <= 0) break;
                        if (dep.locked && !dep.reversed) {
                            dep.locked = false;
                            const tx = b.transactions.find(t => t.ref === dep.ref);
                            if (tx) tx.locked = false;
                            remaining -= dep.amount;
                        }
                    }
                }
            });
            logAudit(b, 'order_cancelled', `অর্ডার বাতিল: ${o.orderNumber}`, { orderNumber: o.orderNumber });
            addNotification(`🚫 অর্ডার বাতিল: ${o.orderNumber}`, 'order_cancelled', null, b.id);
            saveState();
            toast('অর্ডার বাতিল করা হয়েছে');
            renderOrders();
        }

        function createInvestor() {
            const b = currentBiz();
            if (!b) return;
            const name = document.getElementById('mInvName').value.trim();
            const mobile = document.getElementById('mInvMobile').value.trim();
            const email = document.getElementById('mInvEmail').value.trim();
            const rate = parseFloat(document.getElementById('mInvShare').value) || 40;

        function confirmPayProfit(investorId, businessId) {
            const b = STATE.businesses.find(x => x.id === businessId);
            if (!b) return;
            const inv = b.investors.find(i => i.id === investorId);
            if (!inv) return;
            const amount = roundAmount(parseFloat(document.getElementById('pPayAmount').value));
            const note = document.getElementById('pPayNote').value.trim();
            if (!amount || amount <= 0) { toast(tr('fillRequired')); return; }
            const pending = (inv.netPayable || 0) - (inv.paidProfit || 0);
            if (amount > pending) { toast('পর্যাপ্ত পেন্ডিং প্রফিট নেই'); return; }
            inv.paidProfit = (inv.paidProfit || 0) + amount;
            inv.pendingProfit = Math.max(0, pending - amount);
            inv.profitBalance = (inv.profitBalance || 0) - amount;
            const tx = {
                ref: newRef(),
                type: 'profit_payment',
                investorId: inv.id,
                amount: amount,
                date: todayStr(),
                note: note || `প্রফিট পরিশোধ ${inv.name}`,
                locked: false,
                reversed: false,
                balanceBefore: inv.profitBalance + amount,
                balanceAfter: inv.profitBalance
            };
            b.transactions.push(tx);
            logAudit(b, 'profit_paid', `প্রফিট পরিশোধ: ${inv.name} — ${money(amount)}`, { investor: inv.name, amount,
                note });
            addNotification(`💰 প্রফিট পরিশোধ: ${inv.name} — ${money(amount)}`, 'profit_payment', null, b.id, inv.id);
            triggerCommunication('profit_payment', `💰 প্রফিট পরিশোধ: ${inv.name} — ${money(amount)}`, b.id, inv.id);
            saveState();
            closeModal();
            toast(tr('saved'));
            renderInvestors();
        }

        function reverseTransaction(ref, businessId) {
            const b = STATE.businesses.find(x => x.id === businessId);
            if (!b) return;
            const tx = b.transactions.find(t => t.ref === ref);
            if (!tx) { toast('ট্রানজেকশন পাওয়া যায়নি'); return; }
            if (tx.reversed) { toast('ট্রানজেকশন ইতিমধ্যে রিভার্স করা হয়েছে'); return; }
            if (tx.locked) { toast('লকড ট্রানজেকশন রিভার্স করা যাবে না'); return; }
            if (!confirm(`"${ref}" রিভার্স করতে চান?`)) return;
            const reverseRef = newRef();
            const reverseTx = {
                ref: reverseRef,
                type: 'reversal',
                investorId: tx.investorId,
                amount: -tx.amount,
                date: todayStr(),
                note: `রিভার্স ${ref}: ${tx.note||''}`,
                locked: false,
                reversed: false,
                originalRef: ref,
                balanceBefore: tx.balanceAfter || 0,
                balanceAfter: tx.balanceBefore || 0
            };
            b.transactions.push(reverseTx);
            tx.reversed = true;
            if (tx.investorId) {
                const inv = b.investors.find(i => i.id === tx.investorId);
                if (inv) {
                    if (tx.type === 'deposit') {
                        const dep = inv.deposits.find(d => d.ref === ref);
                        if (dep) dep.reversed = true;
                        inv.capitalBalance = (inv.capitalBalance || 0) - tx.amount;
                    } else if (tx.type === 'withdraw') {
                        const wd = inv.withdraws.find(w => w.ref === ref);
                        if (wd) wd.reversed = true;
                        inv.capitalBalance = (inv.capitalBalance || 0) + tx.amount;
                    } else if (tx.type === 'profit_payment') {
                        inv.paidProfit = Math.max(0, (inv.paidProfit || 0) - tx.amount);
                        inv.pendingProfit = Math.max(0, (inv.pendingProfit || 0) + tx.amount);
                        inv.profitBalance = (inv.profitBalance || 0) + tx.amount;
                    } else if (tx.type === 'profit_distribution') {
                        inv.totalProfit = Math.max(0, (inv.totalProfit || 0) - tx.amount);
                        inv.netPayable = Math.max(0, (inv.netPayable || 0) - tx.amount);
                        inv.pendingProfit = Math.max(0, (inv.pendingProfit || 0) - tx.amount);
                        inv.profitBalance = (inv.profitBalance || 0) - tx.amount;
                    } else if (tx.type === 'loss_distribution') {
                        inv.lossBalance = Math.max(0, (inv.lossBalance || 0) - tx.amount);
                        inv.totalLoss = Math.max(0, (inv.totalLoss || 0) - tx.amount);
                    } else if (tx.type === 'loss_recovery') {
                        inv.recoveredLoss = Math.max(0, (inv.recoveredLoss || 0) - tx.amount);
                        inv.profitBalance = (inv.profitBalance || 0) - tx.amount;
                    } else if (tx.type === 'commission') {
                        const mainInv = b.investors.find(i => i.isMain);
                        if (mainInv) {
                            mainInv.commissionEarned = Math.max(0, (mainInv.commissionEarned || 0) - tx.amount);
                            mainInv.commissionPending = Math.max(0, (mainInv.commissionPending || 0) - tx.amount);
                            mainInv.profitBalance = (mainInv.profitBalance || 0) - tx.amount;
                            b.commissionLedger.totalEarned = Math.max(0, (b.commissionLedger.totalEarned || 0) - tx
                                .amount);
                            b.commissionLedger.pending = Math.max(0, (b.commissionLedger.pending || 0) - tx.amount);
                        }
                    }
                }
            }
            logAudit(b, 'transaction_reversed', `ট্রানজেকশন রিভার্স: ${ref} → ${reverseRef}`, { originalRef: ref,
                reverseRef, amount: tx.amount });
            addNotification(`↩️ ${tr('reverse')}: ${ref}`, 'warning', null, b.id);
            saveState();
            toast('ট্রানজেকশন রিভার্স করা হয়েছে');
            renderTransactions();
        }

                        <td>${!isLocked && !t.reversed ? `<button class="btn btn-ghost btn-sm" onclick="openEditEntryModal('${t.ref}')">✏️ ${tr('edit')}</button>` : ''}${!isLocked && !t.reversed && t.type !== 'reversal' ? `<button class="btn btn-ghost btn-sm" onclick="reverseTransaction('${t.ref}','${b.id}')">↩️ ${tr('reverse')}</button>` : ''}</td>

        function updateAvailHint() {
            const b = currentBiz();
            const invId = document.getElementById('fInvestor')?.value;
            if (!invId) return;
            const inv = b.investors.find(i => i.id === invId);
            if (!inv) return;
            const avail = investorAvailableBalance(b, inv);
            const el = document.getElementById('availHint');
            if (el) el.textContent = (STATE.lang === 'bn' ? 'বর্তমান অ্যাভেইলেবল ব্যালেন্স: ' :
                'Current available balance: ') + money(avail);
        }

        function isTransactionLocked(biz, ref) {
            const tx = biz.transactions.find(t => t.ref === ref);
            if (!tx) return false;
            if (tx.locked) return true;
            for (const order of biz.orders) {
                if (order.status === 'closed' && order.snapshot) {
                    const used = order.snapshot.investors.some(a => {
                        const inv = biz.investors.find(i => i.id === a.investorId);
                        if (!inv) return false;
                        const depUsed = inv.deposits.some(d => d.ref === ref && d.date <= order.createDate);
                        const wdUsed = inv.withdraws.some(w => w.ref === ref && w.date <= order.createDate);
                        return depUsed || wdUsed;
                    });
                    if (used) return true;
                }
            }
            return false;
        }

        function submitInvestment() {
            const b = currentBiz();
            if (!b) return;
            const invId = document.getElementById('fInvestor').value;
            const inv = b.investors.find(i => i.id === invId);
            if (!inv) return;
            const amount = roundAmount(parseFloat(document.getElementById('fAmount').value));
            const date = document.getElementById('fDate').value || todayStr();
            const note = document.getElementById('fNote').value.trim();
            if (!amount || amount <= 0) { toast(tr('fillRequired')); return; }
            const ref = newRef();
            const isDeposit = investmentTab === 'deposit';
            if (isDeposit) {
                inv.deposits.push({ id: uid('DEP'), amount, date, ref, note, locked: false, reversed: false });
                inv.capitalBalance = (inv.capitalBalance || 0) + amount;
                const tx = {
                    ref,
                    type: 'deposit',
                    investorId: inv.id,
                    amount,
                    date,
                    note,
                    locked: false,
                    reversed: false,
                    balanceBefore: inv.capitalBalance - amount,
                    balanceAfter: inv.capitalBalance
                };
                b.transactions.push(tx);
                logAudit(b, 'deposit', `${money(amount)} ডিপোজিট ${inv.name} (${ref})`, { investor: inv.name, amount,
                    ref });
                addNotification(`💰 ডিপোজিট: ${inv.name} — ${money(amount)}`, 'deposit', null, b.id, inv.id);
                triggerCommunication('deposit', `💰 ডিপোজিট: ${inv.name} — ${money(amount)}`, b.id, inv.id);
            } else {
                const check = canWithdraw(b, invId, amount, date);
                if (!check.ok) { toast(check.msg, 'error'); return; }
                inv.withdraws.push({ id: uid('WD'), amount, date, ref, note, locked: false, reversed: false });
                inv.capitalBalance = (inv.capitalBalance || 0) - amount;
                const tx = {
                    ref,
                    type: 'withdraw',
                    investorId: inv.id,
                    amount,
                    date,
                    note,
                    locked: false,
                    reversed: false,
                    balanceBefore: inv.capitalBalance + amount,
                    balanceAfter: inv.capitalBalance
                };
                b.transactions.push(tx);
                logAudit(b, 'withdraw', `${money(amount)} উইথড্র ${inv.name} (${ref})`, { investor: inv.name, amount,
                    ref });
                addNotification(`📤 উইথড্র: ${inv.name} — ${money(amount)}`, 'withdraw', null, b.id, inv.id);
                triggerCommunication('withdraw', `📤 উইথড্র: ${inv.name} — ${money(amount)}`, b.id, inv.id);
            }
            saveState();
            toast(tr('saved'));
            renderInvestment();
        }

        function canWithdraw(biz, investorId, amount, date) {
            const inv = biz.investors.find(i => i.id === investorId);
            if (!inv) return { ok: false, msg: 'ইনভেস্টর পাওয়া যায়নি' };
            const avail = investorAvailableBalance(biz, inv, date);
            if (amount > avail) return { ok: false, msg: `পর্যাপ্ত ব্যালেন্স নেই। অ্যাভেইলেবল: ${money(avail)}` };
            return { ok: true };
        }

        function openEditEntryModal(ref) {
            const b = currentBiz();
            if (!b) return;
            if (isTransactionLocked(b, ref)) { toast('এই ট্রানজেকশন লকড, এডিট করা যাবে না। রিভার্স ট্রানজেকশন ব্যবহার করুন।',
                'error'); return; }
            const tx = b.transactions.find(t => t.ref === ref);
            if (!tx) return;
            const inv = b.investors.find(i => i.id === tx.investorId);
            if (!inv) return;
            const list = tx.type === 'deposit' ? inv.deposits : inv.withdraws;
            const entry = list.find(e => e.ref === ref);
            if (!entry) return;
            const oldAmount = entry.amount,
                oldDate = entry.date,
                oldNote = entry.note || '';
            document.getElementById('modalRoot').innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
                    <div class="modal">
                        <div class="modal-title">${tr('editEntry')} — <span class="mono" style="font-size:13px;color:var(--text-3)">${ref}</span></div>
                        <div style="margin-bottom:10px"><span class="badge ${tx.type==='deposit'?'badge-green':'badge-red'}">${tx.type==='deposit'?tr('deposit'):tr('withdraw')}</span><span style="color:var(--text-3);font-size:12px;margin-left:8px">${inv.name}</span></div>
                        <div class="formrow"><div><label>${tr('amount')}</label><input id="eEntryAmount" type="number" min="0" step="1" value="${entry.amount}"/></div><div><label>${tr('effectiveDate')}</label><input id="eEntryDate" type="date" value="${entry.date}"/></div></div>
                        <label>${tr('note')}</label><input id="eEntryNote" value="${(entry.note||'').replace(/"/g,'&quot;')}"/>
                        <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('cancel')}</button><button class="btn btn-green" onclick="saveEntryEdit('${ref}','${oldAmount}','${oldDate}','${oldNote}')">${tr('save')}</button></div>
                    </div>
                </div>`;
        }

        function saveEntryEdit(ref, oldAmount, oldDate, oldNote) {
            const b = currentBiz();
            if (!b) return;
            if (isTransactionLocked(b, ref)) { toast('এই ট্রানজেকশন লকড, এডিট করা যাবে না。', 'error'); return; }
            const tx = b.transactions.find(t => t.ref === ref);
            if (!tx) return;
            const inv = b.investors.find(i => i.id === tx.investorId);
            if (!inv) return;
            const list = tx.type === 'deposit' ? inv.deposits : inv.withdraws;
            const entry = list.find(e => e.ref === ref);
            if (!entry) return;
            const amount = roundAmount(parseFloat(document.getElementById('eEntryAmount').value));
            const date = document.getElementById('eEntryDate').value || todayStr();
            const note = document.getElementById('eEntryNote').value.trim();
            if (!amount || amount <= 0) { toast(tr('fillRequired')); return; }
            if (tx.type === 'withdraw') { const check = canWithdraw(b, inv.id, amount, date); if (!check.ok) { toast(
                        check.msg, 'error'); return; } }
            if (tx.type === 'deposit') {
                inv.capitalBalance = (inv.capitalBalance || 0) - oldAmount + amount;
            } else {
                inv.capitalBalance = (inv.capitalBalance || 0) + oldAmount - amount;
            }
            entry.amount = amount;
            entry.date = date;
            entry.note = note;
            tx.amount = amount;
            tx.date = date;
            tx.note = note;
            tx.balanceBefore = inv.capitalBalance - (tx.type === 'deposit' ? amount : -amount);
            tx.balanceAfter = inv.capitalBalance;
            logAudit(b, tx.type + '_edit',
                `${tx.type==='deposit'?'ডিপোজিট':'উইথড্র'} এডিট (${ref}) ${inv.name}: ${money(oldAmount)} → ${money(amount)}`, {
                    ref,
                    investor: inv.name,
                    oldAmount,
                    newAmount: amount,
                    oldDate,
                    newDate: date,
                    oldNote,
                    newNote: note
                });
            addNotification(`✏️ ${tr('editEntry')}: ${ref}`, 'info', null, b.id, inv.id);
            saveState();
            closeModal();
            toast(tr('updated'));
            renderInvestment();
        }

            const investorId = document.getElementById('stmtInvestor')?.value || '';
            box.innerHTML = b.investors.filter(inv => !investorId || inv.id === investorId).map(inv => {
                let orders = b.orders.filter(o => o.snapshot?.investors?.some(a => a.investorId === inv.id));
                if (dateFrom) orders = orders.filter(o => o.createDate >= dateFrom);
                if (dateTo) orders = orders.filter(o => o.createDate <= dateTo);
                if (orderNo) orders = orders.filter(o => o.orderNumber.toLowerCase().includes(orderNo.toLowerCase()));

                const dep = investorTotalDeposit(inv);
                const wd = investorTotalWithdraw(inv);
                const avail = investorAvailableBalance(b, inv);
                const util = investorUtilizedInRunningOrders(b, inv.id);
                const ls = getInvestorLossState(inv);
                const closingBal = avail + (inv.totalProfit || 0) - (inv.totalLoss || 0);

                let orderRows = '';

                let runningProfit = inv.profitBalance || 0;

                let runningClaim = runningCapital + runningProfit;

        let _templateTab = 'sms';

        function showTemplateTab(tab) {
            _templateTab = tab;
            const container = document.getElementById('templateEditorContainer');
            if (container) container.innerHTML = renderTemplateEditor(tab);
            // Update tab styles
            document.querySelectorAll('#templateEditorContainer ~ .tabs .tab').forEach((el, idx) => {
                el.classList.toggle('active', (idx === 0 && tab === 'sms') || (idx === 1 && tab === 'email'));
            });
        }

        function renderTemplateEditor(type) {
            const templates = STATE.settings.communication.templates[type] || {};
            const eventKeys = Object.keys(templates);
            if (!eventKeys.length) return `<div class="empty">${tr('noTemplates')}</div>`;
            let html = `<div style="margin-top:8px;max-height:400px;overflow-y:auto;">
                <select id="templateSelect" onchange="loadTemplate()" style="margin-bottom:8px;">
                    ${eventKeys.map(key => `<option value="${key}">${key}</option>`).join('')}
                </select>
                <div id="templateEditor">
                    ${eventKeys.length ? renderTemplateEditorContent(type, eventKeys[0]) : ''}
                </div>
            </div>`;
            return html;
        }

        function renderTemplateEditorContent(type, key) {
            const templates = STATE.settings.communication.templates[type] || {};
            const template = templates[key] || { subject: '', body: '' };
            const isEmail = type === 'email';
            return `
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                    <div><label>${tr('eventType')}</label><input value="${key}" disabled style="background:var(--glass-brd);"/></div>
                    <div><label>${tr('status')}</label>
                        <select id="templateStatus" onchange="saveTemplateStatus('${type}','${key}')">
                            <option value="true" ${template.enabled !== false ? 'selected' : ''}>✅ ${tr('active')}</option>
                            <option value="false" ${template.enabled === false ? 'selected' : ''}>❌ ${tr('inactive')}</option>
                        </select>
                    </div>
                </div>
                ${isEmail ? `<div><label>${tr('subject')}</label><input id="templateSubject" value="${(template.subject||'').replace(/"/g,'&quot;')}" placeholder="Email Subject" onchange="saveTemplate('${type}','${key}')"/></div>` : ''}

                    <textarea id="templateBody" class="template-editor" rows="4" placeholder="Message body with placeholders..." onchange="saveTemplate('${type}','${key}')">${(template.body||'').replace(/"/g,'&quot;')}</textarea>

        function loadTemplate() {
            const select = document.getElementById('templateSelect');
            const type = _templateTab;
            if (!select) return;
            const key = select.value;
            const container = document.getElementById('templateEditor');
            if (container) container.innerHTML = renderTemplateEditorContent(type, key);
        }

        function saveTemplate(type, key) {
            const subject = document.getElementById('templateSubject')?.value || '';
            const body = document.getElementById('templateBody').value;
            if (!body) { toast(tr('fillRequired'), 'error'); return; }
            if (!STATE.settings.communication.templates[type]) STATE.settings.communication.templates[type] = {};
            STATE.settings.communication.templates[type][key] = {
                subject: subject,
                body: body,
                enabled: STATE.settings.communication.templates[type][key]?.enabled !== false
            };
            saveState();
            toast(tr('saved'));
        }

        function saveTemplateStatus(type, key) {
            const status = document.getElementById('templateStatus').value === 'true';
            if (!STATE.settings.communication.templates[type]) STATE.settings.communication.templates[type] = {};
            if (!STATE.settings.communication.templates[type][key]) STATE.settings.communication.templates[type][key] = { body: '' };
            STATE.settings.communication.templates[type][key].enabled = status;
            saveState();
            toast(tr('saved'));
        }

        function renderRulesEditor() {
            const rules = STATE.settings.communication.rules || {};
            const events = Object.keys(rules);
            if (!events.length) return `<div class="empty">${tr('noRules')}</div>`;
            let html =
                `<div style="max-height:300px;overflow-y:auto;"><table style="font-size:11px;"><thead><tr><th>${tr('eventType')}</th><th>${tr('smsEnabled')}</th><th>${tr('emailEnabled')}</th><th>${tr('telegramEnabled')}</th><th>${tr('inappEnabled')}</th></tr></thead><tbody>`;
            for (const ev of events) {
                const r = rules[ev] || { sms: false, email: false, telegram: false, inapp: true };
                html += `
                    <tr>
                        <td>${ev}</td>
                        <td><input type="checkbox" ${r.sms?'checked':''} onchange="updateRule('${ev}','sms',this.checked)" /></td>
                        <td><input type="checkbox" ${r.email?'checked':''} onchange="updateRule('${ev}','email',this.checked)" /></td>
                        <td><input type="checkbox" ${r.telegram?'checked':''} onchange="updateRule('${ev}','telegram',this.checked)" /></td>
                        <td><input type="checkbox" ${r.inapp!==false?'checked':''} onchange="updateRule('${ev}','inapp',this.checked)" /></td>
                    </tr>
                `;
            }
            html += `</tbody></table></div>`;
            return html;
        }

        function updateRule(event, channel, value) {
            if (!STATE.settings.communication.rules[event]) STATE.settings.communication.rules[event] = { sms: false,
                email: false, telegram: false, inapp: true };
            STATE.settings.communication.rules[event][channel] = value;
            saveState();
            toast(tr('saved'));
        }

        function viewCommunicationLogs() {
            const logs = STATE.settings.communication.logs || [];
            if (!logs.length) { toast('কোনো লগ নেই'); return; }
            document.getElementById('modalRoot').innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
                    <div class="modal" style="max-width:900px;">
                        <div class="modal-title">📋 ${tr('communicationLogs')}</div>
                        <div class="table-wrap">
                            <table style="font-size:11px;">
                                <thead><tr><th>${tr('date')}</th><th>${tr('type')}</th><th>${tr('recipient')}</th><th>${tr('content')}</th><th>${tr('status')}</th><th>${tr('action')}</th></tr></thead>
                                <tbody>
                                    ${logs.slice(0,50).map(log => `<tr><td class="mono">${new Date(log.time).toLocaleString()}</td><td>${log.type}</td><td>${log.recipient}</td><td>${log.content.substring(0,50)}...</td><td><span class="badge ${log.status==='sent'?'badge-green':log.status==='failed'?'badge-red':'badge-orange'}">${log.status}</span></td><td>${log.status==='failed'?`<button class="btn btn-ghost btn-sm" onclick="resendLog('${log.id}')">↩️ ${tr('resend')}</button>`:''}</td></tr>`).join('')}

                            </table>
                        </div>
                        <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('cancel')}</button></div>
                    </div>
                </div>`;
        }

        function resendLog(logId) {
            const logs = STATE.settings.communication.logs || [];
            const log = logs.find(l => l.id === logId);
            if (!log) return;
            // Attempt to resend
            if (log.type === 'SMS') {
                sendSMS(log.recipient, log.content, currentBiz());
            } else if (log.type === 'Email') {
                sendEmail(log.recipient, 'Resend: ' + log.content.substring(0, 50), log.content, currentBiz());
            } else if (log.type === 'Telegram') {
                sendTelegramNotification(log.content);
            }
            toast('পুনরায় পাঠানো হয়েছে');
            viewCommunicationLogs();
        }

        // ============================================================
        // TEST COMMUNICATION FUNCTIONS
        // ============================================================
        async function sendTestTelegram() {
            const tg = STATE.settings.telegram;
            if (!tg.enabled || !tg.botToken || !tg.chatId) { toast('টেলিগ্রাম সেটিংস সঠিকভাবে কনফিগার করুন', 'error'); return; }
            try {
                const url = `https://api.telegram.org/bot${tg.botToken}/sendMessage`;
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: tg.chatId,
                        text: `📢 টেস্ট নোটিফিকেশন!\n\nসিস্টেম: ${STATE.businesses.length}টি বিজনেস\nসময়: ${new Date().toLocaleString()}`,
                        parse_mode: 'HTML' }) });
                const result = await response.json();
                if (result.ok) { toast('টেলিগ্রাম টেস্ট সফল! ✅');
                    addNotification('📨 টেলিগ্রাম টেস্ট সফল', 'info'); } else { toast('টেলিগ্রাম টেস্ট ব্যর্থ: ' + (result
                        .description || 'Unknown error'), 'error'); }
            } catch (e) { toast('টেলিগ্রাম টেস্ট ব্যর্থ: ' + e.message, 'error'); }
        }

        async function sendTestSms() {
            const sms = STATE.settings.sms;
            if (!sms.enabled || !sms.apiKey || !sms.apiBaseUrl) { toast('এসএমএস সেটিংস সঠিকভাবে কনফিগার করুন',
                'error'); return; }
            const senderId = sms.useMasking ? sms.maskingSenderId : sms.nonMaskingSenderId;
            if (!senderId) { toast('সেন্ডার আইডি সেট করুন', 'error'); return; }

                            <div class="biz-stats"><div class="biz-stat"><div class="num">${money(t.totalInvestment)}</div><div class="lbl">${tr('totalInvestment')}</div></div><div class="biz-stat"><div class="num" style="color:#1ea672">${money(t.totalProfit)}</div><div class="lbl">${tr('totalProfit')}</div></div><div class="biz-stat"><div class="num" style="color:#e5484d">${money(t.totalLoss)}</div><div class="lbl">${tr('totalLoss')}</div></div><div class="biz-stat"><div class="num" style="color:#f2994a">${money(t.pendingLoss)}</div><div class="lbl">${tr('pendingLoss')}</div></div><div class="biz-stat"><div class="num">${t.totalInvestors}</div><div class="lbl">${tr('totalInvestor')}</div></div><div class="biz-stat"><div class="num">${t.running + t.closed + (t.cancelled||0)}</div><div class="lbl">${tr('totalOrder')}</div></div><div class="biz-stat"><div class="num" style="color:#1ea672">${t.running}</div><div class="lbl">${tr('runningOrder')}</div></div><div class="biz-stat"><div class="num">${t.closed}</div><div class="lbl">${tr('closedOrder')}</div></div></div></div>`;
            });
            html += `<div class="summary-grid"><div class="summary-item"><div class="num">${STATE.businesses.length}</div><div class="lbl">${tr('totalBusiness')}</div></div><div class="summary-item"><div class="num">${totInvestors}</div><div class="lbl">${tr('totalInvestor')}</div></div><div class="summary-item"><div class="num">${money(totInv)}</div><div class="lbl">${tr('totalInvestment')}</div></div><div class="summary-item"><div class="num" style="color:#1ea672">${money(totProfit)}</div><div class="lbl">${tr('totalProfit')}</div></div><div class="summary-item"><div class="num" style="color:#e5484d">${money(totLoss)}</div><div class="lbl">${tr('totalLoss')}</div></div><div class="summary-item"><div class="num" style="color:#f2994a">${money(totPending)}</div><div class="lbl">${tr('pendingLoss')}</div></div></div>
                            <div class="letter-footer"><span class="brand">${tr('appTitle')}</span> © ${new Date().getFullYear()} | ${tr('statementFor')} ${tr('businessList')}</div></div></div>
                    <div class="no-print" style="margin-top:20px;text-align:center;"><button onclick="window.print()" style="padding:10px 28px;background:#1ea672;color:#fff;border:none;border-radius:99px;font-size:13px;cursor:pointer;">🖨️ ${tr('printPdf')}</button><button onclick="window.close()" style="padding:10px 28px;background:#e9ecef;color:#333;border:none;border-radius:99px;font-size:13px;cursor:pointer;margin-left:8px;">${tr('cancel')}</button></div>
                    <script>setTimeout(()=>{if(window.print) window.print();},500);<\/script>
                    </body></html>`;
            win.document.write(html);
            win.document.close();
        }

        // ============================================================
        // RESET MODALS (unchanged)
        // ============================================================
        function openBusinessResetModal() {
            const b = currentBiz();
            if (!b) { toast(tr('noBiz')); return; }
            document.getElementById('modalRoot').innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
                    <div class="modal" style="max-width:500px;">
                        <div class="modal-title" style="color:var(--red)">⚠️ ${tr('resetBusinessData')}</div>
                        <div style="padding:12px 0;font-size:14px;"><p><strong>${tr('business')}:</strong> ${b.name}</p><p style="color:var(--text-3);font-size:13px;margin-top:8px;">${tr('confirmResetBusiness')}</p></div>
                        <div style="margin:12px 0;"><label>${tr('resetConfirm')}</label><input id="resetConfirmInput" placeholder="RESET" style="text-transform:uppercase;font-weight:700;"/></div>
                        <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('cancel')}</button><button class="btn btn-danger" onclick="confirmBusinessReset('${b.id}')">⚠️ ${tr('resetBusinessData')}</button></div>
                    </div>
                </div>`;
        }

        function confirmBusinessReset(bizId) {
            const input = document.getElementById('resetConfirmInput').value.trim().toUpperCase();
            if (input !== 'RESET') { toast('"RESET" টাইপ করুন', 'error'); return; }
            const b = STATE.businesses.find(x => x.id === bizId);
            if (!b) return;
            if (!confirm(`${tr('confirmResetBusiness')}\n\n${tr('business')}: ${b.name}`)) return;
            resetBusinessData(b);
            closeModal();
        }

        function openAllResetModal() {
            document.getElementById('modalRoot').innerHTML = `
                <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
                    <div class="modal" style="max-width:500px;">
                        <div class="modal-title" style="color:var(--red)">⚠️ ${tr('resetAllData')}</div>
                        <div style="padding:12px 0;font-size:14px;"><p>${tr('confirmReset')}</p><p style="color:var(--text-3);font-size:13px;margin-top:8px;">${tr('resetAllConfirm')}</p></div>
                        <div style="margin:12px 0;"><label>${tr('resetAllConfirm')}</label><input id="resetAllConfirmInput" placeholder="RESET ALL" style="text-transform:uppercase;font-weight:700;"/></div>
                        <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">${tr('cancel')}</button><button class="btn btn-danger" onclick="confirmAllReset()">⚠️ ${tr('resetAllData')}</button></div>
                    </div>
                </div>`;
        }

        function confirmAllReset() {
            const input = document.getElementById('resetAllConfirmInput').value.trim().toUpperCase();
            if (input !== 'RESET ALL') { toast('"RESET ALL" টাইপ করুন', 'error'); return; }
            if (!confirm(tr('confirmReset'))) return;
            resetAllData();
            closeModal();
        }

        function resetBusinessData(b) {
            const mainInv = b.investors.find(i => i.isMain) || b.investors[0];
            b.investors = [mainInv];
            mainInv.deposits = [];
            mainInv.withdraws = [];
            mainInv.lossBalance = 0;
            mainInv.totalProfit = 0;
            mainInv.totalLoss = 0;
            mainInv.recoveredLoss = 0;
            mainInv.pendingLoss = 0;
            mainInv.netPayable = 0;
            mainInv.paidProfit = 0;
            mainInv.pendingProfit = 0;
            mainInv.sharingHistory = [{ rate: 0, effectiveDate: todayStr() }];
            mainInv.commissionRateHistory = [{ rate: 60, effectiveDate: todayStr() }];
            mainInv.commissionEarned = 0;
            mainInv.commissionWithdrawn = 0;
            mainInv.commissionPending = 0;
            mainInv.commissionHistory = [];
            mainInv.capitalBalance = 0;
            mainInv.profitBalance = 0;
            b.orders = [];
            b.transactions = [];
            b.orderSeq = 0;
            b.commissionLedger = { totalEarned: 0, totalWithdrawn: 0, pending: 0, history: [] };
            b.costLedger = { totalCost: 0, orders: [] };
            b.mainInvestorHistory = [];
            b.auditLog = [{ time: new Date().toISOString(), action: 'business_reset', detail: `বিজনেস রিসেট: ${b.name}`,
                user: STATE.user.name }];
            addNotification(`🔄 ${tr('resetBusinessData')}: ${b.name}`, 'warning', null, b.id);
            saveState();
            toast(tr('resetSuccess'));
            renderAll();
        }

        function resetAllData() {
            const mainName = STATE.businesses[0]?.name || 'Main Business';
            const mainInvestor = {
                id: uid('INV'),
                name: 'M. Rashel',
                mobile: '',
                email: '',
                active: true,
                isMain: true,
                deposits: [],
                withdraws: [],
                sharingHistory: [{ rate: 0, effectiveDate: todayStr() }],
                commissionRateHistory: [{ rate: 60, effectiveDate: todayStr() }],
                lossBalance: 0,
                totalProfit: 0,
                totalLoss: 0,
                recoveredLoss: 0,
                pendingLoss: 0,
                netPayable: 0,
                paidProfit: 0,
                pendingProfit: 0,
                commissionEarned: 0,
                commissionWithdrawn: 0,
                commissionPending: 0,
                commissionHistory: [],
                capitalBalance: 0,
                profitBalance: 0
            };
            const biz = {
                id: uid('BIZ'),
                name: mainName,
                address: '',
                phone: '',
                email: '',
                website: '',
                description: '',
                status: 'active',
                investors: [mainInvestor],
                orders: [],
                transactions: [],
                auditLog: [{ time: new Date().toISOString(), action: 'system_reset', detail: 'সিস্টেম রিসেট করা হয়েছে',
                    user: STATE.user.name }],
                orderSeq: 0,
                commissionLedger: { totalEarned: 0, totalWithdrawn: 0, pending: 0, history: [] },
                costLedger: { totalCost: 0, orders: [] },
                mainInvestorHistory: []
            };
            STATE.businesses = [biz];
            STATE.activeBusinessId = biz.id;
            STATE.notifications = [];
            addNotification('🔄 সিস্টেম রিসেট করা হয়েছে', 'warning');
            saveState();
            toast(tr('resetSuccess'));
            renderAll();
        }

        // ============================================================
        // LANG / THEME
        // ============================================================
        function setLang(l) { STATE.lang = l;
            saveState();
            renderAll(); }

        function setTheme(t) { STATE.theme = t;
            document.documentElement.setAttribute('data-theme', t);
            saveState();
            renderAll(); }

        function toggleLang() { setLang(STATE.lang === 'bn' ? 'en' : 'bn'); }

        function toggleTheme() { setTheme(STATE.theme === 'dark' ? 'light' : 'dark'); }

        function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

        // ============================================================
        // INIT
        // ============================================================
        (async function init() {
            const loaded = loadState();
            if (!loaded) seedDemo();
            document.documentElement.setAttribute('data-theme', STATE.theme);
            if (!STATE.activeBusinessId && STATE.businesses.length) STATE.activeBusinessId = STATE.businesses[0].id;
            renderAll();
            toast('সিস্টেম লোড হয়েছে ✅', 'success');

            window.addEventListener('resize', () => {
                if (window.innerWidth > 900 && sidebarOpen) {
                    sidebarOpen = false;
                    document.getElementById('sidebar').classList.remove('open');
                    document.getElementById('sidebarOverlay').classList.remove('active');
                }
            });

            document.addEventListener('click', function(e) {
                const wrapper = document.querySelector('.notif-wrapper');
                if (wrapper && !wrapper.contains(e.target)) {
                    if (_notifOpen) {
                        _notifOpen = false;
                        const dropdown = document.getElementById('notifDropdownFixed');
                        const bell = document.getElementById('notifBell');
                        if (dropdown) dropdown.classList.remove('open');
                        if (bell) bell.classList.remove('open');
                    }
                }
            });
        })();
    </script>
</body>
</html>
